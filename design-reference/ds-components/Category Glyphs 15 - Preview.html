<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מהמקור — אייקוני קטגוריות (15)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&family=DM+Sans:wght@400;500;600&family=Heebo:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#2e6853; --green-dark:#2E4A2E; --gold:#8b6914;
    --bg:#F5F0E8; --surface:#FFFDF8; --ink:#1C1A17; --muted:#6b6b6b; --line:#e6ddcd;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'DM Sans','Heebo',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #root{max-width:1120px;margin:0 auto;padding:56px 40px 96px;}
  .serif{font-family:'Frank Ruhl Libre',serif;}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState } = React;

/* ── Family hand: viewBox 0 0 120 120 · fill none · stroke currentColor
   · strokeWidth 2 · round caps/joins · single weight · organic curves ── */
function Svg({ size = 80, children, ...props }) {
  return (
    <svg viewBox="0 0 120 120" width={size} height={size} fill="none"
      stroke="currentColor" strokeWidth="2" strokeLinecap="round"
      strokeLinejoin="round" {...props}>
      {children}
    </svg>
  );
}

/* 1 · בשר ודגים — fish + bone (both) */
function MeatFishIcon(props){return(<Svg {...props}>
  <path d="M30,72 C40,58 64,56 76,72 C64,86 40,84 30,72 Z"/>
  <path d="M30,72 L19,62 C22,68 22,76 19,82 Z"/>
  <path d="M60,61 C57,70 60,79 60,79"/>
  <circle cx="70" cy="67" r="1.6" fill="currentColor" stroke="none"/>
  <path d="M72,35 L86,49"/>
  <circle cx="69" cy="32" r="3.6"/>
  <circle cx="75" cy="38" r="3.6"/>
  <circle cx="83" cy="46" r="3.6"/>
  <circle cx="89" cy="52" r="3.6"/>
</Svg>)}

/* 2 · חלב וגבינות — milk carton + cheese wedge */
function DairyIcon(props){return(<Svg {...props}>
  <path d="M31,56 L31,91 L52,91 L52,56"/>
  <path d="M31,56 L41,44 L52,56"/>
  <path d="M41,44 L41,56"/>
  <path d="M60,85 C60,81 62,80 65,80 L90,72 L90,85 Z"/>
  <path d="M60,85 C72,82 86,82 90,85"/>
  <circle cx="76" cy="80" r="2" fill="currentColor" stroke="none"/>
  <circle cx="84" cy="77" r="1.6" fill="currentColor" stroke="none"/>
</Svg>)}

/* 3 · לחמים ואפייה — bread loaf */
function BreadIcon(props){return(<Svg {...props}>
  <path d="M30,78 C28,54 92,54 90,78 Z"/>
  <path d="M30,78 L90,78"/>
  <path d="M45,60 L52,71"/>
  <path d="M59,57 L66,69"/>
  <path d="M73,60 L80,71"/>
</Svg>)}

/* 4 · ירקות — carrot w/ bold green top */
function VegetablesIcon(props){return(<Svg {...props}>
  <path d="M49,52 C52,84 57,98 60,98 C63,98 68,72 71,52 C64,49 56,49 49,52 Z"/>
  <path d="M55,52 L48,33"/>
  <path d="M60,51 L60,30"/>
  <path d="M65,52 L72,33"/>
  <path d="M54,64 L57,63"/>
  <path d="M61,75 L64,74"/>
</Svg>)}

/* 5 · פירות — apple w/ leaf */
function FruitsIcon(props){return(<Svg {...props}>
  <path d="M60,48 C53,40 39,42 39,60 C39,80 52,92 60,92 C68,92 81,80 81,60 C81,42 67,40 60,48 Z"/>
  <path d="M60,48 L61,34"/>
  <path d="M61,38 C68,31 76,35 73,43 C66,46 62,43 61,38 Z"/>
</Svg>)}

/* 6 · שמנים — oil bottle + olive sprig */
function OilsIcon(props){return(<Svg {...props}>
  <path d="M50,54 L50,40 L70,40 L70,54"/>
  <path d="M53,40 L53,35 L67,35"/>
  <path d="M44,54 L76,54 L76,90 C76,95 72,98 67,98 L53,98 C48,98 44,95 44,90 Z"/>
  <path d="M67,37 C75,31 81,30 88,30"/>
  <path d="M74,33 C72,27 78,25 80,31"/>
  <path d="M84,31 C88,26 93,30 88,35"/>
  <path d="M80,38 C77,38 76,44 80,45 C84,44 83,38 80,38 Z"/>
</Svg>)}

/* 7 · דבש — honey jar + vertical grooved dipper + drip */
function HoneyIcon(props){return(<Svg {...props}>
  <path d="M44,52 L76,52 L76,59 L44,59 Z"/>
  <path d="M46,59 L46,90 C46,95 50,98 55,98 L65,98 C70,98 74,95 74,90 L74,59"/>
  <path d="M60,28 L60,46"/>
  <path d="M55,46 C55,58 65,58 65,46"/>
  <path d="M56,50 L64,50"/>
  <path d="M55,53 L65,53"/>
  <path d="M60,58 C60,62 58,64 58,67 C58,70 62,70 62,67 C62,64 60,62 60,58 Z"/>
</Svg>)}

/* 8 · ביצים — whole egg + cracked half */
function EggsIcon(props){return(<Svg {...props}>
  <path d="M66,38 C53,38 49,60 53,76 C56,89 76,89 79,75 C82,59 79,38 66,38 Z"/>
  <path d="M30,74 C31,86 51,86 52,74"/>
  <path d="M30,74 L35,69 L40,74 L45,69 L52,74"/>
</Svg>)}

/* 9 · מותססים וכבושים — clamp-lid pickling jar + spears */
function FermentedIcon(props){return(<Svg {...props}>
  <path d="M40,52 L40,90 C40,95 44,98 49,98 L71,98 C76,98 80,95 80,90 L80,52"/>
  <path d="M44,52 C44,46 48,44 52,44 L68,44 C72,44 76,46 76,52"/>
  <path d="M51,44 L51,35 L69,35 L69,44"/>
  <path d="M51,35 C53,29 67,29 69,35"/>
  <path d="M55,58 L55,90"/>
  <path d="M60,56 L60,92"/>
  <path d="M65,58 L65,90"/>
</Svg>)}

/* 10 · יין, בירה ומשקאות — wine glass */
function DrinksIcon(props){return(<Svg {...props}>
  <path d="M44,34 L76,34 C76,58 65,64 60,64 C55,64 44,58 44,34 Z"/>
  <path d="M47,46 C56,52 64,52 73,46"/>
  <path d="M60,64 L60,88"/>
  <path d="M46,90 C53,85 67,85 74,90"/>
</Svg>)}

/* 11 · שוקולד וממתקים בוטיק — chocolate bar w/ snapped piece */
function ChocolateIcon(props){return(<Svg {...props}>
  <path d="M36,46 L74,46 L74,88 L36,88 Z"/>
  <path d="M74,46 L90,42 L90,58 L74,62"/>
  <path d="M50,46 L50,88"/>
  <path d="M62,46 L62,88"/>
  <path d="M36,60 L74,60"/>
  <path d="M36,74 L74,74"/>
</Svg>)}

/* 12 · תבלינים וצמחי תיבול — mortar & pestle + sprig */
function SpicesIcon(props){return(<Svg {...props}>
  <path d="M34,64 C46,70 74,70 86,64"/>
  <path d="M36,64 C40,86 80,86 84,64"/>
  <path d="M68,40 L56,64"/>
  <path d="M64,38 L73,42"/>
  <path d="M50,64 L46,46"/>
  <path d="M46,46 C40,44 37,48 41,53"/>
  <path d="M48,54 C44,55 42,59 46,62"/>
</Svg>)}

/* 13 · סבונים טבעיים — soap bar + suds */
function SoapIcon(props){return(<Svg {...props}>
  <path d="M34,64 C34,57 39,54 46,54 L74,54 C81,54 86,57 86,64 L86,76 C86,83 81,86 74,86 L46,86 C39,86 34,83 34,76 Z"/>
  <path d="M40,60 C50,58 70,58 80,60"/>
  <circle cx="78" cy="42" r="5"/>
  <circle cx="90" cy="48" r="3"/>
  <circle cx="84" cy="33" r="2.4"/>
</Svg>)}

/* 14 · קרמים ושמני גוף — cosmetic cream tub w/ lid */
function CreamsIcon(props){return(<Svg {...props}>
  <path d="M44,52 C44,46 76,46 76,52"/>
  <path d="M40,52 L80,52 L80,61 L40,61 Z"/>
  <path d="M42,61 L42,84 C42,89 46,92 51,92 L69,92 C74,92 78,89 78,84 L78,61"/>
</Svg>)}

/* 15 · צמחי מרפא ותוספים — bound bundle of hanging dried herbs */
function MedicinalHerbsIcon(props){return(<Svg {...props}>
  <path d="M49,38 L71,38"/>
  <path d="M69,38 L74,34"/>
  <path d="M69,38 L74,42"/>
  <path d="M56,38 L50,86"/>
  <path d="M60,38 L60,90"/>
  <path d="M64,38 L72,86"/>
  <path d="M52,56 C46,53 44,59 51,61 Z"/>
  <path d="M51,72 C45,70 44,76 51,77 Z"/>
  <path d="M60,52 C54,49 52,55 59,57 Z"/>
  <path d="M60,70 C66,68 68,74 61,75 Z"/>
  <path d="M67,56 C73,53 75,59 68,61 Z"/>
  <path d="M69,72 C75,70 76,76 69,77 Z"/>
</Svg>)}

const CATEGORY_ICONS = {
  meatFish:       { Icon: MeatFishIcon,       he: "בשר ודגים" },
  dairy:          { Icon: DairyIcon,          he: "חלב וגבינות" },
  bread:          { Icon: BreadIcon,          he: "לחמים ואפייה" },
  vegetables:     { Icon: VegetablesIcon,     he: "ירקות" },
  fruits:         { Icon: FruitsIcon,         he: "פירות" },
  oils:           { Icon: OilsIcon,           he: "שמנים" },
  honey:          { Icon: HoneyIcon,          he: "דבש" },
  eggs:           { Icon: EggsIcon,           he: "ביצים" },
  fermented:      { Icon: FermentedIcon,      he: "מותססים וכבושים" },
  drinks:         { Icon: DrinksIcon,         he: "יין, בירה ומשקאות" },
  chocolate:      { Icon: ChocolateIcon,      he: "שוקולד וממתקים בוטיק" },
  spices:         { Icon: SpicesIcon,         he: "תבלינים וצמחי תיבול" },
  soap:           { Icon: SoapIcon,           he: "סבונים טבעיים" },
  creams:         { Icon: CreamsIcon,         he: "קרמים ושמני גוף" },
  medicinalHerbs: { Icon: MedicinalHerbsIcon, he: "צמחי מרפא ותוספים" },
};

const ENTRIES = Object.values(CATEGORY_ICONS);

function Tab({ id, active, onClick, children }){
  return (
    <button onClick={() => onClick(id)} style={{
      font:"500 15px 'DM Sans', sans-serif", cursor:"pointer",
      padding:"9px 18px", borderRadius:"8px", border:"1px solid",
      borderColor: active ? "var(--green)" : "var(--line)",
      background: active ? "var(--green)" : "transparent",
      color: active ? "#fff" : "var(--muted)", transition:"all .18s ease-in-out",
    }}>{children}</button>
  );
}

function GlyphCell({ entry, size, showLabel, tint }){
  const { Icon, he } = entry;
  return (
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:"12px"}}>
      <div style={{
        display:"grid",placeItems:"center",
        width: Math.max(size+28, 64), height: Math.max(size+28, 64),
        borderRadius:"14px", background:"var(--surface)",
        border:"1px solid var(--line)", color: tint,
        boxShadow:"0 1px 2px rgba(28,26,23,.04)",
      }}>
        <Icon size={size}/>
      </div>
      {showLabel && <div style={{
        font:"400 13px 'DM Sans', sans-serif", color:"var(--muted)",
        textAlign:"center", maxWidth: size+40, lineHeight:1.35,
      }}>{he}</div>}
    </div>
  );
}

function Sheet({ size, showLabel, tint }){
  return (
    <div style={{
      display:"grid", gap: size>=70 ? "26px" : "18px",
      gridTemplateColumns:`repeat(auto-fill, minmax(${Math.max(size+40,100)}px, 1fr))`,
      justifyItems:"center",
    }}>
      {ENTRIES.map((e,i)=> <GlyphCell key={i} entry={e} size={size} showLabel={showLabel} tint={tint}/>)}
    </div>
  );
}

function Lineup(){
  return (
    <div style={{
      display:"flex", flexWrap:"wrap", gap:"22px", alignItems:"center",
      padding:"30px 26px", background:"var(--surface)", borderRadius:"16px",
      border:"1px solid var(--line)", color:"var(--green)",
    }}>
      {ENTRIES.map((e,i)=>{const {Icon}=e;return <Icon key={i} size={80}/>;})}
    </div>
  );
}

function SectionTitle({ children }){
  return <h2 className="serif" style={{
    margin:"0 0 22px",fontSize:"22px",fontWeight:500,color:"var(--ink)",
    paddingBottom:"10px",borderBottom:"1px solid var(--line)",
  }}>{children}</h2>;
}

function Header(){
  return (
    <header style={{marginBottom:"40px"}}>
      <div style={{display:"flex",alignItems:"center",gap:"10px",marginBottom:"16px"}}>
        <span style={{width:"10px",height:"10px",borderRadius:"3px",background:"var(--green)"}}></span>
        <span style={{width:"10px",height:"10px",borderRadius:"3px",background:"var(--gold)"}}></span>
        <span style={{font:"500 13px 'DM Sans'",letterSpacing:".04em",color:"var(--muted)"}}>מהמקור · אייקוני קטגוריות</span>
      </div>
      <h1 className="serif" style={{margin:"0 0 12px",fontSize:"46px",fontWeight:700,color:"var(--ink)",lineHeight:1.15}}>
        15 גליפים מצוירים ביד
      </h1>
      <p style={{margin:0,maxWidth:"640px",color:"var(--muted)",fontSize:"17px",lineHeight:1.6}}>
        משפחה אחת, יד אחת — קו יחיד במשקל אחיד (stroke 2, currentColor),
        קצוות מעוגלים ועקומות אורגניות. המטאפורה נבחרה לזיהוי מיידי; כל גליף נקרא ללא תווית.
      </p>
    </header>
  );
}

function App(){
  const [tab, setTab] = useState("labelled");
  const [tint, setTint] = useState("var(--green)");
  return (
    <React.Fragment>
      <Header/>

      <div style={{display:"flex",flexWrap:"wrap",gap:"10px",marginBottom:"14px"}}>
        <Tab id="labelled" active={tab==="labelled"} onClick={setTab}>גיליון מתויג · 80 / 28 / 20</Tab>
        <Tab id="blind" active={tab==="blind"} onClick={setTab}>מבחן עיוור · ללא תוויות</Tab>
        <Tab id="lineup" active={tab==="lineup"} onClick={setTab}>מבחן שורה · 80px</Tab>
      </div>

      <div style={{display:"flex",gap:"8px",marginBottom:"36px",alignItems:"center"}}>
        <span style={{font:"400 13px 'DM Sans'",color:"var(--muted)"}}>צבע:</span>
        {[["ירוק","var(--green)"],["זהב","var(--gold)"],["דיו","var(--ink)"]].map(([n,c])=>(
          <button key={c} onClick={()=>setTint(c)} style={{
            cursor:"pointer",font:"400 13px 'DM Sans'",padding:"5px 12px",borderRadius:"8px",
            border:"1px solid var(--line)",background: tint===c?"var(--ink)":"transparent",
            color: tint===c?"#fff":"var(--muted)",
          }}>{n}</button>
        ))}
      </div>

      {tab==="labelled" && (
        <div style={{display:"flex",flexDirection:"column",gap:"56px"}}>
          <section>
            <SectionTitle>80px — נוכחות מלאה</SectionTitle>
            <Sheet size={80} showLabel tint={tint}/>
          </section>
          <section>
            <SectionTitle>28px — מבחן צללית</SectionTitle>
            <Sheet size={28} showLabel tint={tint}/>
          </section>
          <section>
            <SectionTitle>20px — קצה הקריאוּת</SectionTitle>
            <Sheet size={20} showLabel tint={tint}/>
          </section>
        </div>
      )}

      {tab==="blind" && (
        <section>
          <SectionTitle>מבחן זיהוי עיוור — נסו לנקוב בשם כל גליף לפני קריאת התוויות</SectionTitle>
          <Sheet size={72} showLabel={false} tint={tint}/>
        </section>
      )}

      {tab==="lineup" && (
        <section>
          <SectionTitle>כל 15 בשורה אחת — מבחן "יד אחת"</SectionTitle>
          <Lineup/>
        </section>
      )}
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
