<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProfileCompletenessCard — yellow&gt;70</title>
<!-- DS stylesheet: provides Frank Ruhl Libre, Cormorant Garamond, DM Sans, Heebo + tokens -->
<link rel="stylesheet" href="styles.css">
<!-- Icons: official Phosphor glyphs, inlined as SVG (never Lucide) -->
<style>
  :root{
    --cream:        #F5F0E8;  /* bg-background */
    --stage:        #EBE4D6;  /* a half-step deeper cream so the card reads */
    --card:         #F5F0E8;  /* card stays cream, never white */
    --ink:          #1C1A17;  /* text-text */
    --muted:        #5C584F;  /* text-fg-muted */
    --border:       #E5DFD3;  /* border-border */
    --primary:      #2E6853;  /* text-primary / action-primary */
    --primary-soft: rgba(46,104,83,.08);
    --ring-track:   #E5DFD3;
    --ring-yellow:  #C98600;  /* ProgressRing hex exception — unchanged */
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{
    background:var(--stage);
    color:var(--ink);
    font-family:'DM Sans','Heebo',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:56px 24px;
    -webkit-font-smoothing:antialiased;
  }
  .num{ font-family:'Cormorant Garamond',serif; font-weight:600; letter-spacing:.01em; }

  .stage-wrap{ width:100%; max-width:600px; }
  .stage-label{
    font-family:'DM Sans','Heebo',sans-serif;
    font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--muted); margin:0 4px 14px; font-weight:600;
  }

  /* ── Card ─────────────────────────────────────── */
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:32px;
    box-shadow:0 1px 2px rgba(28,26,23,.03), 0 8px 28px -18px rgba(28,26,23,.18);
  }

  .head{ display:flex; align-items:flex-start; gap:18px; }

  /* progress ring */
  .ring{ flex:none; }
  .ring text{ font-family:'Cormorant Garamond',serif; }

  .head-copy{ flex:1; min-width:0; }
  h2.headline{
    font-family:'Frank Ruhl Libre',serif;
    font-weight:700;
    font-size:27px;
    line-height:1.2;
    color:var(--primary);
    margin:2px 0 0;
  }
  .sub{
    font-size:15px;
    color:var(--muted);
    margin:6px 0 0;
    line-height:1.5;
  }
  .sub b{ color:var(--ink); font-weight:600; }

  /* ── Checklist ────────────────────────────────── */
  .checklist{
    list-style:none;
    margin:24px 0 0;
    padding:18px 0 0;
    border-top:1px solid var(--border);
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:9px 8px;
    border-radius:10px;
  }
  .marker{
    flex:none;
    width:22px; height:22px;
    display:flex; align-items:center; justify-content:center;
  }
  .marker svg{ width:19px; height:19px; display:block; }
  .row-label{ font-size:15.5px; line-height:1.3; }
  .row-state{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }

  /* completed rows — calm primary check, slightly receded label */
  .row.done .marker{ color:var(--primary); }
  .row.done .row-label{ color:var(--muted); }

  /* remaining / next-step row — the single emphasized field */
  .row.next{
    background:var(--primary-soft);
    padding:12px 12px;
    align-items:flex-start;
  }
  .row.next .marker{ color:var(--primary); margin-top:1px; }
  .next-copy{ display:flex; flex-direction:column; gap:3px; }
  .next-eyebrow{
    font-size:10.5px; letter-spacing:.13em; text-transform:uppercase;
    font-weight:700; color:var(--primary);
  }
  .row.next .row-label{ color:var(--ink); font-weight:600; font-size:16px; }

  /* ── CTA ──────────────────────────────────────── */
  .cta-wrap{ margin-top:22px; }
  .cta{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    min-height:44px;
    padding:0 26px;
    border-radius:9999px;
    background:var(--primary);
    color:#FFFEFB;
    font-family:'DM Sans','Heebo',sans-serif;
    font-weight:600; font-size:15.5px;
    text-decoration:none;
    transition:background .18s ease;
  }
  .cta:hover{ background:#26543F; }
  .cta:focus-visible{ outline:2px solid var(--primary); outline-offset:3px; }
  .cta svg{ width:18px; height:18px; }
</style>
</head>
<body>
  <div class="stage-wrap">
    <p class="stage-label">ProfileCompletenessCard · yellow&gt;70</p>

    <section class="card" aria-labelledby="pc-headline">
      <div class="head">
        <!-- ProgressRing: hex exception unchanged (track #E5DFD3, yellow #C98600) -->
        <svg class="ring" width="56" height="56" viewBox="0 0 56 56" role="progressbar"
             aria-valuenow="80" aria-valuemin="0" aria-valuemax="100"
             aria-label="השלמת פרופיל: 80%">
          <circle cx="28" cy="28" r="25.5" fill="none" stroke="#E5DFD3" stroke-width="5"></circle>
          <circle cx="28" cy="28" r="25.5" fill="none" stroke="#C98600" stroke-width="5"
                  stroke-linecap="round"
                  stroke-dasharray="128.18 160.22"
                  transform="rotate(-90 28 28)"></circle>
          <text x="50%" y="50%" dominant-baseline="central" text-anchor="middle"
                font-size="15" font-weight="600" fill="#1C1A17">80%</text>
        </svg>

        <div class="head-copy">
          <h2 class="headline" id="pc-headline" aria-live="polite">כמעט שם — <span class="num">80%</span> מוכן</h2>
          <p class="sub">נשאר <b>פרט אחד</b> עד שהפרופיל מלא.</p>
        </div>
      </div>

      <!-- Checklist replaces the single next-step line, ONLY in yellow>70 -->
      <ul class="checklist" role="list" aria-label="פרטי השלמת הפרופיל">
        <li class="row done" role="listitem">
          <span class="marker" aria-hidden="true"><svg viewBox="0 0 256 256" fill="currentColor"><path d="M232.49,80.49l-128,128a12,12,0,0,1-17,0l-56-56a12,12,0,1,1,17-17L96,183,215.51,63.51a12,12,0,0,1,17,17Z"></path></svg></span>
          <span class="row-label">עיר</span>
          <span class="row-state">— הושלם</span>
        </li>
        <li class="row done" role="listitem">
          <span class="marker" aria-hidden="true"><svg viewBox="0 0 256 256" fill="currentColor"><path d="M232.49,80.49l-128,128a12,12,0,0,1-17,0l-56-56a12,12,0,1,1,17-17L96,183,215.51,63.51a12,12,0,0,1,17,17Z"></path></svg></span>
          <span class="row-label">מיקום על המפה</span>
          <span class="row-state">— הושלם</span>
        </li>
        <li class="row done" role="listitem">
          <span class="marker" aria-hidden="true"><svg viewBox="0 0 256 256" fill="currentColor"><path d="M232.49,80.49l-128,128a12,12,0,0,1-17,0l-56-56a12,12,0,1,1,17-17L96,183,215.51,63.51a12,12,0,0,1,17,17Z"></path></svg></span>
          <span class="row-label">פרטי קשר (טלפון/אינסטגרם)</span>
          <span class="row-state">— הושלם</span>
        </li>
        <li class="row done" role="listitem">
          <span class="marker" aria-hidden="true"><svg viewBox="0 0 256 256" fill="currentColor"><path d="M232.49,80.49l-128,128a12,12,0,0,1-17,0l-56-56a12,12,0,1,1,17-17L96,183,215.51,63.51a12,12,0,0,1,17,17Z"></path></svg></span>
          <span class="row-label">קטגוריה</span>
          <span class="row-state">— הושלם</span>
        </li>

        <li class="row next" role="listitem" aria-current="step">
          <span class="marker" aria-hidden="true"><svg viewBox="0 0 256 256" fill="currentColor"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Z"></path></svg></span>
          <span class="next-copy">
            <span class="next-eyebrow">השלב הבא</span>
            <span class="row-label">תמונה ראשית</span>
          </span>
          <span class="row-state">— חסר</span>
        </li>
      </ul>

      <div class="cta-wrap">
        <a class="cta" href="/settings" aria-label="השלימי את הפרופיל שלך">
          השלימי פרופיל
          <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M228,128a12,12,0,0,1-12,12H69l43.52,43.51a12,12,0,0,1-17,17l-64-64a12,12,0,0,1,0-17l64-64a12,12,0,0,1,17,17L69,116H216A12,12,0,0,1,228,128Z"></path></svg>
        </a>
      </div>
    </section>
  </div>
</body>
</html>
