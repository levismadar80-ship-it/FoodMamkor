<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מהמקור — אייקוני קטגוריות (18)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&family=DM+Sans:wght@400;500;600&family=Heebo:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#2e6853; --green-dark:#2E4A2E; --gold:#8b6914;
    --bg:#F5F0E8; --surface:#FFFDF8; --ink:#1C1A17; --muted:#6b6b6b; --line:#e6ddcd;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'DM Sans','Heebo',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #root{max-width:1120px;margin:0 auto;padding:56px 40px 96px;}
  .serif{font-family:'Frank Ruhl Libre',serif;}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState } = React;

/* ── KEYLINE SYSTEM ──────────────────────────────────────────────
   viewBox 0 0 120 120 · stroke 2 · currentColor · round caps/joins
   6px trim (live 6–114) · each glyph seats on ONE base:
     ○ circle Ø85 · ▭ landscape 84×56 · ▯ portrait 52×84
─────────────────────────────────────────────────────────────────*/
function Keyline({ shape }){
  return (
    <g stroke="currentColor" strokeWidth="1" fill="none" opacity="0.18"
       strokeDasharray="3 3" strokeLinecap="round">
      <rect x="6" y="6" width="108" height="108" rx="4"/>
      <line x1="60" y1="6" x2="60" y2="114"/>
      <line x1="6" y1="60" x2="114" y2="60"/>
      {shape==="circle"    && <circle cx="60" cy="60" r="42.5"/>}
      {shape==="landscape" && <rect x="18" y="32" width="84" height="56" rx="3"/>}
      {shape==="portrait"  && <rect x="34" y="18" width="52" height="84" rx="3"/>}
    </g>
  );
}
function Svg({ size = 80, keyline, base, children, ...props }) {
  return (
    <svg viewBox="0 0 120 120" width={size} height={size} fill="none"
      stroke="currentColor" strokeWidth="2" strokeLinecap="round"
      strokeLinejoin="round" {...props}>
      {keyline && <Keyline shape={base}/>}
      {children}
    </svg>
  );
}

/* 1 · בשר — frenched chop: bone knuckle + meat medallion [landscape] */
function MeatIcon({keyline,...p}){return(<Svg base="landscape" keyline={keyline} {...p}>
  <path d="M38,72 C36,58 50,52 60,52 C70,52 84,58 82,72 C80,86 64,90 56,88 C46,85 40,80 38,72 Z"/>
  <path d="M48,74 C56,70 68,70 74,74"/>
  <path d="M55,52 L56,40"/>
  <path d="M65,52 L64,40"/>
  <circle cx="53" cy="36" r="4.4"/>
  <circle cx="62" cy="34" r="4.4"/>
</Svg>)}

/* 2 · דגים — clean fish [landscape] */
function FishIcon({keyline,...p}){return(<Svg base="landscape" keyline={keyline} {...p}>
  <path d="M30,60 C42,44 70,42 84,60 C70,78 42,76 30,60 Z"/>
  <path d="M30,60 L18,49 C22,56 22,64 18,71 Z"/>
  <path d="M66,49 C62,60 66,71 66,71"/>
  <circle cx="76" cy="55" r="1.8" fill="currentColor" stroke="none"/>
</Svg>)}

/* 3 · חלב וגבינות — cheese wedge + 2 big holes [landscape] */
function DairyIcon({keyline,...p}){return(<Svg base="landscape" keyline={keyline} {...p}>
  <path d="M28,82 C28,77 30,76 34,76 L92,58 L92,82 Z"/>
  <path d="M28,82 C44,79 80,79 92,82"/>
  <circle cx="58" cy="73" r="4.2"/>
  <circle cx="78" cy="69" r="3.2"/>
</Svg>)}

/* 4 · לחמים ואפייה — loaf [landscape] ANCHOR */
function BreadIcon({keyline,...p}){return(<Svg base="landscape" keyline={keyline} {...p}>
  <path d="M30,80 C28,52 92,52 90,80 Z"/>
  <path d="M30,80 L90,80"/>
  <path d="M45,62 L52,73"/>
  <path d="M59,59 L66,71"/>
  <path d="M73,62 L80,73"/>
</Svg>)}

/* 5 · ירקות — carrot + green top [portrait] */
function VegetablesIcon({keyline,...p}){return(<Svg base="portrait" keyline={keyline} {...p}>
  <path d="M49,52 C52,84 57,100 60,100 C63,100 68,72 71,52 C64,49 56,49 49,52 Z"/>
  <path d="M55,52 L48,32"/>
  <path d="M60,51 L60,28"/>
  <path d="M65,52 L72,32"/>
  <path d="M54,65 L57,64"/>
  <path d="M61,77 L64,76"/>
</Svg>)}

/* 6 · פירות — apple + leaf + dimple [circle] ANCHOR */
function FruitsIcon({keyline,...p}){return(<Svg base="circle" keyline={keyline} {...p}>
  <path d="M60,50 C57,46 53,44 48,44 C40,44 38,53 38,62 C38,82 51,93 60,93 C69,93 82,82 82,62 C82,53 80,44 72,44 C67,44 63,46 60,50 Z"/>
  <path d="M60,50 L61,36"/>
  <path d="M61,39 C68,32 77,36 73,45 C66,48 62,45 61,39 Z"/>
</Svg>)}

/* 7 · שמנים — oil bottle + olive sprig [portrait] */
function OilsIcon({keyline,...p}){return(<Svg base="portrait" keyline={keyline} {...p}>
  <path d="M50,56 L50,42 L70,42 L70,56"/>
  <path d="M53,42 L53,37 L67,37"/>
  <path d="M44,56 L76,56 L76,92 C76,97 72,100 67,100 L53,100 C48,100 44,97 44,92 Z"/>
  <path d="M67,39 C75,33 81,32 88,32"/>
  <path d="M74,35 C72,29 78,27 80,33"/>
  <path d="M84,33 C88,28 93,32 88,37"/>
  <path d="M80,40 C77,40 76,46 80,47 C84,46 83,40 80,40 Z"/>
</Svg>)}

/* 8 · דבש — jar + spiral honey dipper [portrait] */
function HoneyIcon({keyline,...p}){return(<Svg base="portrait" keyline={keyline} {...p}>
  <path d="M44,54 L76,54 L76,61 L44,61 Z"/>
  <path d="M46,61 L46,92 C46,97 50,100 55,100 L65,100 C70,100 74,97 74,92 L74,61"/>
  <path d="M60,26 L60,44"/>
  <path d="M54,46 C54,42 66,42 66,46 C66,50 54,50 54,52 C54,55 66,55 66,52 C66,49 54,49 54,46"/>
  <path d="M60,55 C60,59 58,61 58,64 C58,67 62,67 62,64 C62,61 60,59 60,55 Z"/>
</Svg>)}

/* 9 · ביצים — whole egg + cracked egg [landscape] */
function EggsIcon({keyline,...p}){return(<Svg base="landscape" keyline={keyline} {...p}>
  <path d="M70,40 C57,40 53,62 57,78 C60,91 80,91 83,77 C86,61 83,40 70,40 Z"/>
  <path d="M30,74 C31,86 51,86 52,74"/>
  <path d="M30,74 L35,69 L40,74 L45,69 L52,74"/>
</Svg>)}

/* 10 · מותססים וכבושים — clamp jar + pickle spears [portrait] */
function FermentedIcon({keyline,...p}){return(<Svg base="portrait" keyline={keyline} {...p}>
  <path d="M40,54 L40,92 C40,97 44,100 49,100 L71,100 C76,100 80,97 80,92 L80,54"/>
  <path d="M44,54 C44,48 48,46 52,46 L68,46 C72,46 76,48 76,54"/>
  <path d="M51,46 L51,37 L69,37 L69,46"/>
  <path d="M51,37 C53,31 67,31 69,37"/>
  <path d="M55,60 L55,92"/>
  <path d="M60,58 L60,94"/>
  <path d="M65,60 L65,92"/>
</Svg>)}

/* 11 · יין, בירה ומשקאות — wine glass + level line [portrait] ANCHOR */
function DrinksIcon({keyline,...p}){return(<Svg base="portrait" keyline={keyline} {...p}>
  <path d="M44,32 L76,32 C76,57 65,63 60,63 C55,63 44,57 44,32 Z"/>
  <path d="M47,44 C56,50 64,50 73,44"/>
  <path d="M60,63 L60,88"/>
  <path d="M46,90 C53,85 67,85 74,90"/>
</Svg>)}

/* 12 · שוקולד וממתקים בוטיק — chocolate bar [landscape] */
function ChocolateIcon({keyline,...p}){return(<Svg base="landscape" keyline={keyline} {...p}>
  <path d="M34,46 L74,46 L74,90 L34,90 Z"/>
  <path d="M74,46 L90,42 L90,58 L74,62"/>
  <path d="M48,46 L48,90"/>
  <path d="M61,46 L61,90"/>
  <path d="M34,61 L74,61"/>
  <path d="M34,76 L74,76"/>
</Svg>)}

/* 13 · תבלינים וצמחי תיבול — spice mound + leaf [landscape] */
function SpicesIcon({keyline,...p}){return(<Svg base="landscape" keyline={keyline} {...p}>
  <path d="M30,84 C38,64 54,64 60,84 Z"/>
  <path d="M58,84 C64,68 78,68 84,84 Z"/>
  <circle cx="44" cy="76" r="1.5" fill="currentColor" stroke="none"/>
  <circle cx="50" cy="80" r="1.5" fill="currentColor" stroke="none"/>
  <circle cx="70" cy="78" r="1.5" fill="currentColor" stroke="none"/>
  <path d="M62,60 C58,42 74,34 80,38 C82,52 74,60 62,60 Z"/>
  <path d="M62,60 C66,52 74,44 80,38"/>
</Svg>)}

/* 14 · סבונים טבעיים — soap bar + bubbles [landscape] */
function SoapIcon({keyline,...p}){return(<Svg base="landscape" keyline={keyline} {...p}>
  <path d="M34,66 C34,59 39,56 46,56 L74,56 C81,56 86,59 86,66 L86,78 C86,85 81,88 74,88 L46,88 C39,88 34,85 34,78 Z"/>
  <path d="M40,62 C50,60 70,60 80,62"/>
  <circle cx="78" cy="42" r="5"/>
  <circle cx="90" cy="48" r="3"/>
  <circle cx="84" cy="33" r="2.4"/>
</Svg>)}

/* 15 · קרמים ושמני גוף — cream tub + lid [portrait] */
function CreamsIcon({keyline,...p}){return(<Svg base="portrait" keyline={keyline} {...p}>
  <path d="M44,54 C44,48 76,48 76,54"/>
  <path d="M40,54 L80,54 L80,63 L40,63 Z"/>
  <path d="M42,63 L42,86 C42,91 46,94 51,94 L69,94 C74,94 78,91 78,86 L78,63"/>
</Svg>)}

/* 16 · צמחי מרפא ותוספים — bound hanging dried-herb bundle [portrait] */
function MedicinalHerbsIcon({keyline,...p}){return(<Svg base="portrait" keyline={keyline} {...p}>
  <path d="M49,38 L71,38"/>
  <path d="M69,38 L74,34"/>
  <path d="M69,38 L74,42"/>
  <path d="M56,38 L50,90"/>
  <path d="M60,38 L60,94"/>
  <path d="M64,38 L72,90"/>
  <path d="M52,58 C46,55 44,61 51,63 Z"/>
  <path d="M51,76 C45,74 44,80 51,81 Z"/>
  <path d="M60,56 C54,53 52,59 59,61 Z"/>
  <path d="M60,74 C66,72 68,78 61,79 Z"/>
  <path d="M67,58 C73,55 75,61 68,63 Z"/>
  <path d="M69,76 C75,74 76,80 69,81 Z"/>
</Svg>)}

/* 17 · נרות וארומה — candle + flame + aroma curls [portrait] */
function CandlesIcon({keyline,...p}){return(<Svg base="portrait" keyline={keyline} {...p}>
  <path d="M46,60 C46,56 70,56 70,60 L70,96 L46,96 Z"/>
  <path d="M58,60 L58,52"/>
  <path d="M58,32 C51,40 51,49 58,52 C65,49 65,40 58,32 Z"/>
  <path d="M80,50 C84,54 80,58 84,62"/>
  <path d="M88,42 C92,46 88,50 92,54"/>
</Svg>)}

/* 18 · מוצרים מוכנים — serving cloche on plate [landscape] (proposed) */
function PreparedIcon({keyline,...p}){return(<Svg base="landscape" keyline={keyline} {...p}>
  <path d="M34,78 C34,49 86,49 86,78"/>
  <path d="M60,49 L60,41"/>
  <circle cx="60" cy="38" r="2.6" fill="currentColor" stroke="none"/>
  <path d="M26,82 C42,77 78,77 94,82"/>
</Svg>)}

const CATEGORY_ICONS = {
  meat:           { Icon: MeatIcon,           he: "בשר",                 anchor:false, proposed:false },
  fish:           { Icon: FishIcon,           he: "דגים",                anchor:false, proposed:false },
  dairy:          { Icon: DairyIcon,          he: "חלב וגבינות",         anchor:false, proposed:false },
  bread:          { Icon: BreadIcon,          he: "לחמים ואפייה",        anchor:true,  proposed:false },
  vegetables:     { Icon: VegetablesIcon,     he: "ירקות",               anchor:false, proposed:false },
  fruits:         { Icon: FruitsIcon,         he: "פירות",               anchor:true,  proposed:false },
  oils:           { Icon: OilsIcon,           he: "שמנים",               anchor:false, proposed:false },
  honey:          { Icon: HoneyIcon,          he: "דבש",                 anchor:false, proposed:false },
  eggs:           { Icon: EggsIcon,           he: "ביצים",               anchor:false, proposed:false },
  fermented:      { Icon: FermentedIcon,      he: "מותססים וכבושים",     anchor:false, proposed:false },
  drinks:         { Icon: DrinksIcon,         he: "יין, בירה ומשקאות",   anchor:true,  proposed:false },
  chocolate:      { Icon: ChocolateIcon,      he: "שוקולד וממתקים בוטיק",anchor:false, proposed:false },
  spices:         { Icon: SpicesIcon,         he: "תבלינים וצמחי תיבול", anchor:false, proposed:false },
  soap:           { Icon: SoapIcon,           he: "סבונים טבעיים",       anchor:false, proposed:false },
  creams:         { Icon: CreamsIcon,         he: "קרמים ושמני גוף",     anchor:false, proposed:false },
  medicinalHerbs: { Icon: MedicinalHerbsIcon, he: "צמחי מרפא ותוספים",   anchor:false, proposed:false },
  candles:        { Icon: CandlesIcon,        he: "נרות וארומה",         anchor:false, proposed:false },
  prepared:       { Icon: PreparedIcon,       he: "מוצרים מוכנים",       anchor:false, proposed:true  },
};

const ENTRIES = Object.values(CATEGORY_ICONS);

function Tab({ id, active, onClick, children }){
  return (
    <button onClick={() => onClick(id)} style={{
      font:"500 15px 'DM Sans', sans-serif", cursor:"pointer",
      padding:"9px 18px", borderRadius:"8px", border:"1px solid",
      borderColor: active ? "var(--green)" : "var(--line)",
      background: active ? "var(--green)" : "transparent",
      color: active ? "#fff" : "var(--muted)", transition:"all .18s ease-in-out",
    }}>{children}</button>
  );
}

function GlyphCell({ entry, size, showLabel, tint, keyline }){
  const { Icon, he, anchor, proposed } = entry;
  return (
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:"12px"}}>
      <div style={{
        position:"relative",
        display:"grid",placeItems:"center",
        width: Math.max(size+28, 64), height: Math.max(size+28, 64),
        borderRadius:"14px", background:"var(--surface)",
        border:"1px solid", borderColor: proposed ? "var(--gold)" : "var(--line)",
        color: tint, boxShadow:"0 1px 2px rgba(28,26,23,.04)",
      }}>
        <Icon size={size} keyline={keyline}/>
        {anchor && size>=70 && <span style={{
          position:"absolute", top:"7px", insetInlineStart:"7px",
          width:"6px", height:"6px", borderRadius:"50%", background:"var(--green)",
        }}></span>}
      </div>
      {showLabel && <div style={{
        font:"400 13px 'DM Sans', sans-serif",
        color: proposed ? "var(--gold)" : "var(--muted)",
        textAlign:"center", maxWidth: size+44, lineHeight:1.35,
      }}>{he}{proposed && " ✻"}</div>}
    </div>
  );
}

function Sheet({ size, showLabel, tint, keyline }){
  return (
    <div style={{
      display:"grid", gap: size>=70 ? "26px" : "18px",
      gridTemplateColumns:`repeat(auto-fill, minmax(${Math.max(size+44,104)}px, 1fr))`,
      justifyItems:"center",
    }}>
      {ENTRIES.map((e,i)=> <GlyphCell key={i} entry={e} size={size} showLabel={showLabel} tint={tint} keyline={keyline}/>)}
    </div>
  );
}

function Lineup({ tint }){
  return (
    <div style={{
      display:"flex", flexWrap:"wrap", gap:"22px", alignItems:"center",
      padding:"30px 26px", background:"var(--surface)", borderRadius:"16px",
      border:"1px solid var(--line)", color: tint,
    }}>
      {ENTRIES.map((e,i)=>{const {Icon}=e;return <Icon key={i} size={80}/>;})}
    </div>
  );
}

function SectionTitle({ children }){
  return <h2 className="serif" style={{
    margin:"0 0 22px",fontSize:"22px",fontWeight:500,color:"var(--ink)",
    paddingBottom:"10px",borderBottom:"1px solid var(--line)",
  }}>{children}</h2>;
}

function Header(){
  return (
    <header style={{marginBottom:"40px"}}>
      <div style={{display:"flex",alignItems:"center",gap:"10px",marginBottom:"16px"}}>
        <span style={{width:"10px",height:"10px",borderRadius:"3px",background:"var(--green)"}}></span>
        <span style={{width:"10px",height:"10px",borderRadius:"3px",background:"var(--gold)"}}></span>
        <span style={{font:"500 13px 'DM Sans'",letterSpacing:".04em",color:"var(--muted)"}}>מהמקור · אייקוני קטגוריות · שלב 2</span>
      </div>
      <h1 className="serif" style={{margin:"0 0 12px",fontSize:"46px",fontWeight:700,color:"var(--ink)",lineHeight:1.15}}>
        18 גליפים על מערכת אחת
      </h1>
      <p style={{margin:0,maxWidth:"680px",color:"var(--muted)",fontSize:"17px",lineHeight:1.65}}>
        כל גליף יושב על צורת-בסיס מתוך ה-keyline — משקל אופטי אחיד, יד אחת. ●=עוגן · <span style={{color:"var(--gold)"}}>✻=הצעה (מוצרים מוכנים, ה-18 החסר ברשימה)</span>.
      </p>
    </header>
  );
}

function App(){
  const [tab, setTab] = useState("labelled");
  const [tint, setTint] = useState("var(--green)");
  const [keyline, setKeyline] = useState(false);
  return (
    <React.Fragment>
      <Header/>

      <div style={{display:"flex",flexWrap:"wrap",gap:"10px",marginBottom:"14px"}}>
        <Tab id="labelled" active={tab==="labelled"} onClick={setTab}>גיליון מתויג · 80 / 28 / 20</Tab>
        <Tab id="blind" active={tab==="blind"} onClick={setTab}>מבחן עיוור · ללא תוויות</Tab>
        <Tab id="lineup" active={tab==="lineup"} onClick={setTab}>מבחן שורה · 80px</Tab>
      </div>

      <div style={{display:"flex",flexWrap:"wrap",gap:"8px",marginBottom:"36px",alignItems:"center"}}>
        <button onClick={()=>setKeyline(k=>!k)} style={{
          font:"500 13px 'DM Sans'",cursor:"pointer",padding:"5px 14px",borderRadius:"8px",
          border:"1px solid",borderColor: keyline?"var(--green)":"var(--line)",
          background: keyline?"var(--green)":"transparent", color: keyline?"#fff":"var(--muted)",
        }}>{keyline?"הסתרת keyline":"הצגת keyline"}</button>
        <span style={{width:"1px",height:"20px",background:"var(--line)",margin:"0 6px"}}></span>
        <span style={{font:"400 13px 'DM Sans'",color:"var(--muted)"}}>צבע:</span>
        {[["ירוק","var(--green)"],["זהב","var(--gold)"],["דיו","var(--ink)"]].map(([n,c])=>(
          <button key={c} onClick={()=>setTint(c)} style={{
            cursor:"pointer",font:"400 13px 'DM Sans'",padding:"5px 12px",borderRadius:"8px",
            border:"1px solid var(--line)",background: tint===c?"var(--ink)":"transparent",
            color: tint===c?"#fff":"var(--muted)",
          }}>{n}</button>
        ))}
      </div>

      {tab==="labelled" && (
        <div style={{display:"flex",flexDirection:"column",gap:"56px"}}>
          <section><SectionTitle>80px — נוכחות מלאה</SectionTitle><Sheet size={80} showLabel tint={tint} keyline={keyline}/></section>
          <section><SectionTitle>28px — מבחן צללית</SectionTitle><Sheet size={28} showLabel tint={tint} keyline={keyline}/></section>
          <section><SectionTitle>20px — קצה הקריאוּת</SectionTitle><Sheet size={20} showLabel tint={tint} keyline={keyline}/></section>
        </div>
      )}
      {tab==="blind" && (
        <section><SectionTitle>מבחן זיהוי עיוור — נסו לנקוב בשם כל גליף לפני קריאת התוויות</SectionTitle>
          <Sheet size={72} showLabel={false} tint={tint} keyline={keyline}/></section>
      )}
      {tab==="lineup" && (
        <section><SectionTitle>כל 18 בשורה אחת — מבחן "יד אחת"</SectionTitle><Lineup tint={tint}/></section>
      )}
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
