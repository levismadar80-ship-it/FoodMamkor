<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mehamakor — Category Glyphs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#2e6853; --gold:#8b6914;
    --bg:#f7f4ec; --surface:#fffefb; --ink:#1c1b18; --muted:#6f6a5e; --line:#e4ddcd;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Heebo',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #root{max-width:1100px;margin:0 auto;padding:56px 40px 96px;}
  .serif{font-family:'Frank Ruhl Libre',serif;}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState } = React;

/* ── Family hand: viewBox 0 0 120 120 · fill none · stroke currentColor
   · strokeWidth 2 · round caps/joins · single weight · organic curves ── */
function Svg({ size = 80, children, ...props }) {
  return (
    <svg viewBox="0 0 120 120" width={size} height={size} fill="none"
      stroke="currentColor" strokeWidth="2" strokeLinecap="round"
      strokeLinejoin="round" {...props}>
      {children}
    </svg>
  );
}

/* 1 · בשר ודגים — fish */
function MeatFishIcon(props){return(<Svg {...props}>
  <path d="M40,60 C50,42 78,40 92,60 C78,80 50,78 40,60 Z"/>
  <path d="M40,60 L24,47 C28,55 28,65 24,73 Z"/>
  <path d="M73,49 C69,60 73,70 73,70"/>
  <circle cx="82" cy="55" r="1.6" fill="currentColor" stroke="none"/>
</Svg>)}

/* 2 · חלב וגבינות — cheese wedge */
function DairyIcon(props){return(<Svg {...props}>
  <path d="M28,74 C28,70 30,69 33,69 L90,57 L90,74 Z"/>
  <path d="M28,74 C40,71 78,71 90,74"/>
  <circle cx="68" cy="66" r="2.2" fill="currentColor" stroke="none"/>
  <circle cx="80" cy="63" r="1.8" fill="currentColor" stroke="none"/>
</Svg>)}

/* 3 · לחמים ואפייה — bread loaf */
function BreadIcon(props){return(<Svg {...props}>
  <path d="M30,78 C28,54 92,54 90,78 Z"/>
  <path d="M30,78 L90,78"/>
  <path d="M45,60 L52,71"/>
  <path d="M59,57 L66,69"/>
  <path d="M73,60 L80,71"/>
</Svg>)}

/* 4 · ירקות — carrot */
function VegetablesIcon(props){return(<Svg {...props}>
  <path d="M49,52 C52,84 57,98 60,98 C63,98 68,72 71,52 C64,49 56,49 49,52 Z"/>
  <path d="M56,52 L50,36"/>
  <path d="M60,51 L60,33"/>
  <path d="M64,52 L70,36"/>
  <path d="M54,64 L57,63"/>
  <path d="M61,74 L64,73"/>
</Svg>)}

/* 5 · פירות — apple */
function FruitsIcon(props){return(<Svg {...props}>
  <path d="M60,48 C53,40 39,42 39,60 C39,80 52,92 60,92 C68,92 81,80 81,60 C81,42 67,40 60,48 Z"/>
  <path d="M60,48 L61,34"/>
  <path d="M61,38 C68,31 76,35 73,43 C66,46 62,43 61,38 Z"/>
</Svg>)}

/* 6 · שמנים — oil bottle + drop emblem */
function OilsIcon(props){return(<Svg {...props}>
  <path d="M50,52 L50,38 L70,38 L70,52"/>
  <path d="M53,38 L53,33 L67,33"/>
  <path d="M44,52 C44,52 76,52 76,52 L76,90 C76,95 72,98 67,98 L53,98 C48,98 44,95 44,90 Z"/>
  <path d="M60,64 C55,70 55,78 60,80 C65,78 65,70 60,64 Z"/>
</Svg>)}

/* 7 · דבש — honey dipper + drip */
function HoneyIcon(props){return(<Svg {...props}>
  <path d="M60,28 L60,58"/>
  <path d="M51,58 C51,84 69,84 69,58 Z"/>
  <path d="M52,65 L68,65"/>
  <path d="M51,72 L69,72"/>
  <path d="M53,79 L67,79"/>
  <path d="M60,84 C60,90 57,92 57,95 C57,98 63,98 63,95 C63,92 60,90 60,84 Z"/>
</Svg>)}

/* 8 · ביצים — two eggs */
function EggsIcon(props){return(<Svg {...props}>
  <path d="M66,38 C53,38 49,60 53,76 C56,89 76,89 79,75 C82,59 79,38 66,38 Z"/>
  <path d="M42,64 C34,64 32,80 38,88 C43,94 53,90 52,80"/>
</Svg>)}

/* 9 · מותססים וכבושים — clamp-lid pickling jar + spears */
function FermentedIcon(props){return(<Svg {...props}>
  <path d="M40,52 L40,90 C40,95 44,98 49,98 L71,98 C76,98 80,95 80,90 L80,52"/>
  <path d="M44,52 C44,46 48,44 52,44 L68,44 C72,44 76,46 76,52"/>
  <path d="M51,44 L51,35 L69,35 L69,44"/>
  <path d="M51,35 C53,29 67,29 69,35"/>
  <path d="M55,58 L55,90"/>
  <path d="M60,56 L60,92"/>
  <path d="M65,58 L65,90"/>
</Svg>)}

/* 10 · מוצרים מוכנים — serving cloche on plate */
function PreparedIcon(props){return(<Svg {...props}>
  <path d="M36,77 C36,48 84,48 84,77"/>
  <path d="M60,48 L60,40"/>
  <circle cx="60" cy="37" r="2.4" fill="currentColor" stroke="none"/>
  <path d="M28,80 C42,76 78,76 92,80"/>
</Svg>)}

/* 11 · תבלינים וצמחי תיבול — spice shaker */
function SpicesIcon(props){return(<Svg {...props}>
  <path d="M46,62 L46,90 C46,95 50,98 55,98 L65,98 C70,98 74,95 74,90 L74,62"/>
  <path d="M46,62 C46,49 74,49 74,62 Z"/>
  <circle cx="54" cy="56" r="1.4" fill="currentColor" stroke="none"/>
  <circle cx="60" cy="54" r="1.4" fill="currentColor" stroke="none"/>
  <circle cx="66" cy="56" r="1.4" fill="currentColor" stroke="none"/>
  <path d="M55,44 L54,40"/>
  <path d="M60,42 L60,38"/>
  <path d="M65,44 L66,40"/>
</Svg>)}

/* 12 · יין, בירה ומשקאות — wine glass */
function DrinksIcon(props){return(<Svg {...props}>
  <path d="M44,34 L76,34 C76,58 65,64 60,64 C55,64 44,58 44,34 Z"/>
  <path d="M47,46 C56,52 64,52 73,46"/>
  <path d="M60,64 L60,88"/>
  <path d="M46,90 C53,85 67,85 74,90"/>
</Svg>)}

/* 13 · שוקולד וממתקים בוטיק — chocolate bar w/ snapped piece */
function ChocolateIcon(props){return(<Svg {...props}>
  <path d="M36,46 L74,46 L74,88 L36,88 Z"/>
  <path d="M74,46 L90,42 L90,58 L74,62"/>
  <path d="M50,46 L50,88"/>
  <path d="M62,46 L62,88"/>
  <path d="M36,60 L74,60"/>
  <path d="M36,74 L74,74"/>
</Svg>)}

/* 14 · סבונים טבעיים — soap bar + suds */
function SoapIcon(props){return(<Svg {...props}>
  <path d="M34,64 C34,57 39,54 46,54 L74,54 C81,54 86,57 86,64 L86,76 C86,83 81,86 74,86 L46,86 C39,86 34,83 34,76 Z"/>
  <path d="M40,60 C50,58 70,58 80,60"/>
  <circle cx="78" cy="42" r="5"/>
  <circle cx="90" cy="48" r="3"/>
  <circle cx="84" cy="33" r="2.4"/>
</Svg>)}

/* 15 · צמחי מרפא ותוספים — mortar & pestle + sprig */
function MedicinalHerbsIcon(props){return(<Svg {...props}>
  <path d="M34,64 C46,70 74,70 86,64"/>
  <path d="M36,64 C40,86 80,86 84,64"/>
  <path d="M68,40 L56,64"/>
  <path d="M64,38 L73,42"/>
  <path d="M50,64 L46,46"/>
  <path d="M46,46 C40,44 37,48 41,53"/>
  <path d="M48,54 C44,55 42,59 46,62"/>
</Svg>)}

/* 16 · קרמים ושמני גוף — cream tub w/ lid */
function CreamsIcon(props){return(<Svg {...props}>
  <path d="M44,52 C44,46 76,46 76,52"/>
  <path d="M40,52 L80,52 L80,61 L40,61 Z"/>
  <path d="M42,61 L42,84 C42,89 46,92 51,92 L69,92 C74,92 78,89 78,84 L78,61"/>
</Svg>)}

/* 17 · תכשירי צמחים — standalone pipette + falling drop */
function HerbalPrepIcon(props){return(<Svg {...props}>
  <path d="M54,42 L54,33 C54,27 66,27 66,33 L66,42 Z"/>
  <path d="M54,42 L56,72 L60,82 L64,72 L66,42"/>
  <path d="M55,57 L65,57"/>
  <path d="M60,88 C57,92 57,96 60,98 C63,96 63,92 60,88 Z"/>
</Svg>)}

/* 18 · נרות וארומה — candle + flame + aroma */
function CandlesIcon(props){return(<Svg {...props}>
  <path d="M46,58 C46,54 70,54 70,58 L70,92 L46,92 Z"/>
  <path d="M58,58 L58,52"/>
  <path d="M58,34 C52,41 52,49 58,52 C64,49 64,41 58,34 Z"/>
  <path d="M80,48 C84,52 80,56 84,60"/>
  <path d="M88,40 C92,44 88,48 92,52"/>
</Svg>)}

/* 19 · תוספי תזונה — two-tone capsule + leaf */
function SupplementsIcon(props){return(<Svg {...props}>
  <g transform="rotate(-38 60 62)">
    <path d="M40,52 L74,52 C84,52 84,72 74,72 L40,72 C30,72 30,52 40,52 Z"/>
    <path d="M57,52 L57,72"/>
  </g>
  <path d="M40,84 C33,82 30,88 34,92 C38,94 43,89 40,84 Z"/>
  <path d="M36,86 L40,91"/>
</Svg>)}

const CATEGORY_ICONS = {
  meatFish:       { Icon: MeatFishIcon,       he: "בשר ודגים" },
  dairy:          { Icon: DairyIcon,          he: "חלב וגבינות" },
  bread:          { Icon: BreadIcon,          he: "לחמים ואפייה" },
  vegetables:     { Icon: VegetablesIcon,     he: "ירקות" },
  fruits:         { Icon: FruitsIcon,         he: "פירות" },
  oils:           { Icon: OilsIcon,           he: "שמנים" },
  honey:          { Icon: HoneyIcon,          he: "דבש" },
  eggs:           { Icon: EggsIcon,           he: "ביצים" },
  fermented:      { Icon: FermentedIcon,      he: "מותססים וכבושים" },
  prepared:       { Icon: PreparedIcon,       he: "מוצרים מוכנים" },
  spices:         { Icon: SpicesIcon,         he: "תבלינים וצמחי תיבול" },
  drinks:         { Icon: DrinksIcon,         he: "יין, בירה ומשקאות" },
  chocolate:      { Icon: ChocolateIcon,      he: "שוקולד וממתקים בוטיק" },
  soap:           { Icon: SoapIcon,           he: "סבונים טבעיים" },
  medicinalHerbs: { Icon: MedicinalHerbsIcon, he: "צמחי מרפא ותוספים" },
  creams:         { Icon: CreamsIcon,         he: "קרמים ושמני גוף" },
  herbalPrep:     { Icon: HerbalPrepIcon,     he: "תכשירי צמחים" },
  candles:        { Icon: CandlesIcon,        he: "נרות וארומה" },
  supplements:    { Icon: SupplementsIcon,    he: "תוספי תזונה" },
};

const ENTRIES = Object.values(CATEGORY_ICONS);

function Tab({ id, active, onClick, children }){
  return (
    <button onClick={() => onClick(id)} style={{
      font:"500 15px Heebo, sans-serif", cursor:"pointer",
      padding:"9px 18px", borderRadius:"999px", border:"1px solid",
      borderColor: active ? "var(--green)" : "var(--line)",
      background: active ? "var(--green)" : "transparent",
      color: active ? "#fff" : "var(--muted)", transition:"all .15s",
    }}>{children}</button>
  );
}

function GlyphCell({ entry, size, showLabel, tint }){
  const { Icon, he } = entry;
  return (
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:"12px"}}>
      <div style={{
        display:"grid",placeItems:"center",
        width: Math.max(size+28, 64), height: Math.max(size+28, 64),
        borderRadius:"14px", background:"var(--surface)",
        border:"1px solid var(--line)", color: tint,
      }}>
        <Icon size={size}/>
      </div>
      {showLabel && <div style={{
        font:"400 13px Heebo, sans-serif", color:"var(--muted)",
        textAlign:"center", maxWidth: size+34, lineHeight:1.35,
      }}>{he}</div>}
    </div>
  );
}

function Sheet({ size, showLabel, tint }){
  return (
    <div style={{
      display:"grid", gap: size>=70 ? "26px" : "18px",
      gridTemplateColumns:`repeat(auto-fill, minmax(${Math.max(size+34,96)}px, 1fr))`,
      justifyItems:"center",
    }}>
      {ENTRIES.map((e,i)=> <GlyphCell key={i} entry={e} size={size} showLabel={showLabel} tint={tint}/>)}
    </div>
  );
}

function Lineup(){
  return (
    <div style={{
      display:"flex", flexWrap:"wrap", gap:"20px", alignItems:"center",
      padding:"30px 26px", background:"var(--surface)", borderRadius:"18px",
      border:"1px solid var(--line)", color:"var(--green)",
    }}>
      {ENTRIES.map((e,i)=>{const {Icon}=e;return <Icon key={i} size={80}/>;})}
    </div>
  );
}

function Header(){
  return (
    <header style={{marginBottom:"40px"}}>
      <div style={{display:"flex",alignItems:"center",gap:"12px",marginBottom:"14px"}}>
        <span style={{width:"10px",height:"10px",borderRadius:"3px",background:"var(--green)"}}></span>
        <span style={{width:"10px",height:"10px",borderRadius:"3px",background:"var(--gold)"}}></span>
        <span style={{font:"500 13px Heebo",letterSpacing:".04em",color:"var(--muted)"}}>מהמקור · ספריית אייקונים</span>
      </div>
      <h1 className="serif" style={{margin:"0 0 10px",fontSize:"42px",fontWeight:700,color:"var(--ink)",lineHeight:1.1}}>
        19 אייקוני קטגוריות
      </h1>
      <p style={{margin:0,maxWidth:"640px",color:"var(--muted)",fontSize:"17px",lineHeight:1.6}}>
        משפחה אחת, יד מצוירת אחת — קו יחיד במשקל אחיד (stroke 2, currentColor),
        עיגולים רכים ועקומות אורגניות. כל גליף מזוהה ללא תווית.
      </p>
    </header>
  );
}

function App(){
  const [tab, setTab] = useState("labelled");
  const [tint, setTint] = useState("var(--green)");
  return (
    <React.Fragment>
      <Header/>

      <div style={{display:"flex",flexWrap:"wrap",gap:"10px",marginBottom:"14px"}}>
        <Tab id="labelled" active={tab==="labelled"} onClick={setTab}>גיליון מתויג · 80 / 28 / 20</Tab>
        <Tab id="blind" active={tab==="blind"} onClick={setTab}>מבחן עיוור · ללא תוויות</Tab>
        <Tab id="lineup" active={tab==="lineup"} onClick={setTab}>מבחן שורה · 80px</Tab>
      </div>

      <div style={{display:"flex",gap:"8px",marginBottom:"36px",alignItems:"center"}}>
        <span style={{font:"400 13px Heebo",color:"var(--muted)"}}>צבע:</span>
        {[["ירוק","var(--green)"],["זהב","var(--gold)"],["דיו","var(--ink)"]].map(([n,c])=>(
          <button key={c} onClick={()=>setTint(c)} style={{
            cursor:"pointer",font:"400 13px Heebo",padding:"5px 12px",borderRadius:"999px",
            border:"1px solid var(--line)",background: tint===c?"var(--ink)":"transparent",
            color: tint===c?"#fff":"var(--muted)",
          }}>{n}</button>
        ))}
      </div>

      {tab==="labelled" && (
        <div style={{display:"flex",flexDirection:"column",gap:"56px"}}>
          <section>
            <SectionTitle>80px — נוכחות מלאה</SectionTitle>
            <Sheet size={80} showLabel tint={tint}/>
          </section>
          <section>
            <SectionTitle>28px — מבחן צללית</SectionTitle>
            <Sheet size={28} showLabel tint={tint}/>
          </section>
          <section>
            <SectionTitle>20px — קצה הקריאוּת</SectionTitle>
            <Sheet size={20} showLabel tint={tint}/>
          </section>
        </div>
      )}

      {tab==="blind" && (
        <section>
          <SectionTitle>מבחן זיהוי עיוור — נסו לנקוב בשם כל גליף לפני קריאת התוויות</SectionTitle>
          <Sheet size={72} showLabel={false} tint={tint}/>
        </section>
      )}

      {tab==="lineup" && (
        <section>
          <SectionTitle>כל 19 בשורה אחת — מבחן "יד אחת"</SectionTitle>
          <Lineup/>
        </section>
      )}
    </React.Fragment>
  );
}

function SectionTitle({ children }){
  return <h2 className="serif" style={{
    margin:"0 0 22px",fontSize:"21px",fontWeight:500,color:"var(--ink)",
    paddingBottom:"10px",borderBottom:"1px solid var(--line)",
  }}>{children}</h2>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
