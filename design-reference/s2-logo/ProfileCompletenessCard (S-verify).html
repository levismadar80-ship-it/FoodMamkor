<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProfileCompletenessCard — Mehamakor</title>

<!-- Real design-system tokens (source of truth) -->
<link rel="stylesheet" href="_ds/mehamakor-design-system-0e28208b-1d76-4e18-a78e-dacea5c8a0dc/colors_and_type.css">
<!-- Icons are inline Phosphor (duotone) SVG glyphs — see PhIcon below. No other icon set. -->

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    padding: 48px 16px;
    box-sizing: border-box;
  }

  /* ---- ProfileCompletenessCard ------------------------------------ */
  .pcc {
    position: relative;
    width: 100%;
    max-width: 440px;
    background: var(--background);            /* warm cream — never pure white */
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 32px 28px 28px;
    box-sizing: border-box;
    animation: pcc-rise var(--dur-slow) var(--ease-quart) both;
  }
  @keyframes pcc-rise {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  /* Hand-cut paper edge — signature gesture, bottom only */
  .pcc::after {
    content: "";
    position: absolute;
    inset-inline: 14px;
    bottom: -1px; height: 6px;
    background:
      repeating-linear-gradient(-58deg,
        var(--border) 0 7px, transparent 7px 15px);
    opacity: 0.6;
    border-radius: 0 0 var(--radius-lg) var(--radius-lg);
  }

  .pcc-head {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 20px;
    margin-bottom: 22px;
  }
  .pcc-eyebrow { margin: 0 0 8px; }
  .pcc-title {
    margin: 0;
    font-family: var(--font-headline);
    font-weight: 700;
    font-size: 27px;
    line-height: 1.12;
    letter-spacing: -0.01em;
    color: var(--primary);                    /* font-headline-lg Hebrew, text-primary */
  }
  .pcc-sub {
    margin: 8px 0 0;
    font-size: var(--fs-small);
    line-height: 1.5;
    color: var(--fg-muted);
  }

  /* Progress ring — the documented state-color exception */
  .pcc-ring { position: relative; width: 92px; height: 92px; flex: none; }
  .pcc-ring svg { transform: rotate(-90deg); display: block; }
  .pcc-ring__track { stroke: var(--border); }
  .pcc-ring__fill {
    stroke: var(--primary);
    stroke-linecap: round;
    transition: stroke-dashoffset var(--dur-slow) var(--ease-quart);
  }
  .pcc-ring__num {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    font-family: var(--font-english);          /* Cormorant — numerals only */
    font-style: italic;
    font-weight: 600;
    font-size: 26px;
    color: var(--accent);                      /* warm gold, real accent */
    direction: ltr;
  }
  .pcc-ring__num small { font-size: 14px; margin-block-start: 4px; }

  /* Checklist */
  .pcc-list { display: grid; gap: 4px; margin: 4px 0 24px; }
  .pcc-item {
    display: flex; align-items: center; gap: 12px;
    width: 100%;
    min-height: 44px;                          /* touch target */
    padding: 6px 10px;
    background: transparent;
    border: 0;
    border-radius: var(--radius-sm);
    font-family: var(--font-body);
    font-size: 15px;
    color: var(--site-text);
    text-align: start;
    cursor: pointer;
    transition: background-color var(--dur-fast) var(--ease-out);
  }
  .pcc-item:hover:not(:disabled) { background: var(--light); }
  .pcc-item:disabled { cursor: default; }
  .pcc-item svg { width: 24px; height: 24px; flex: none; }
  .pcc-item .ico-done { color: var(--primary); }
  .pcc-item .ico-todo { color: var(--fg-muted); }
  .pcc-item__label { flex: 1; }
  .pcc-item--done .pcc-item__label { color: var(--fg-muted); }
  .pcc-item__hint {
    font-size: var(--fs-small);
    color: var(--fg-muted);
  }
  .pcc-item__hint .dot { color: var(--accent); }   /* gold middle-dot */

  /* CTA — Link pattern: focus-ring + → arrow, min-h 44px */
  .pcc-cta {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 10px;
    width: 100%;
    min-height: 44px;
    padding: 12px 22px;
    background: var(--primary);
    color: #fff;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 15px;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    text-decoration: none;
    cursor: pointer;
    transition: background-color var(--dur-base) var(--ease-out);
  }
  .pcc-cta:hover { background: var(--primary-light); }
  .pcc-cta:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  .pcc-cta__arrow { font-size: 18px; line-height: 1; }
  .pcc-cta--done { background: var(--secondary); }
  .pcc-cta--done:hover { background: var(--secondary); filter: brightness(0.97); }

  @media (prefers-reduced-motion: reduce) {
    .pcc { animation: none; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useMemo } = React;

// Inline Phosphor (duotone) glyphs — 256 viewBox, two-layer fill. Phosphor only.
const PH = {
  "check-circle": {
    sec: "M224,128a96,96,0,1,1-96-96A96,96,0,0,1,224,128Z",
    pri: "M173.66,98.34a8,8,0,0,1,0,11.32l-56,56a8,8,0,0,1-11.32,0l-24-24a8,8,0,0,1,11.32-11.32L112,148.69l50.34-50.35A8,8,0,0,1,173.66,98.34ZM232,128A104,104,0,1,1,128,24,104.11,104.11,0,0,1,232,128Zm-16,0a88,88,0,1,0-88,88A88.1,88.1,0,0,0,216,128Z"
  },
  "circle": {
    sec: "M224,128a96,96,0,1,1-96-96A96,96,0,0,1,224,128Z",
    pri: "M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm0,192a88,88,0,1,1,88-88A88.1,88.1,0,0,1,128,216Z"
  }
};
function PhIcon({ name, className }) {
  const g = PH[name];
  return (
    <svg viewBox="0 0 256 256" className={className} aria-hidden="true" fill="currentColor">
      <path d={g.sec} opacity="0.2"></path>
      <path d={g.pri}></path>
    </svg>
  );
}

// Source items for a producer's profile. Feminine Hebrew voice.
const FIELDS = [
  { id: "photo",    label: "תמונת פרופיל",   hint: "מה שמושך את העין ראשון",          done: true  },
  { id: "story",    label: "הסיפור של העסק",  hint: "מי את ומה את מכינה",              done: true  },
  { id: "category", label: "קטגוריות",        hint: "כדי שימצאו אותך",                 done: true  },
  { id: "hours",    label: "שעות פעילות",      hint: "מתי נוח לפנות אלייך",             done: false },
  { id: "whatsapp", label: "מספר וואטסאפ",     hint: "הדרך הישירה אלייך",               done: false },
];

const R = 42, C = 2 * Math.PI * R;

function ProfileCompletenessCard() {
  const [fields, setFields] = useState(FIELDS);
  const doneCount = fields.filter(f => f.done).length;
  const pct = Math.round((doneCount / fields.length) * 100);
  const complete = doneCount === fields.length;
  const offset = useMemo(() => C * (1 - pct / 100), [pct]);

  const toggle = (id) =>
    setFields(fs => fs.map(f => f.id === id && !f.done ? { ...f, done: true } : f));

  return (
    <article className="pcc" dir="rtl" aria-label="השלמת פרופיל">
      <div className="pcc-head">
        <div>
          <p className="eyebrow pcc-eyebrow">YOUR PROFILE</p>
          <h2 className="pcc-title">
            {complete ? "הפרופיל שלך מלא" : "עוד קצת, וסיימת"}
          </h2>
          <p className="pcc-sub">
            {complete
              ? "מצוין — עכשיו את מופיעה במלוא הדרה."
              : "פרופיל מלא מקבל יותר פניות מלקוחות קרובים."}
          </p>
        </div>

        <div className="pcc-ring" role="img" aria-label={`${pct} אחוז הושלמו`}>
          <svg width="92" height="92" viewBox="0 0 92 92">
            <circle className="pcc-ring__track" cx="46" cy="46" r={R} fill="none" strokeWidth="6" />
            <circle className="pcc-ring__fill"  cx="46" cy="46" r={R} fill="none" strokeWidth="6"
                    strokeDasharray={C} strokeDashoffset={offset} />
          </svg>
          <div className="pcc-ring__num">{pct}<small>%</small></div>
        </div>
      </div>

      <div className="pcc-list">
        {fields.map(f => (
          <button
            key={f.id}
            type="button"
            className={"pcc-item" + (f.done ? " pcc-item--done" : "")}
            onClick={() => toggle(f.id)}
            disabled={f.done}
            aria-pressed={f.done}
          >
            <PhIcon name={f.done ? "check-circle" : "circle"} className={f.done ? "ico-done" : "ico-todo"} />
            <span className="pcc-item__label">{f.label}</span>
            {!f.done && (
              <span className="pcc-item__hint"><span className="dot">·</span> {f.hint}</span>
            )}
          </button>
        ))}
      </div>

      <a
        href="#"
        className={"pcc-cta" + (complete ? " pcc-cta--done" : "")}
        onClick={(e) => e.preventDefault()}
      >
        {complete ? "צפי בפרופיל שלך" : "המשיכי למלא"}
        <span className="pcc-cta__arrow" aria-hidden="true">{complete ? "✓" : "→"}</span>
      </a>
    </article>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<ProfileCompletenessCard />);
</script>
</body>
</html>
