<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>OG · HE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Suez+One&family=Frank+Ruhl+Libre:wght@400;700;900&family=Cormorant+Garamond:ital,wght@1,400&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #F5F0E8; }
  body { width: 1200px; height: 630px; overflow: hidden; }
  .frame {
    width: 1200px; height: 630px;
    background: #F5F0E8;
    position: relative;
    box-sizing: border-box;
    padding: 96px 96px 96px 96px;
    display: grid;
    grid-template-columns: 1fr auto;
    grid-template-rows: 1fr auto;
    gap: 0;
    align-items: center;
  }
  /* Paper noise — subtle */
  .frame::before {
    content: ""; position: absolute; inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.16  0 0 0 0 0.14  0 0 0 0 0.12  0 0 0 0.18 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    opacity: 0.5; mix-blend-mode: multiply; pointer-events: none;
  }
  .eyebrow {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic; font-weight: 400;
    font-size: 26px; color: #8B6914;
    letter-spacing: 0.16em; text-transform: uppercase;
    grid-column: 1 / 2; align-self: start;
    direction: ltr;
  }
  .mark-cell {
    grid-column: 2 / 3; grid-row: 1 / 3;
    align-self: center;
    width: 280px; height: 280px;
    display: flex; align-items: center; justify-content: center;
  }
  .mark-cell svg { width: 100%; height: 100%; display: block; }
  .wordmark {
    font-family: 'Suez One', 'Frank Ruhl Libre', 'David Libre', serif;
    font-weight: 400; font-size: 168px;
    color: #1C1A17; line-height: 1.05; letter-spacing: 0;
    margin: 0; padding: 0;
    grid-column: 1 / 2; grid-row: 1 / 2; align-self: center;
  }
  .tagline {
    font-family: 'Frank Ruhl Libre', 'David Libre', serif;
    font-weight: 400; font-size: 34px;
    color: #5c584f; line-height: 1.3; letter-spacing: 0;
    margin: 0; padding: 0;
    grid-column: 1 / 3; grid-row: 2 / 3; align-self: end;
    border-top: 1px solid #C99846;
    padding-top: 18px;
    display: flex; align-items: baseline; gap: 16px;
    justify-content: space-between;
    width: 100%;
  }
  .tagline .url {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic; font-weight: 400;
    font-size: 24px; color: #8B6914;
    direction: ltr; letter-spacing: 0.04em;
  }
</style>
</head>
<body>
<div class="frame">
  <div class="mark-cell">
    <svg viewBox="-60 -60 120 120" xmlns="http://www.w3.org/2000/svg">
      <g opacity="0.94">
        <g transform="rotate(36)"><path d="M 0,-44 C 10,-44 13,-32 11,-20 C 9,-12 5,-8 0,-6 C -5,-8 -9,-12 -11,-20 C -13,-32 -10,-44 0,-44 Z" fill="#2E6853"/><ellipse cx="-3" cy="-32" rx="2.5" ry="6" fill="#7BAA90" opacity="0.5"/></g>
        <g transform="rotate(108)"><path d="M 0,-44 C 10,-44 13,-32 11,-20 C 9,-12 5,-8 0,-6 C -5,-8 -9,-12 -11,-20 C -13,-32 -10,-44 0,-44 Z" fill="#C8632E"/><ellipse cx="-3" cy="-32" rx="2.5" ry="6" fill="#EAA378" opacity="0.5"/></g>
        <g transform="rotate(180)"><path d="M 0,-44 C 10,-44 13,-32 11,-20 C 9,-12 5,-8 0,-6 C -5,-8 -9,-12 -11,-20 C -13,-32 -10,-44 0,-44 Z" fill="#C99846"/><ellipse cx="-3" cy="-32" rx="2.5" ry="6" fill="#E8C788" opacity="0.5"/></g>
        <g transform="rotate(252)"><path d="M 0,-44 C 10,-44 13,-32 11,-20 C 9,-12 5,-8 0,-6 C -5,-8 -9,-12 -11,-20 C -13,-32 -10,-44 0,-44 Z" fill="#D9C8B0"/><ellipse cx="-3" cy="-32" rx="2.5" ry="6" fill="#1F4A3A" opacity="0.2"/></g>
        <g transform="rotate(324)"><path d="M 0,-44 C 10,-44 13,-32 11,-20 C 9,-12 5,-8 0,-6 C -5,-8 -9,-12 -11,-20 C -13,-32 -10,-44 0,-44 Z" fill="#5A8F73"/><ellipse cx="-3" cy="-32" rx="2.5" ry="6" fill="#A3C7B3" opacity="0.5"/></g>
      </g>
    </svg>
  </div>

  <h1 class="wordmark">מהמקור</h1>

  <p class="tagline">
    <span>אוכל טוב לא שומרים לעצמנו</span>
    <span class="url">mehamakor.co.il</span>
  </p>
</div>
<script>
  document.fonts.ready.then(() => { document.body.dataset.ready = '1'; });
</script>
</body>
</html>
