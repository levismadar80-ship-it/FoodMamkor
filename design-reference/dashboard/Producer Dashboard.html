<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ניהול העסק — אב-טיפוס</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Phosphor icons (brand-locked icon set) -->
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">

<style>
/* ============================================================
   MEHAMAKOR — Producer dashboard prototype
   Brand-locked: green #2e6853 · cream #F5F0E8 · gold #8B6914
   Frank Ruhl Libre / DM Sans / Cormorant · RTL · Phosphor
   ============================================================ */
:root{
  --cream:#F5F0E8;        /* page */
  --stage:#E7DFD0;        /* deeper cream behind device */
  --card:#FFFEFB;         /* white surface */
  --card-tint:#FBF7EF;    /* warm surface for the lead widget */
  --ink:#1a1a1a;
  --muted:#6b6b6b;
  --faint:#9a9488;
  --line:#E7E0D3;
  --line-soft:#EFE9DD;
  --primary:#2e6853;
  --primary-dk:#26543F;
  --primary-soft:rgba(46,104,83,.08);
  --primary-softer:rgba(46,104,83,.05);
  --gold:#8B6914;
  --gold-soft:rgba(139,105,20,.10);
  --ring-track:#E5DFD3;
  --ring-gold:#C98600;    /* ProgressRing hex exception */
  --ok:#2e6853;
  --shadow-sm:0 1px 2px rgba(28,26,23,.04);
  --shadow-md:0 1px 2px rgba(28,26,23,.04), 0 10px 30px -20px rgba(28,26,23,.22);
  --shadow-lg:0 18px 50px -30px rgba(28,26,23,.4);
}
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  background:var(--stage);
  color:var(--ink);
  font-family:'DM Sans','Heebo',sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
.num{ font-family:'Cormorant Garamond',serif; font-weight:600; font-feature-settings:"lnum" 1; }
.serif{ font-family:'Frank Ruhl Libre',serif; }

/* ---------- presentation chrome ---------- */
.stage{ min-height:100vh; display:flex; flex-direction:column; }
.controlbar{
  position:sticky; top:0; z-index:50;
  display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  padding:12px 22px;
  background:rgba(231,223,208,.86);
  backdrop-filter:saturate(1.2) blur(10px);
  border-bottom:1px solid rgba(0,0,0,.06);
}
.cb-brand{ display:flex; flex-direction:column; line-height:1.15; margin-inline-end:auto; }
.cb-brand .k{ font-size:10px; letter-spacing:.14em; color:var(--gold); font-weight:700; }
.cb-brand .t{ font-family:'Frank Ruhl Libre',serif; font-weight:700; font-size:16px; color:var(--primary); }
.seg-group{ display:flex; align-items:center; gap:9px; }
.seg-label{ font-size:11px; font-weight:600; color:var(--muted); letter-spacing:.02em; }
.seg{ display:inline-flex; background:rgba(255,255,255,.7); border:1px solid var(--line); border-radius:999px; padding:3px; gap:2px; }
.seg button{
  appearance:none; border:0; cursor:pointer; background:transparent;
  font-family:'DM Sans',sans-serif; font-size:12.5px; font-weight:600; color:var(--muted);
  padding:6px 14px; border-radius:999px; min-height:32px; transition:all .18s ease; white-space:nowrap;
}
.seg button.on{ background:var(--primary); color:#fff; box-shadow:0 1px 2px rgba(0,0,0,.12); }
.seg button:not(.on):hover{ color:var(--ink); }

/* ---------- device area ---------- */
.viewport{ flex:1; display:flex; justify-content:center; align-items:flex-start; padding:30px 20px 48px; overflow:auto; }

/* phone frame */
.device.mobile{
  width:402px; max-width:100%;
  background:#161512; border-radius:46px; padding:11px;
  box-shadow:var(--shadow-lg);
}
.device.mobile .glass{
  position:relative; border-radius:36px; overflow:hidden; background:var(--cream);
  height:780px; max-height:calc(100vh - 150px); min-height:560px;
}
.device.mobile .notch{
  position:absolute; top:0; inset-inline:0; height:30px; z-index:30; pointer-events:none;
  display:flex; justify-content:center;
}
.device.mobile .notch::after{ content:""; width:120px; height:26px; background:#161512; border-radius:0 0 16px 16px; }

/* desktop frame */
.device.desktop{
  width:1140px; max-width:100%;
  background:var(--card); border-radius:16px; overflow:hidden;
  border:1px solid var(--line); box-shadow:var(--shadow-lg);
}
.device.desktop .winbar{
  display:flex; align-items:center; gap:8px; padding:12px 16px; background:#EFE9DD; border-bottom:1px solid var(--line);
}
.device.desktop .winbar .dot{ width:11px; height:11px; border-radius:50%; }
.device.desktop .winbar .urlbar{
  margin-inline-start:14px; flex:1; max-width:420px; background:#fff; border:1px solid var(--line);
  border-radius:999px; padding:5px 14px; font-size:11.5px; color:var(--muted); text-align:center;
}
.device.desktop .glass{ height:760px; max-height:calc(100vh - 170px); overflow:hidden; background:var(--cream); }
.device.desktop .app-scroll{ overflow-y:auto; }

/* ---------- the app ---------- */
.app{ height:100%; display:flex; flex-direction:column; background:var(--cream); position:relative; }
.app-scroll{ flex:1; overflow-y:auto; overflow-x:hidden; scroll-behavior:smooth; }
.app-scroll::-webkit-scrollbar{ width:8px; }
.app-scroll::-webkit-scrollbar-thumb{ background:rgba(0,0,0,.12); border-radius:8px; }

/* app header */
.appbar{
  position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:12px;
  padding:16px 18px 14px; background:rgba(245,240,232,.92); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line-soft);
}
.device.mobile .appbar{ padding-top:34px; }
.avatar{
  width:38px; height:38px; border-radius:50%; flex:none;
  background:radial-gradient(120% 120% at 30% 25%, #3a7d65, #2e6853);
  color:#fff; display:flex; align-items:center; justify-content:center;
  font-family:'Frank Ruhl Libre',serif; font-weight:700; font-size:17px;
  box-shadow:0 0 0 2px var(--cream), 0 0 0 3.5px var(--gold);
}
.appbar .who{ display:flex; flex-direction:column; line-height:1.2; min-width:0; }
.appbar .who .biz{ font-family:'Frank Ruhl Libre',serif; font-weight:700; font-size:16px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.appbar .who .role{ font-size:11px; color:var(--muted); }
.appbar .right{ margin-inline-start:auto; display:flex; gap:6px; }
.iconbtn{
  width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--card);
  display:flex; align-items:center; justify-content:center; color:var(--muted); cursor:pointer; transition:all .16s ease;
}
.iconbtn:hover{ color:var(--ink); border-color:#d9d2c4; }
.iconbtn .ph, .iconbtn .ph-bold{ font-size:19px; }

/* back bar for sub-screens */
.backbar{ display:flex; align-items:center; gap:10px; }
.backbtn{
  display:inline-flex; align-items:center; gap:7px; background:transparent; border:0; cursor:pointer;
  color:var(--primary); font-family:'DM Sans',sans-serif; font-weight:600; font-size:14px; padding:6px 4px; border-radius:8px;
}
.backbtn .ph-bold{ font-size:18px; }
.backbtn:hover{ color:var(--primary-dk); }

/* screen container + animation */
.screen{ padding:20px 18px 40px; }
.device.desktop .screen{ padding:38px 24px 60px; max-width:720px; margin:0 auto; }
.device.desktop .appbar{ padding-inline:max(24px, calc((100% - 720px)/2 + 24px)); }
@keyframes slideFwd{ from{ transform:translateY(12px); } to{ transform:translateY(0);} }
@keyframes slideBack{ from{ transform:translateY(12px); } to{ transform:translateY(0);} }
@keyframes fadeUp{ from{ opacity:0; transform:translateY(10px);} to{ opacity:1; transform:translateY(0);} }
.screen{ animation:none; }
.anim-fwd{ animation:slideFwd .34s cubic-bezier(.22,1,.36,1) both; }
.anim-back{ animation:slideBack .34s cubic-bezier(.22,1,.36,1) both; }
@media (prefers-reduced-motion:reduce){ .anim-fwd,.anim-back{ animation:none; } }

/* ---------- typography helpers ---------- */
.eyebrow{ font-size:10.5px; letter-spacing:.13em; font-weight:700; color:var(--gold); text-transform:uppercase; }
.eyebrow.he{ letter-spacing:.06em; text-transform:none; font-size:12px; }
.greet{ margin:2px 0 0; }
.greet h1{ font-family:'Frank Ruhl Libre',serif; font-weight:900; font-size:27px; line-height:1.18; color:var(--primary); margin:0; letter-spacing:-.01em; }
.greet p{ font-size:15px; color:var(--muted); margin:7px 0 0; line-height:1.5; max-width:34ch; }
.greet p b{ color:var(--ink); font-weight:600; }
.device.desktop .greet h1{ font-size:34px; }

/* generic card */
.card{ background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow-sm); }
.card.pad{ padding:20px; }
.stack{ display:flex; flex-direction:column; gap:16px; }
.stack-sm{ display:flex; flex-direction:column; gap:10px; }

/* section heading inside screens */
.sec-head{ display:flex; align-items:baseline; justify-content:space-between; margin:6px 2px 2px; }
.sec-head h3{ font-family:'Frank Ruhl Libre',serif; font-weight:700; font-size:18px; color:var(--ink); margin:0; }
.sec-head .more{ font-size:12.5px; color:var(--primary); font-weight:600; cursor:pointer; background:none; border:0; }

/* ---------- buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  min-height:46px; padding:0 24px; border-radius:999px; cursor:pointer;
  font-family:'DM Sans',sans-serif; font-weight:600; font-size:15px; border:1px solid transparent;
  transition:all .16s ease; text-decoration:none; white-space:nowrap;
}
.btn .ph,.btn .ph-bold,.btn .ph-fill{ font-size:18px; }
.btn-primary{ background:var(--primary); color:#FFFEFB; }
.btn-primary:hover{ background:var(--primary-dk); }
.btn-primary:active{ transform:translateY(1px); }
.btn-ghost{ background:var(--card); color:var(--primary); border-color:var(--line); }
.btn-ghost:hover{ border-color:var(--primary); }
.btn-gold{ background:var(--gold); color:#fff; }
.btn-gold:hover{ filter:brightness(.94); }
.btn-block{ width:100%; }
.btn-sm{ min-height:38px; padding:0 16px; font-size:13.5px; }
.btn:focus-visible{ outline:2px solid var(--primary); outline-offset:3px; }

/* ---------- completeness card (the single widget) ---------- */
.pc{ background:var(--card-tint); border:1px solid var(--line); border-radius:18px; padding:22px; box-shadow:var(--shadow-md); position:relative; overflow:hidden; }
.pc-head{ display:flex; align-items:center; gap:16px; }
.ring{ flex:none; }
.ring-num{ font-family:'Cormorant Garamond',serif; font-weight:600; }
.pc-head .copy{ flex:1; min-width:0; }
.pc-head .copy .eyebrow{ display:block; margin-bottom:3px; }
.pc-head h2{ font-family:'Frank Ruhl Libre',serif; font-weight:700; font-size:22px; line-height:1.2; color:var(--primary); margin:0; }
.pc-head .sub{ font-size:14px; color:var(--muted); margin:5px 0 0; line-height:1.45; }
.pc-head .sub b{ color:var(--ink); font-weight:600; }
.checklist{ list-style:none; margin:18px 0 0; padding:16px 0 0; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:1px; }
.crow{ display:flex; align-items:center; gap:11px; padding:9px 8px; border-radius:11px; text-align:start; width:100%; background:none; border:0; cursor:pointer; font-family:inherit; transition:background .15s ease; }
.crow:hover{ background:rgba(0,0,0,.025); }
.cmark{ flex:none; width:22px; height:22px; display:flex; align-items:center; justify-content:center; }
.cmark .ph-bold,.cmark .ph,.cmark .ph-fill{ font-size:20px; }
.crow .lbl{ font-size:15px; line-height:1.3; color:var(--ink); flex:1; }
.crow.done .cmark{ color:var(--primary); }
.crow.done .lbl{ color:var(--muted); }
.crow.todo .cmark{ color:#c9c2b3; }
.crow.next{ background:var(--primary-soft); align-items:flex-start; padding:12px; }
.crow.next:hover{ background:rgba(46,104,83,.12); }
.crow.next .cmark{ color:var(--primary); margin-top:1px; }
.crow.next .nextcopy{ display:flex; flex-direction:column; gap:2px; flex:1; }
.crow.next .ne{ font-size:10px; letter-spacing:.12em; text-transform:uppercase; font-weight:700; color:var(--primary); }
.crow.next .lbl{ font-weight:600; font-size:16px; }
.crow .tick{ font-size:11px; color:var(--faint); }
.pc-cta{ margin-top:18px; }

/* slim "profile full" success row (live) */
.pc-slim{ display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:13px 16px; box-shadow:var(--shadow-sm); }
.pc-slim .ic{ width:30px; height:30px; border-radius:50%; background:var(--primary-soft); color:var(--primary); display:flex; align-items:center; justify-content:center; flex:none; }
.pc-slim .ic .ph-fill{ font-size:18px; }
.pc-slim .t{ font-size:14px; font-weight:600; color:var(--ink); }
.pc-slim .t span{ color:var(--muted); font-weight:400; }
.pc-slim .x{ margin-inline-start:auto; background:none; border:0; color:var(--faint); cursor:pointer; font-size:18px; display:flex; }

/* ---------- phone verify strip ---------- */
.verify{ background:var(--gold-soft); border:1px solid rgba(139,105,20,.22); border-radius:16px; padding:16px 18px; }
.verify .top{ display:flex; align-items:flex-start; gap:13px; }
.verify .ic{ width:38px; height:38px; border-radius:11px; background:rgba(139,105,20,.16); color:var(--gold); display:flex; align-items:center; justify-content:center; flex:none; }
.verify .ic .ph-fill,.verify .ic .ph{ font-size:21px; }
.verify .copy h4{ font-family:'Frank Ruhl Libre',serif; font-weight:700; font-size:16px; margin:0; color:var(--ink); }
.verify .copy p{ font-size:13.5px; color:var(--muted); margin:3px 0 0; line-height:1.45; }
.verify .act{ margin-top:13px; display:flex; gap:9px; align-items:center; flex-wrap:wrap; }
.verify.done{ background:var(--primary-soft); border-color:rgba(46,104,83,.22); }
.verify.done .ic{ background:rgba(46,104,83,.14); color:var(--primary); }
.codebox{ display:flex; gap:8px; align-items:center; }
.codebox input{ width:46px; height:48px; text-align:center; font-family:'Cormorant Garamond',serif; font-size:22px; font-weight:600; border:1px solid var(--line); border-radius:11px; background:#fff; color:var(--ink); }
.codebox input:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 3px var(--gold-soft); }

/* ---------- availability toggle ---------- */
.avail{ display:flex; align-items:center; gap:13px; padding:16px 18px; }
.avail .ic{ width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; flex:none; background:var(--primary-soft); color:var(--primary); }
.avail .ic .ph-fill{ font-size:20px; }
.avail .copy{ flex:1; min-width:0; }
.avail .copy h4{ font-weight:600; font-size:15px; margin:0; color:var(--ink); }
.avail .copy p{ font-size:12.5px; color:var(--muted); margin:2px 0 0; }
.switch{ inline-size:50px; block-size:30px; border-radius:999px; background:#d8d1c2; border:0; cursor:pointer; position:relative; flex:none; transition:background .22s ease; padding:0; }
.switch::after{ content:""; position:absolute; inset-block-start:3px; inset-inline-start:3px; width:24px; height:24px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:inset-inline-start .22s cubic-bezier(.22,1,.36,1); }
.switch.on{ background:var(--primary); }
.switch.on::after{ inset-inline-start:23px; }

/* ---------- empty state (single analytics teaser) ---------- */
.empty{ background:var(--card); border:1px dashed #d9d1bf; border-radius:18px; padding:28px 22px; text-align:center; }
.empty .glyph{ width:58px; height:58px; border-radius:50%; margin:0 auto; background:var(--primary-soft); color:var(--primary); display:flex; align-items:center; justify-content:center; }
.empty .glyph .ph{ font-size:30px; }
.empty h3{ font-family:'Frank Ruhl Libre',serif; font-weight:700; font-size:20px; color:var(--ink); margin:16px 0 0; }
.empty .lede{ font-size:14px; color:var(--muted); margin:7px auto 0; line-height:1.5; max-width:30ch; }
.steps{ list-style:none; margin:20px 0 0; padding:0; display:flex; flex-direction:column; gap:10px; text-align:start; }
.steps li{ display:flex; align-items:center; gap:12px; }
.steps .n{ width:26px; height:26px; border-radius:50%; flex:none; background:var(--card-tint); border:1px solid var(--line); color:var(--primary); display:flex; align-items:center; justify-content:center; font-family:'Cormorant Garamond',serif; font-weight:600; font-size:15px; }
.steps .st{ font-size:14px; color:var(--ink); }
.empty .cta{ margin-top:20px; }

/* ---------- drill-in section rows ---------- */
.navlist{ display:flex; flex-direction:column; gap:10px; }
.navrow{ display:flex; align-items:center; gap:14px; width:100%; text-align:start; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:15px 16px; cursor:pointer; transition:all .16s ease; font-family:inherit; }
.navrow:hover{ border-color:#d6cebd; transform:translateX(-2px); box-shadow:var(--shadow-sm); }
.navrow .ic{ width:42px; height:42px; border-radius:12px; flex:none; background:var(--primary-soft); color:var(--primary); display:flex; align-items:center; justify-content:center; }
.navrow .ic .ph{ font-size:22px; }
.navrow .copy{ flex:1; min-width:0; }
.navrow .copy h4{ font-weight:600; font-size:15.5px; margin:0; color:var(--ink); }
.navrow .copy p{ font-size:12.5px; color:var(--muted); margin:2px 0 0; }
.navrow .chev{ color:var(--faint); font-size:20px; display:flex; }
.navrow.locked{ opacity:.62; cursor:default; }
.navrow.locked:hover{ transform:none; box-shadow:none; border-color:var(--line); }
.navrow.locked .ic{ background:#efe9dd; color:var(--faint); }
.navrow .badge{ background:var(--primary); color:#fff; font-size:11px; font-weight:700; border-radius:999px; padding:2px 9px; font-family:'Cormorant Garamond',serif; font-size:13px; }

/* ---------- KPI cards (live) ---------- */
.kpigrid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.device.desktop .kpigrid{ grid-template-columns:repeat(4,1fr); }
.kpi{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; box-shadow:var(--shadow-sm); }
.kpi .topr{ display:flex; align-items:center; justify-content:space-between; }
.kpi .topr .ic{ color:var(--primary); font-size:19px; display:flex; }
.kpi .delta{ font-size:11.5px; font-weight:700; color:var(--primary); display:inline-flex; align-items:center; gap:2px; background:var(--primary-soft); padding:2px 7px; border-radius:999px; }
.kpi .delta .ph-bold{ font-size:11px; }
.kpi .val{ font-family:'Cormorant Garamond',serif; font-weight:600; font-size:38px; line-height:1; color:var(--ink); margin-top:12px; }
.kpi .lbl{ font-size:13px; color:var(--muted); margin-top:4px; }

/* ---------- trend chart ---------- */
.chartcard{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px 18px 12px; box-shadow:var(--shadow-sm); }
.chartcard .ch-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:6px; }
.chartcard .ch-head h4{ font-family:'Frank Ruhl Libre',serif; font-weight:700; font-size:16px; margin:0; }
.chartcard .ch-head .rng{ font-size:11.5px; color:var(--muted); font-weight:600; }
.chartcard .ch-total{ font-family:'Cormorant Garamond',serif; font-weight:600; font-size:30px; color:var(--ink); line-height:1; margin:2px 0 8px; }
.chartcard svg{ display:block; width:100%; height:auto; }

/* ---------- recent activity ---------- */
.activity{ display:flex; flex-direction:column; }
.act-item{ display:flex; align-items:center; gap:13px; padding:13px 4px; border-bottom:1px solid var(--line-soft); }
.act-item:last-child{ border-bottom:0; }
.act-item .ic{ width:36px; height:36px; border-radius:10px; flex:none; display:flex; align-items:center; justify-content:center; background:var(--primary-soft); color:var(--primary); }
.act-item .ic .ph,.act-item .ic .ph-fill{ font-size:18px; }
.act-item .ic.gold{ background:var(--gold-soft); color:var(--gold); }
.act-item .copy{ flex:1; min-width:0; }
.act-item .copy .t{ font-size:14px; color:var(--ink); font-weight:500; }
.act-item .copy .t b{ font-weight:700; }
.act-item .when{ font-size:11.5px; color:var(--faint); white-space:nowrap; }

/* ---------- edit section ---------- */
.field{ margin-bottom:16px; }
.field label{ display:block; font-size:12.5px; font-weight:600; color:var(--ink); margin-bottom:6px; }
.field .hint{ font-size:11.5px; color:var(--faint); font-weight:400; }
.input, .textarea{
  width:100%; border:1px solid var(--line); border-radius:12px; background:#fff; color:var(--ink);
  font-family:'DM Sans',sans-serif; font-size:15px; padding:12px 14px; transition:all .15s ease;
}
.textarea{ min-height:88px; resize:vertical; line-height:1.5; }
.input:focus,.textarea:focus{ outline:none; border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-soft); }
.input-icon{ position:relative; }
.input-icon .ph,.input-icon .ph-bold{ position:absolute; inset-block-start:50%; transform:translateY(-50%); inset-inline-start:14px; color:var(--faint); font-size:18px; pointer-events:none; }
.input-icon input{ padding-inline-start:42px; }
.tagrow{ display:flex; gap:8px; flex-wrap:wrap; }
.tag-pill{ display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:#fff; border-radius:999px; padding:7px 13px; font-size:13px; font-weight:600; color:var(--muted); cursor:pointer; transition:all .15s ease; }
.tag-pill.on{ background:var(--primary); color:#fff; border-color:var(--primary); }
.tag-pill:not(.on):hover{ border-color:var(--primary); color:var(--primary); }

/* group list (structure-only) */
.grouplist{ display:flex; flex-direction:column; gap:0; background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; box-shadow:var(--shadow-sm); }
.grouprow{ display:flex; align-items:center; gap:14px; padding:16px; border-bottom:1px solid var(--line-soft); cursor:pointer; background:none; border-left:0; border-right:0; border-top:0; width:100%; text-align:start; font-family:inherit; transition:background .15s ease; }
.grouprow:last-child{ border-bottom:0; }
.grouprow:hover{ background:var(--primary-softer); }
.grouprow.open{ background:var(--primary-softer); }
.grouprow .ic{ width:38px; height:38px; border-radius:11px; flex:none; background:var(--primary-soft); color:var(--primary); display:flex; align-items:center; justify-content:center; }
.grouprow .ic .ph{ font-size:20px; }
.grouprow .copy{ flex:1; min-width:0; }
.grouprow .copy h4{ font-weight:600; font-size:15px; margin:0; color:var(--ink); }
.grouprow .copy p{ font-size:12px; color:var(--muted); margin:2px 0 0; }
.grouprow .status{ font-size:11.5px; font-weight:600; }
.grouprow .status.ok{ color:var(--primary); }
.grouprow .status.todo{ color:var(--gold); }
.grouprow .chev{ color:var(--faint); font-size:18px; display:flex; transition:transform .2s ease; }
.grouprow.open .chev{ transform:rotate(-90deg); }
.group-body{ background:var(--card-tint); border:1px solid var(--line); border-top:0; border-radius:0 0 16px 16px; padding:18px; margin-top:-1px; }
.group-body .rep-tag{ display:inline-flex; align-items:center; gap:6px; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; font-weight:700; color:var(--gold); margin-bottom:14px; }

/* structure placeholder block */
.struct{ display:flex; flex-direction:column; gap:10px; }
.struct-row{ display:flex; align-items:center; gap:12px; padding:14px 16px; border:1px dashed #d9d1bf; border-radius:13px; background:rgba(255,255,255,.4); }
.struct-row .ic{ width:34px; height:34px; border-radius:10px; background:#efe9dd; color:var(--muted); display:flex; align-items:center; justify-content:center; flex:none; }
.struct-row .ic .ph{ font-size:18px; }
.struct-row .copy h4{ font-size:14px; font-weight:600; margin:0; color:var(--ink); }
.struct-row .copy p{ font-size:12px; color:var(--muted); margin:2px 0 0; }
.struct-row .tagx{ margin-inline-start:auto; font-size:10px; letter-spacing:.08em; text-transform:uppercase; font-weight:700; color:var(--faint); border:1px solid var(--line); border-radius:999px; padding:3px 9px; }

/* tools share card */
.share-actions{ display:flex; flex-direction:column; gap:10px; margin-top:16px; }
.share-btn{ display:flex; align-items:center; gap:13px; width:100%; padding:14px 16px; border-radius:13px; border:1px solid var(--line); background:#fff; cursor:pointer; font-family:inherit; text-align:start; transition:all .15s ease; }
.share-btn:hover{ border-color:#d6cebd; box-shadow:var(--shadow-sm); }
.share-btn .ic{ width:40px; height:40px; border-radius:11px; flex:none; display:flex; align-items:center; justify-content:center; font-size:21px; }
.share-btn .ic.wa{ background:#25D36618; color:#1faa53; }
.share-btn .ic.link{ background:var(--primary-soft); color:var(--primary); }
.share-btn .ic.story{ background:var(--gold-soft); color:var(--gold); }
.share-btn .copy{ flex:1; }
.share-btn .copy h4{ font-size:14.5px; font-weight:600; margin:0; }
.share-btn .copy p{ font-size:12px; color:var(--muted); margin:2px 0 0; }
.share-btn .state{ font-size:12px; font-weight:700; color:var(--primary); }
.qr{ margin-top:16px; display:flex; align-items:center; gap:16px; background:var(--card-tint); border:1px solid var(--line); border-radius:14px; padding:16px; }
.qr .code{ width:78px; height:78px; border-radius:10px; background:#fff; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; flex:none; color:var(--ink); }
.qr .code .ph{ font-size:54px; }
.qr .copy h4{ font-size:14px; font-weight:600; margin:0; }
.qr .copy p{ font-size:12px; color:var(--muted); margin:3px 0 0; line-height:1.45; }

/* ---------- spoke cards (hub launchpad) ---------- */
.spokes-head{ display:flex; align-items:baseline; justify-content:space-between; margin:4px 2px 0; }
.spokes-head h3{ font-family:'Frank Ruhl Libre',serif; font-weight:700; font-size:18px; color:var(--ink); margin:0; }
.spokes-head .hint{ font-size:11.5px; color:var(--faint); }
.spokes{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.device.desktop .spokes{ grid-template-columns:repeat(3,1fr); }
.spoke{ position:relative; display:flex; flex-direction:column; text-align:start; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; cursor:pointer; font-family:inherit; transition:all .18s ease; box-shadow:var(--shadow-sm); min-height:128px; }
.spoke:hover{ border-color:#d6cebd; transform:translateY(-2px); box-shadow:var(--shadow-md); }
.spoke .ic{ width:42px; height:42px; border-radius:12px; background:var(--primary-soft); color:var(--primary); display:flex; align-items:center; justify-content:center; }
.spoke .ic .ph{ font-size:23px; }
.spoke h4{ font-family:'Frank Ruhl Libre',serif; font-weight:700; font-size:17px; margin:13px 0 0; color:var(--ink); }
.spoke p{ font-size:12.5px; color:var(--muted); margin:3px 0 0; line-height:1.4; }
.spoke .meta{ margin-top:auto; padding-top:12px; display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:var(--primary); }
.spoke .meta .ph,.spoke .meta .ph-bold{ font-size:14px; }
.spoke .meta .kpibadge{ font-family:'Cormorant Garamond',serif; font-weight:600; font-size:20px; }
.spoke .chev{ position:absolute; inset-block-start:16px; inset-inline-end:14px; color:var(--faint); font-size:18px; display:flex; }
.spoke .lockt{ margin-top:auto; padding-top:12px; font-size:11.5px; color:var(--gold); font-weight:600; display:flex; align-items:center; gap:5px; }
.spoke .lockt .ph{ font-size:14px; }
/* recede/dim when incomplete */
.spokes.dim .spoke{ background:transparent; box-shadow:none; border-color:var(--line-soft); }
.spokes.dim .spoke .ic{ background:#efe9dd; color:var(--faint); }
.spokes.dim .spoke h4{ color:var(--muted); font-weight:500; }
.spokes.dim .spoke:hover{ transform:translateY(-1px); border-color:var(--line); box-shadow:var(--shadow-sm); }

/* ---------- availability status selector (verbatim states) ---------- */
.availcard{ padding:16px 18px; }
.availcard .top{ display:flex; align-items:center; gap:12px; margin-bottom:14px; }
.availcard .top .ic{ width:36px; height:36px; border-radius:10px; background:var(--primary-soft); color:var(--primary); display:flex; align-items:center; justify-content:center; flex:none; }
.availcard .top .ic .ph-fill{ font-size:19px; }
.availcard .top h4{ font-weight:600; font-size:15px; margin:0; }
.availcard .top p{ font-size:12px; color:var(--muted); margin:2px 0 0; }
.availopts{ display:flex; flex-wrap:wrap; gap:8px; }
.availopt{ display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line); background:#fff; border-radius:999px; padding:9px 14px; font-family:inherit; font-size:13.5px; font-weight:600; color:var(--muted); cursor:pointer; transition:all .15s ease; }
.availopt .dot{ width:8px; height:8px; border-radius:50%; background:#cfc8b8; flex:none; }
.availopt:hover{ border-color:#cfc7b6; color:var(--ink); }
.availopt.on{ background:var(--primary); color:#fff; border-color:var(--primary); box-shadow:0 1px 2px rgba(0,0,0,.1); }
.availopt.on .dot{ background:#9fe6c2; }
.availopt[data-tone="busy"].on{ background:var(--gold); border-color:var(--gold); }
.availopt[data-tone="busy"].on .dot{ background:#f0d68a; }
.availopt[data-tone="break"].on{ background:#7a756c; border-color:#7a756c; }

/* toast */
.toast{ position:absolute; inset-inline:0; bottom:18px; display:flex; justify-content:center; pointer-events:none; z-index:60; }
.toast .pill{ background:var(--ink); color:#fff; font-size:13.5px; font-weight:600; padding:11px 18px; border-radius:999px; display:flex; align-items:center; gap:8px; box-shadow:0 10px 30px -10px rgba(0,0,0,.4); animation:fadeUp .3s ease both; }
.toast .pill .ph-fill{ color:#8fd3b0; font-size:17px; }

/* ---------- actionable activity / inbox (live) ---------- */
.inbox-head{ display:flex; align-items:center; gap:9px; margin-bottom:4px; }
.inbox-head h3{ font-family:'Frank Ruhl Libre',serif; font-weight:700; font-size:18px; margin:0; }
.inbox-head .cnt{ background:var(--primary); color:#fff; font-family:'Cormorant Garamond',serif; font-weight:600; font-size:14px; line-height:1; border-radius:999px; padding:3px 9px; }
.inbox-head .more{ margin-inline-start:auto; font-size:12.5px; color:var(--primary); font-weight:600; background:none; border:0; cursor:pointer; }
.msglist{ display:flex; flex-direction:column; gap:8px; }
.msgrow{ display:flex; align-items:center; gap:12px; width:100%; text-align:start; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; cursor:pointer; font-family:inherit; transition:all .16s ease; }
.msgrow:hover{ border-color:#bcd3c7; box-shadow:var(--shadow-sm); transform:translateX(-2px); }
.msgrow.unread{ background:var(--primary-softer); border-color:rgba(46,104,83,.20); }
.msgrow .wa{ width:40px; height:40px; border-radius:11px; flex:none; display:flex; align-items:center; justify-content:center; background:rgba(37,211,102,.12); color:#1faa53; }
.msgrow .wa .ph-fill,.msgrow .wa .ph{ font-size:22px; }
.msgrow .mbody{ flex:1; min-width:0; }
.msgrow .nm{ font-weight:700; font-size:14px; color:var(--ink); display:flex; align-items:center; gap:6px; }
.msgrow .nm .udot{ width:7px; height:7px; border-radius:50%; background:var(--primary); flex:none; }
.msgrow .msg{ font-size:13px; color:var(--muted); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.msgrow .rcol{ display:flex; flex-direction:column; align-items:flex-end; gap:6px; flex:none; }
.msgrow .when{ font-size:11px; color:var(--faint); white-space:nowrap; }
.msgrow .reply{ display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:700; color:#1faa53; }
.msgrow .reply .ph-bold{ font-size:14px; }
.inbox-more{ margin-top:12px; padding-top:12px; border-top:1px solid var(--line-soft); display:flex; flex-direction:column; gap:0; }
.act-strip{ display:flex; align-items:center; gap:11px; padding:9px 2px; }
.act-strip .ic{ width:30px; height:30px; border-radius:9px; flex:none; display:flex; align-items:center; justify-content:center; background:var(--gold-soft); color:var(--gold); }
.act-strip .ic.view{ background:var(--primary-soft); color:var(--primary); }
.act-strip .ic .ph-fill,.act-strip .ic .ph{ font-size:16px; }
.act-strip .t{ font-size:13px; color:var(--ink); flex:1; }
.act-strip .when{ font-size:11px; color:var(--faint); }

/* ---------- KPI section header + window footnote ---------- */
.kpi-head{ display:flex; align-items:baseline; justify-content:space-between; margin:2px 2px 0; }
.kpi-head h3{ font-family:'Frank Ruhl Libre',serif; font-weight:700; font-size:18px; margin:0; }
.kpi-head .win{ font-size:11.5px; color:var(--muted); font-weight:600; }
.kpi-foot{ font-size:11.5px; color:var(--faint); margin:10px 2px 0; display:flex; align-items:center; gap:5px; }
.kpi-foot .ph{ font-size:13px; }
.kpi.lead{ border-color:rgba(46,104,83,.28); box-shadow:0 1px 2px rgba(28,26,23,.04), inset 0 0 0 1px rgba(46,104,83,.06); }
.kpi.lead .ic{ color:#1faa53; }

/* ---------- view-public-page affordance ---------- */
.pc-slim .viewbtn{ display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:700; color:var(--primary); background:var(--primary-soft); border:0; border-radius:999px; padding:7px 13px; cursor:pointer; margin-inline-start:auto; transition:background .15s ease; }
.pc-slim .viewbtn:hover{ background:rgba(46,104,83,.14); }
.pc-slim .viewbtn .ph-bold{ font-size:14px; }
.pc-slim .x{ margin-inline-start:8px; }
.previewrow{ display:flex; align-items:center; gap:11px; width:100%; text-align:start; background:var(--card); border:1px solid var(--line); border-radius:13px; padding:12px 14px; cursor:pointer; font-family:inherit; transition:all .16s ease; }
.previewrow:hover{ border-color:#d6cebd; box-shadow:var(--shadow-sm); }
.previewrow .ic{ width:34px; height:34px; border-radius:10px; flex:none; background:var(--primary-soft); color:var(--primary); display:flex; align-items:center; justify-content:center; }
.previewrow .ic .ph{ font-size:18px; }
.previewrow .copy{ flex:1; }
.previewrow .copy h4{ font-size:13.5px; font-weight:600; margin:0; color:var(--ink); }
.previewrow .copy p{ font-size:11.5px; color:var(--muted); margin:2px 0 0; }
.previewrow .chev{ color:var(--faint); font-size:17px; display:flex; }

/* ---------- launch path (replaces pre-data analytics empty) ---------- */
.launch{ background:var(--card); border:1px dashed #d9d1bf; border-radius:18px; padding:22px; }
.launch .glyph{ width:50px; height:50px; border-radius:50%; background:var(--primary-soft); color:var(--primary); display:flex; align-items:center; justify-content:center; }
.launch .glyph .ph{ font-size:26px; }
.launch h3{ font-family:'Frank Ruhl Libre',serif; font-weight:700; font-size:19px; color:var(--ink); margin:14px 0 0; }
.launch .lede{ font-size:13.5px; color:var(--muted); margin:6px 0 0; line-height:1.5; }
.lsteps{ list-style:none; margin:16px 0 0; padding:0; }
.lstep{ display:flex; align-items:flex-start; gap:12px; padding:13px 0; border-bottom:1px solid var(--line-soft); }
.lstep:last-child{ border-bottom:0; padding-bottom:0; }
.lstep .mk{ width:27px; height:27px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; font-family:'Cormorant Garamond',serif; font-weight:600; font-size:15px; }
.lstep.active .mk{ background:var(--primary); color:#fff; }
.lstep.wait .mk{ background:var(--gold-soft); color:var(--gold); border:1px solid rgba(139,105,20,.25); }
.lstep.locked .mk{ background:#efe9dd; color:var(--faint); }
.lstep .lc{ flex:1; min-width:0; }
.lstep .lc h5{ font-size:14.5px; font-weight:600; margin:0; color:var(--ink); }
.lstep.locked .lc h5{ color:var(--muted); }
.lstep .lc p{ font-size:12px; color:var(--muted); margin:3px 0 0; line-height:1.45; }
.lstep .pill{ align-self:center; font-size:10px; letter-spacing:.04em; font-weight:700; border-radius:999px; padding:4px 9px; white-space:nowrap; display:inline-flex; align-items:center; gap:4px; }
.lstep .pill.now{ background:var(--primary-soft); color:var(--primary); }
.lstep .pill.wait{ background:var(--gold-soft); color:var(--gold); }
.lstep .pill.lock{ background:#efe9dd; color:var(--faint); }
.lstep .pill .ph,.lstep .pill .ph-fill{ font-size:11px; }

/* ---------- availability disabled (pre-publish) ---------- */
.availcard.locked .top p{ color:var(--gold); }
.availcard.locked .availopts{ opacity:.5; pointer-events:none; filter:saturate(.5); }
.avail-note{ display:flex; align-items:center; gap:7px; margin-top:13px; font-size:12.5px; color:var(--gold); font-weight:600; }
.avail-note .ph,.avail-note .ph-fill{ font-size:15px; }

/* ---------- soft preview (תובנות pre-data, Mixpanel demo pattern) ---------- */
.spoke .sample{ margin-top:auto; padding-top:12px; }
.spoke .sample .blur{ font-family:'Cormorant Garamond',serif; font-weight:600; font-size:21px; color:var(--primary); filter:blur(3.5px); opacity:.55; user-select:none; line-height:1; }
.spoke .sample .cap{ font-size:10.5px; color:var(--muted); margin-top:5px; display:flex; align-items:center; gap:4px; }
.spoke .sample .cap .ph{ font-size:12px; }
.preview-wrap{ position:relative; border-radius:18px; overflow:hidden; }
.preview-blur{ filter:blur(5px); opacity:.5; pointer-events:none; user-select:none; }
.preview-cap{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:18px; }
.preview-cap .badge{ background:rgba(245,240,232,.78); backdrop-filter:blur(3px); border:1px solid var(--line); border-radius:16px; padding:20px 22px; box-shadow:var(--shadow-md); text-align:center; max-width:88%; }
.preview-cap .badge .glyph{ width:46px; height:46px; border-radius:50%; margin:0 auto; background:var(--primary-soft); color:var(--primary); display:flex; align-items:center; justify-content:center; }
.preview-cap .badge .glyph .ph{ font-size:24px; }
.preview-cap .badge h3{ font-family:'Frank Ruhl Libre',serif; font-weight:700; font-size:18px; color:var(--ink); margin:12px 0 0; }
.preview-cap .badge p{ font-size:13px; color:var(--muted); margin:6px 0 0; line-height:1.5; }
.preview-cap .badge .cta{ margin-top:14px; }

/* ---------- inbox message states (new → handled) ---------- */
.msgrow .mainarea{ display:flex; align-items:center; gap:12px; flex:1; min-width:0; cursor:pointer; background:none; border:0; text-align:start; font-family:inherit; padding:0; }
.msgrow.handled{ background:var(--card); border-color:var(--line); opacity:.66; }
.msgrow.handled .wa{ background:#ecefe9; color:#9aa39c; }
.msgrow.handled .nm{ color:var(--muted); font-weight:600; }
.msgrow.handled .nm .udot{ display:none; }
.msgrow.handled:hover{ transform:none; box-shadow:none; border-color:var(--line); }
.rowacts{ display:flex; flex-direction:column; align-items:flex-end; gap:5px; }
.reply-btn{ background:none; border:0; cursor:pointer; display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:700; color:#1faa53; padding:2px 0; }
.reply-btn .ph-bold{ font-size:14px; }
.markbtn{ background:none; border:0; cursor:pointer; font-size:11px; font-weight:600; color:var(--faint); display:inline-flex; align-items:center; gap:4px; padding:2px 0; }
.markbtn:hover{ color:var(--primary); }
.markbtn .ph-bold{ font-size:12px; }
.done-tag{ display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:700; color:var(--primary); }
.done-tag .ph-fill{ font-size:15px; }
.inbox-head .alldone{ display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:700; color:var(--primary); }
.inbox-head .alldone .ph-fill{ font-size:15px; }

/* ---------- quiet conversion line ---------- */
.conv-line{ display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); margin-top:12px; padding:10px 13px; background:var(--primary-softer); border:1px solid var(--line-soft); border-radius:12px; }
.conv-line b{ font-family:'Cormorant Garamond',serif; font-weight:600; font-size:18px; color:var(--primary); line-height:1; }
.conv-line .ph{ font-size:16px; color:var(--primary); flex:none; }
.conv-line .tip{ color:var(--faint); margin-inline-start:4px; }

/* ---------- anonymous activity pulse (round 4) ---------- */
.pulse{ display:flex; flex-direction:column; }
.pulse-row{ display:flex; align-items:center; gap:12px; padding:12px 2px; border-bottom:1px solid var(--line-soft); }
.pulse-row:last-child{ border-bottom:0; }
.pulse-row .ic{ width:36px; height:36px; border-radius:10px; flex:none; display:flex; align-items:center; justify-content:center; background:var(--primary-soft); color:var(--primary); }
.pulse-row .ic.wa{ background:rgba(37,211,102,.12); color:#1faa53; }
.pulse-row .ic.gold{ background:var(--gold-soft); color:var(--gold); }
.pulse-row .ic .ph-fill,.pulse-row .ic .ph{ font-size:18px; }
.pulse-row .t{ font-size:14px; color:var(--ink); flex:1; font-weight:500; }
.pulse-row .when{ font-size:11.5px; color:var(--faint); white-space:nowrap; }
.pulse-cta{ margin-top:16px; }
.pulse-empty{ text-align:center; padding:16px 8px 6px; }
.pulse-empty .glyph{ width:48px; height:48px; border-radius:50%; margin:0 auto; background:var(--primary-soft); color:var(--primary); display:flex; align-items:center; justify-content:center; }
.pulse-empty .glyph .ph{ font-size:25px; }
.pulse-empty p{ font-size:14px; color:var(--muted); margin:13px auto 0; line-height:1.5; max-width:28ch; }
.pulse-empty .cta{ margin-top:15px; }

.hide{ display:none !important; }

/* ============================================================
   Round 5 additions — tab bar · preview mode · bindings · help
   ============================================================ */
/* tab bar (mobile, bottom) — exists in code: סקירה/עריכה/תובנות/כלים */
.tabbar{ flex:none; display:flex; gap:2px; padding:7px 10px 12px; background:rgba(255,254,251,.97); border-top:1px solid var(--line); backdrop-filter:blur(8px); z-index:25; }
.tabbar .tab{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:0; cursor:pointer; color:var(--faint); font-family:'DM Sans','Heebo',sans-serif; font-size:10.5px; font-weight:600; padding:7px 4px 5px; border-radius:12px; min-height:50px; transition:color .15s ease; }
.tabbar .tab .ph,.tabbar .tab .ph-fill{ font-size:22px; }
.tabbar .tab.on{ color:var(--primary); }
.tabbar .tab:not(.on):hover{ color:var(--muted); }
/* tab bar (desktop, top row under appbar) */
.tabs-top{ flex:none; display:flex; gap:6px; padding:0 max(24px, calc((100% - 1024px)/2 + 24px)); background:rgba(245,240,232,.92); border-bottom:1px solid var(--line-soft); z-index:19; }
.tabs-top .tab{ display:inline-flex; align-items:center; gap:8px; background:none; border:0; border-bottom:2.5px solid transparent; cursor:pointer; color:var(--muted); font-family:'DM Sans','Heebo',sans-serif; font-size:14px; font-weight:600; padding:13px 14px; transition:color .15s ease; }
.tabs-top .tab .ph,.tabs-top .tab .ph-fill{ font-size:19px; }
.tabs-top .tab.on{ color:var(--primary); border-bottom-color:var(--primary); }

/* desktop width per spec: max-w-5xl */
.device.desktop .screen{ max-width:1024px; }
.device.desktop .appbar{ padding-inline:max(24px, calc((100% - 1024px)/2 + 24px)); }

/* preview mode ("ככה הלקוחות רואות אותך") */
.pv-bar{ flex:none; display:flex; align-items:center; gap:10px; padding:12px 16px; background:var(--primary); color:#fff; z-index:26; }
.device.mobile .pv-bar{ padding-top:34px; }
.pv-bar .t{ display:flex; align-items:center; gap:8px; font-size:13.5px; font-weight:600; }
.pv-bar .t .ph,.pv-bar .t .ph-fill{ font-size:17px; }
.pv-bar .back{ margin-inline-start:auto; display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.35); color:#fff; border-radius:999px; padding:7px 14px; font-family:'DM Sans','Heebo',sans-serif; font-size:12.5px; font-weight:700; cursor:pointer; transition:background .15s ease; }
.pv-bar .back:hover{ background:rgba(255,255,255,.24); }
.pub-hero{ height:210px; background:repeating-linear-gradient(45deg,#EDE6D8 0 14px,#E3DACA 14px 28px); display:flex; align-items:flex-end; padding:14px; }
.pub-hero .cap{ font:600 10px/1.3 ui-monospace,monospace; color:#8a8272; background:rgba(255,254,251,.85); border:1px dashed #c9c0ac; border-radius:8px; padding:6px 9px; direction:ltr; }
.pub-body{ padding:18px 18px 40px; display:flex; flex-direction:column; gap:14px; }
.device.desktop .pub-body{ max-width:640px; margin:0 auto; }
.device.desktop .pub-hero{ height:280px; }
.pub-name{ font-family:'Frank Ruhl Libre',serif; font-weight:900; font-size:26px; color:var(--ink); margin:0; }
.pub-meta{ display:flex; flex-wrap:wrap; gap:7px; align-items:center; }
.pub-chip{ display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600; color:var(--muted); background:var(--card); border:1px solid var(--line); border-radius:999px; padding:5px 11px; }
.pub-chip.avail{ color:var(--primary); background:var(--primary-soft); border-color:rgba(46,104,83,.25); }
.pub-chip .ph,.pub-chip .ph-fill{ font-size:13px; }
.pub-rating{ display:flex; align-items:center; gap:7px; font-size:13.5px; color:var(--ink); }
.pub-rating .stars{ color:var(--gold); display:flex; gap:1px; }
.pub-rating .num{ font-family:'Cormorant Garamond',serif; font-weight:600; font-size:17px; }
.pub-bio{ font-size:14.5px; line-height:1.6; color:var(--ink); margin:0; }
.pub-gal{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.pub-gal .tile{ aspect-ratio:1; border-radius:12px; background:repeating-linear-gradient(45deg,#EDE6D8 0 10px,#E3DACA 10px 20px); border:1px dashed #cfc6b2; display:flex; align-items:center; justify-content:center; }
.pub-gal .tile span{ font:600 9px/1 ui-monospace,monospace; color:#8a8272; direction:ltr; }
.pub-faq .q{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:13px 2px; border-top:1px solid var(--line-soft); font-size:14px; font-weight:600; color:var(--ink); }

/* quiet help line */
.helpline{ display:flex; justify-content:center; padding:20px 0 4px; }
.helpline a{ display:inline-flex; align-items:center; gap:7px; font-size:13px; font-weight:600; color:var(--muted); text-decoration:none; border-bottom:1px dashed #cfc6b2; padding-bottom:3px; transition:color .15s ease; }
.helpline a .ph-fill{ color:#1faa53; font-size:16px; }
.helpline a:hover{ color:var(--primary); }

/* completeness 100% — calm editorial moment */
.pc.complete{ border-color:rgba(139,105,20,.4); }
.pc .seal{ color:var(--gold); display:inline-flex; margin-inline-end:7px; vertical-align:-3px; animation:sealIn .5s cubic-bezier(.34,1.4,.5,1) both; }
.pc .seal .ph-fill{ font-size:24px; }
@keyframes sealIn{ from{ transform:scale(.4); opacity:0; } to{ transform:scale(1); opacity:1; } }
@media (prefers-reduced-motion:reduce){ .pc .seal{ animation:none; } }

/* data-binding annotations (deliverable 3) */
.bind-tag{ display:none; font:600 9px/1.1 ui-monospace,monospace; color:#7a5f10; background:rgba(139,105,20,.1); border:1px solid rgba(139,105,20,.3); border-radius:4px; padding:2px 5px; direction:ltr; unicode-bidi:embed; vertical-align:middle; margin-inline:5px; white-space:nowrap; }
.bind-tag.nb{ color:#a33d2a; background:rgba(194,69,47,.08); border-color:rgba(194,69,47,.35); }
.show-bindings .bind-tag{ display:inline-block; }
.nb-panel{ display:none; background:#fff; border:1px solid rgba(194,69,47,.3); border-radius:14px; padding:16px 18px; }
.show-bindings .nb-panel{ display:block; }
.nb-panel h4{ font:700 11px/1 ui-monospace,monospace; color:#a33d2a; letter-spacing:.08em; margin:0 0 10px; }
.nb-panel ul{ margin:0; padding-inline-start:16px; font-size:12.5px; color:var(--muted); line-height:1.6; }

/* settings rows */
.setrow{ display:flex; align-items:center; gap:13px; padding:15px 16px; border-bottom:1px solid var(--line-soft); }
.setrow:last-child{ border-bottom:0; }
.setrow .ic{ width:36px; height:36px; border-radius:10px; background:var(--primary-soft); color:var(--primary); display:flex; align-items:center; justify-content:center; flex:none; }
.setrow .ic .ph{ font-size:18px; }
.setrow .copy{ flex:1; min-width:0; }
.setrow .copy h5{ font-size:12px; font-weight:600; color:var(--muted); margin:0; }
.setrow .copy p{ font-size:14.5px; color:var(--ink); margin:2px 0 0; font-weight:500; }
.setrow .actx{ font-size:12.5px; font-weight:700; color:var(--primary); background:none; border:0; cursor:pointer; font-family:inherit; }
.statuschip{ display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:700; color:var(--primary); background:var(--primary-soft); border-radius:999px; padding:4px 11px; }
.statuschip .ph-fill{ font-size:13px; }
</style>
</head>
