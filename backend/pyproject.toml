module = [
    "fastapi",
    "fastapi.*",
    "sqlalchemy",
    "sqlalchemy.*",
    "joserfc",
    "joserfc.*",
    "structlog",
    "structlog.*",
    "cloudinary",
    "cloudinary.*",
    "anthropic",
