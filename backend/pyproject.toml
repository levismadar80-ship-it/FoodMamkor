[project]
name = "foodmamkor-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    # Held at 2.0: SQLAlchemy 2.1 resolves postgresql:// to psycopg v3, and this
    # backend ships psycopg2 only (Dependabot #3956 broke conftest import).
    "sqlalchemy==2.0.55",
    "psycopg2-binary==2.9.13",
    "alembic==1.20.1",
    "joserfc==1.7.7",
    "bcrypt==5.0.0",
    "bleach==6.4.0",
    "python-multipart==0.0.33",
    "pydantic[email]==2.14.2",
    "pydantic-settings==2.16.2",
    "cloudinary==1.46.3",
    "google-auth==2.62.0",
    "PyJWT[crypto]==2.15.1",
    "requests==2.34.2",
    "httpx==0.28.1",
    "anthropic==0.107.1",
    "slowapi==0.1.10",
    "pywebpush==2.5.0",
    "resend==2.50.1",
    "structlog==24.4.0",
    "asgi-correlation-id==5.0.1",
    "sentry-sdk[fastapi]==2.73.0",
    "apscheduler~=3.11",
]

[dependency-groups]
dev = [
    "mutmut>=3.8.1",
    "mypy==2.4.1",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-rerunfailures>=16.7",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.20",
    "schemathesis>=4.0",
]

[tool.uv]
# MEH-1586: starlette floor as a CONSTRAINT, deliberately not a direct
# dependency — it arrives transitively via FastAPI and must stay that way, so
# declaring it under [project] dependencies would be the wrong fix.
#
# MEH-1570 (PR #2191) raised starlette to 1.3.1 for CVE-2026-54283 by editing
# only `uv.lock`. A lock is an ARTIFACT of a resolution, not a rule about it:
# it protects today, but the next re-resolution that runs without a floor is
# free to pick a version below 1.3.1 again and nothing would object. This is
# the rule the lock was standing in for.
#
# Verified enforced rather than accepted-and-ignored: with the floor set to an
# unsatisfiable `starlette>=99.0.0`, `uv lock` exits 1 with
# "your project's requirements are unsatisfiable". A key uv merely tolerated
# would have resolved cleanly and left this comment claiming a guarantee that
# was not there.
constraint-dependencies = ["starlette>=1.3.1"]
# This is a web application, not an installable package.
package = false

# ─────────────────────────────────────────────────────────────
# MEH-558 — mutmut mutation testing pilot (SHIP-narrow)
# Scope: auth.py + producer_me.py only. NOT full repo, NOT in CI.
# Run: cd backend && uv run mutmut run
# Results: docs/research/mutation-testing-pilot.md
# Threshold for future CI gate: see pilot doc.
# ─────────────────────────────────────────────────────────────
[tool.mutmut]
# Linear spec MEH-558 listed auth.py + producer_me.py. Scoped down to auth.py
# only per spec STOP-(b) "if runtime >30 min, scope down to auth.py only and
# document". producer_me.py is 920 lines and its happy-path coverage lives in
# tests/test_api.py (~81s) — full mutmut would exceed budget by ~5×.
# producer_me.py pilot deferred to a follow-up ticket.
paths_to_mutate = [
    "app/auth.py",
]
# tests_dir is a list of pytest test selectors (paths) appended after `-x -q`.
# mutmut runs from `backend/mutants/` cwd. The repo-root `tests/` lives
# two levels up; pytest accepts the relative path because `--rootdir=.`
# (set by mutmut) doesn't constrain test selection. The auth-targeted
# subset (~64 tests, ~32s baseline) is much faster than full test_api.py.
tests_dir = [
    "../../tests/test_auth.py",
    "../../tests/test_password_policy.py",
    "../../tests/test_forgot_password.py",
    "../../tests/test_verify_email.py",
    "../../tests/test_oauth_unconfigured.py",
    "../../tests/test_auth_email_notify.py",
]
# Mutmut v3 mutates operators/conditionals/numbers/strings by default.

# ─────────────────────────────────────────────────────────────
# MEH-444 / MEH-441 Wave 3/3 — AI Guardrails (PL rules from Pylint)
# Source: Albro (Jan 2026, backend extension); Ruff PL docs (Astral 2025).
# Severity model: Ruff has no warn level. PL rules selected → CI fails on
# error → per-file-ignores carry existing-noise files until the
# referenced refactor ticket lands and the ignore is removed.
# ─────────────────────────────────────────────────────────────
[tool.ruff.lint]
extend-select = [
  "PLR0913",  # too-many-arguments
  "PLR0915",  # too-many-statements
  "PLR0912",  # too-many-branches
  "PLR0911",  # too-many-return-statements
  "C901",     # McCabe complexity
]

[tool.ruff.lint.pylint]
max-args = 5
max-statements = 50
max-branches = 12
max-returns = 6

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Existing god-files — large refactor tickets pending. Remove ignore after merge.
"app/routers/producers.py" = ["PLR0913", "PLR0915", "PLR0912", "C901"]  # MEH-438
"app/routers/auth.py" = ["PLR0913", "PLR0915", "PLR0912", "C901"]  # MEH-440

# Auto-generated migrations are long by design.
"alembic/versions/**" = ["PLR0915", "PLR0912"]

# ─────────────────────────────────────────────────────────────
# MEH-562 — mypy strict on auth.py + schemas/ (warn-only baseline)
# All three overrides are intentional: the libraries listed below
# don't ship inline types yet. ignore_missing_imports keeps CI
# non-blocking until stubs land or libraries adopt py.typed.
# ─────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
# STOP-condition (a) triggered: auth.py + schemas/ = 57 errors > 50 threshold.
# Scoped to auth.py only per MEH-562 spec §STOP-a. schemas/ deferred to follow-up ticket.
