[project]
name = "foodmamkor-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.120.1",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy==2.0.35",
    "psycopg2-binary==2.9.12",
    "alembic==1.13.2",
    "joserfc==1.6.4",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "bleach==6.3.0",
    "python-multipart==0.0.26",
    "pydantic[email]==2.9.2",
    "pydantic-settings==2.5.2",
    "cloudinary==1.40.0",
    "google-auth==2.34.0",
    "PyJWT[crypto]==2.12.0",
    "requests==2.33.1",
    "httpx==0.27.2",
    "openpyxl==3.1.5",
    "anthropic==0.102.0",
    "slowapi==0.1.9",
    "pywebpush==2.0.0",
    "resend==2.29.0",
    "structlog==24.4.0",
    "asgi-correlation-id==4.3.4",
    "sentry-sdk[fastapi]==2.18.0",
]

[dependency-groups]
dev = [
    "pip-audit>=2.10.0",
    "pytest>=8.0",
    "pytest-cov>=7.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.15.0",
]

[tool.uv]
# This is a web application, not an installable package.
package = false

# ─────────────────────────────────────────────────────────────
# MEH-444 / MEH-441 Wave 3/3 — AI Guardrails (PL rules from Pylint)
# Source: Albro (Jan 2026, backend extension); Ruff PL docs (Astral 2025).
# Severity model: Ruff has no warn level. PL rules selected → CI fails on
# error → per-file-ignores carry existing-noise files until the
# referenced refactor ticket lands and the ignore is removed.
# ─────────────────────────────────────────────────────────────
[tool.ruff.lint]
extend-select = [
  "PLR0913",  # too-many-arguments
  "PLR0915",  # too-many-statements
  "PLR0912",  # too-many-branches
  "PLR0911",  # too-many-return-statements
  "C901",     # McCabe complexity
]

[tool.ruff.lint.pylint]
max-args = 5
max-statements = 50
max-branches = 12
max-returns = 6

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Existing god-files — large refactor tickets pending. Remove ignore after merge.
"app/routers/producers.py" = ["PLR0913", "PLR0915", "PLR0912", "C901"]  # MEH-438
"app/routers/auth.py" = ["PLR0913", "PLR0915", "PLR0912", "C901"]  # MEH-440

# Auto-generated migrations are long by design.
"alembic/versions/**" = ["PLR0915", "PLR0912"]

# ─────────────────────────────────────────────────────────────
# MEH-562 — mypy strict on auth.py + schemas/ (warn-only baseline)
# All three overrides are intentional: the libraries listed below
# don't ship inline types yet. ignore_missing_imports keeps CI
# non-blocking until stubs land or libraries adopt py.typed.
# ─────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
# STOP-condition (a) triggered: auth.py + schemas/ = 57 errors > 50 threshold.
# Scoped to auth.py only per MEH-562 spec §STOP-a. schemas/ deferred to follow-up ticket.
files = ["app/auth.py"]
explicit_package_bases = true
# Stubs not yet available for these FastAPI-stack libs:
[[tool.mypy.overrides]]
module = [
    "fastapi",
    "fastapi.*",
    "sqlalchemy",
    "sqlalchemy.*",
    "joserfc",
    "joserfc.*",
    "structlog",
    "structlog.*",
    "cloudinary",
    "cloudinary.*",
    "anthropic",
    "anthropic.*",
    "slowapi",
    "slowapi.*",
    "resend",
    "resend.*",
    "asgi_correlation_id",
    "asgi_correlation_id.*",
]
ignore_missing_imports = true
