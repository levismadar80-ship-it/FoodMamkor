[project]
name = "foodmamkor-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.120.1",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy==2.0.35",
    "psycopg2-binary==2.9.9",
    "alembic==1.13.2",
    "joserfc==1.6.4",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "bleach==6.3.0",
    "python-multipart==0.0.18",
    "pydantic[email]==2.9.2",
    "pydantic-settings==2.5.2",
    "cloudinary==1.40.0",
    "google-auth==2.34.0",
    "twilio==9.3.0",
    "PyJWT[crypto]==2.12.0",
    "requests==2.32.3",
    "httpx==0.27.2",
    "openpyxl==3.1.5",
    "anthropic==0.39.0",
    "slowapi==0.1.9",
    "pywebpush==2.0.0",
    "resend==2.29.0",
    "structlog==24.4.0",
    "asgi-correlation-id==4.3.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.0",
]

[tool.uv]
# This is a web application, not an installable package.
package = false
