[project]
name = "foodmamkor-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.163.0",
    "uvicorn[standard]==0.54.0",
    # Held at 2.0: SQLAlchemy 2.1 resolves postgresql:// to psycopg v3, and this
    # backend ships psycopg2 only (Dependabot #3956 broke conftest import).
    "sqlalchemy==2.0.55",
    "psycopg2-binary==2.9.13",
    "alembic==1.20.1",
    "joserfc==1.8.0",
    "bcrypt==5.0.0",
    "bleach==6.4.0",
    "python-multipart==0.0.33",
    "pydantic[email]==2.14.3",
    "pydantic-settings==2.16.3",
    "cloudinary==1.47.0",
    "google-auth==2.62.2",
    "PyJWT[crypto]==2.15.1",
    "requests==2.34.2",
    "httpx==0.28.1",
    "anthropic==0.107.1",
    "slowapi==0.1.10",
    "pywebpush==2.5.0",
    "resend==2.53.2",
    "structlog==24.4.0",
    "asgi-correlation-id==5.0.1",
    "sentry-sdk[fastapi]==2.75.0",
    "apscheduler~=3.11",
    "webauthn==3.0.1",
]

[dependency-groups]
dev = [
    "mutmut>=3.8.1",
    "mypy==2.4.1",
    "pip-audit>=2.10.1",
    "hypothesis>=6.155.2",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-rerunfailures>=16.7",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.20",
    "schemathesis>=4.33.4",
]

[tool.uv]
# MEH-1586: starlette floor as a CONSTRAINT, deliberately not a direct
# dependency — it arrives transitively via FastAPI and must stay that way, so
# declaring it under [project] dependencies would be the wrong fix.
#
# MEH-1570 (PR #2191) raised starlette to 1.3.1 for CVE-2026-54283 by editing
# only `uv.lock`. A lock is an ARTIFACT of a resolution, not a rule about it:
# it protects today, but the next re-resolution that runs without a floor is
# free to pick a version below 1.3.1 again and nothing would object. This is
# the rule the lock was standing in for.
#
# Verified enforced rather than accepted-and-ignored: with the floor set to an
# unsatisfiable `starlette>=99.0.0`, `uv lock` exits 1 with
# "your project's requirements are unsatisfiable". A key uv merely tolerated
# would have resolved cleanly and left this comment claiming a guarantee that
# was not there.
constraint-dependencies = ["starlette>=1.3.1"]
# This is a web application, not an installable package.
package = false

# ─────────────────────────────────────────────────────────────
# Mutation testing (mutmut). MEH-558 pilot → MEH-3295 standing set.
# Run: bash scripts/mutation/run.sh (from the repo root; own test database).
# NOT in CI (≈1 h). Run by: a PR that touches source_paths (mutation-guard.sh)
# and the weekly repo-health scan. Docs: docs/research/mutation-testing.md.
# ─────────────────────────────────────────────────────────────
[tool.mutmut]
# MEH-3295 — the money-and-permissions set. One list, read by three callers:
# `bash scripts/mutation/run.sh` (local / a PR thread), the weekly repo-health
# scan (MEH-3143, area 9) and docs/research/mutation-testing.md.
# routers/auth.py joins after its split (MEH-3293) — mutating a 1,678-line
# router through the whole auth suite is the slow half, and the split moves it.
# MEH-558 history: the pilot mutated app/auth.py alone (90.6%).
# The whole app/ tree is copied into mutants/ so app.services resolves to the
# mutated copy: app/ has no __init__.py, and with only the listed files copied
# the real backend/app/services package won and those mutants never ran
# (first run 15/11: billing_* and capabilities all "no tests").
source_paths = ["app"]
only_mutate = [
    "app/auth.py",
    "app/limits.py",
    "app/pricing.py",
    "app/services/capabilities.py",
    "app/services/billing_summary.py",
    "app/services/billing_ledger.py",
]
# Test files appended to pytest's command line. mutmut runs from
# `backend/mutants/`, so the repo-root tests/ is two levels up. mutmut 3 maps
# each function to the tests that execute it and runs only those per mutant.
pytest_add_cli_args_test_selection = [
    "../../tests/test_auth.py",
    "../../tests/test_password_policy.py",
    "../../tests/test_forgot_password.py",
    "../../tests/test_verify_email.py",
    "../../tests/test_oauth_unconfigured.py",
    "../../tests/test_auth_email_notify.py",
    "../../tests/test_verified_email_enforcement.py",
    "../../tests/test_expansion_auth_jwt.py",
    "../../tests/test_expansion_admin_authz.py",
    "../../tests/test_admin_role_orphan_source.py",
    "../../tests/test_meh2900_admin_role_endpoint.py",
    "../../tests/test_optional_auth_contract.py",
    "../../tests/test_meh3022_resource_caps.py",
    "../../tests/test_meh3179_billing_ledger.py",
    "../../tests/test_meh3179_pricing_mirror.py",
    "../../tests/test_meh3180_billing_state.py",
    "../../tests/test_meh3181_billing_summary.py",
    "../../tests/test_meh3208_ledger_outlives_business.py",
    "../../tests/test_meh3295_properties.py",
    "../../tests/test_meh3295_auth_tokens.py",
]
# Mutmut v3 mutates operators/conditionals/numbers/strings by default.

# ─────────────────────────────────────────────────────────────
# MEH-444 / MEH-441 Wave 3/3 — AI Guardrails (PL rules from Pylint)
# Source: Albro (Jan 2026, backend extension); Ruff PL docs (Astral 2025).
# Severity model: Ruff has no warn level. PL rules selected → CI fails on
# error → per-file-ignores carry existing-noise files until the
# referenced refactor ticket lands and the ignore is removed.
# ─────────────────────────────────────────────────────────────
[tool.ruff.lint]
extend-select = [
  "PLR0913",  # too-many-arguments
  "PLR0915",  # too-many-statements
  "PLR0912",  # too-many-branches
  "PLR0911",  # too-many-return-statements
  "C901",     # McCabe complexity
]

[tool.ruff.lint.pylint]
max-args = 5
max-statements = 50
max-branches = 12
max-returns = 6

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Existing god-files — large refactor tickets pending. Remove ignore after merge.
"app/routers/producers.py" = ["PLR0913", "PLR0915", "PLR0912", "C901"]  # MEH-438
"app/routers/auth.py" = ["PLR0913", "PLR0915", "PLR0912", "C901"]  # MEH-440
"app/routers/auth_register_producer.py" = ["PLR0913", "PLR0915", "PLR0912", "C901"]  # MEH-3293: moved out of auth.py with its code

# Auto-generated migrations are long by design.
"alembic/versions/**" = ["PLR0915", "PLR0912"]

# ─────────────────────────────────────────────────────────────
# MEH-562 — mypy strict on auth.py + schemas/ (warn-only baseline)
# All three overrides are intentional: the libraries listed below
# don't ship inline types yet. ignore_missing_imports keeps CI
# non-blocking until stubs land or libraries adopt py.typed.
# ─────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
