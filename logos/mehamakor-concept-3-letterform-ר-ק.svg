<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-label="מהמקור" preserveAspectRatio="xMidYMid meet">
  <title>Mehamakor — Concept 3: Custom Letterform on ר and ק</title>
  <desc>Hebrew wordmark מהמקור with custom descender treatment on ק (qof) and modified top-corner on ר (resh). The ק descender is extended below the baseline by ~35% with a slight curl inward, recalling Oded Ezer's Alchemist treatment. The ר top-right corner is given a small flat bracket terminal rather than the default Frank Ruhl rounded transition. Both modifications stay within Hebrew letterform rules — only ק keeps its descender (final ר tail is shortened, not added). Uncertainty: native Hebrew reader should confirm the modified ק still reads as ק and not as a final letter form.</desc>
  <style>
    :root { --primary: #2E6853; --background: #F5F0E8; }
    @media (prefers-color-scheme: dark) {
      :root { --primary: #F5F0E8; --background: #1A1A1A; }
    }
    .bg { fill: var(--background); }
    .fg { fill: var(--primary); }
    .wordmark { font-family: 'Frank Ruhl Libre', 'Noto Serif Hebrew', 'David Libre', serif; font-weight: 900; }
    .eyebrow { font-family: 'DM Sans', 'Inter', system-ui, sans-serif; font-weight: 500; letter-spacing: 0.32em; }
    .erase { fill: var(--background); }
  </style>
  <rect class="bg" width="1000" height="400"/>
  <g id="wordmark">
    <text class="wordmark fg" x="850" y="240" font-size="220" text-anchor="middle">מ</text>
    <text class="wordmark fg" x="720" y="240" font-size="220" text-anchor="middle">ה</text>
    <text class="wordmark fg" x="590" y="240" font-size="220" text-anchor="middle">מ</text>
    <text class="wordmark fg" x="460" y="240" font-size="220" text-anchor="middle">ק</text>
    <text class="wordmark fg" x="340" y="240" font-size="220" text-anchor="middle">ו</text>
    <text class="wordmark fg" x="230" y="240" font-size="220" text-anchor="middle">ר</text>
    <!-- Concept-3 modification A: ק descender extension with curl -->
    <path class="fg" d="M 480 240 q 0 60 -4 90 q -6 22 -24 22 q -14 0 -22 -12 l 14 -10 q 6 8 12 8 q 6 0 8 -12 q 2 -28 4 -86 z"/>
    <!-- Concept-3 modification B: bracket terminal on ר top-right corner -->
    <rect class="fg" x="262" y="130" width="34" height="14"/>
    <rect class="fg" x="282" y="130" width="14" height="32"/>
  </g>
  <g id="eyebrow">
    <text class="eyebrow fg" x="540" y="340" font-size="34" text-anchor="middle">MEHAMAKOR</text>
  </g>
</svg>
