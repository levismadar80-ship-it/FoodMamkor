# MEH-330 — Dependabot config.
# Three ecosystems, weekly cadence, all PRs target staging (never main —
# CLAUDE.md branch strategy). Limit per ecosystem keeps the queue manageable.
# Companion CI gate: .github/workflows/dependency-audit.yml (warn-only sprint 1,
# flipped to required after umbrella ticket MEH-336 clears the baseline).
#
# MEH-1044 — burst throttling after the 2026-07-06 spike (8 dependabot PRs →
# 8 Vercel preview deploys → Edge Requests overage): limits 5→3 per ecosystem
# and npm minor/patch updates grouped into a single PR. Major bumps stay
# individual PRs (they need human review anyway).

version: 2
updates:
  # Backend — uv-managed, audited via pip-audit in CI
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Jerusalem"
    target-branch: "staging"
    open-pull-requests-limit: 3
    # MEH-1518: intentionally NO pip group. Every pip bump drifts uv.lock
    # (dependabot updates pyproject.toml but not the lock — MEH-1332/1527/#1531);
    # grouping would concentrate the drift into one PR, not fix it. Blocked on
    # MEH-1527 Chunk 2b (a lock-regen step).
    ignore:
      # schemathesis 4.24 slows the fuzz suite past the pytest job timeout
      # (MEH-1529). Dev-only test tool, no CVE — hold minor/patch bumps.
      - dependency-name: "schemathesis"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    labels:
      - "dependencies"
      - "meh-330"
    commit-message:
      prefix: "chore(deps)"

  # Frontend — Next.js, audited via npm audit in CI
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Jerusalem"
    target-branch: "staging"
    open-pull-requests-limit: 3
    # MEH-1044: one grouped PR for all npm minor+patch bumps instead of one
    # PR (→ one Vercel preview deploy) per package.
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      # eslint 9->10 major is a tracked MANUAL migration (MEH-893). A fork does
      # not inherit the `@dependabot ignore this major version` comment command,
      # which is why #1703 reappeared — declare it here so it survives the fork.
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"
      # react 18->19 major deferred post-launch (MEH-1522).
      - dependency-name: "react"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@types/react"
        update-types:
          - "version-update:semver-major"
    labels:
      - "dependencies"
      - "meh-330"
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions — keep workflow action versions current
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Jerusalem"
    target-branch: "staging"
    open-pull-requests-limit: 3
    # MEH-1518: mirror npm-minor-patch — one grouped PR for all minor+patch
    # action bumps. Majors stay individual (they need human review — see the
    # setup-node/checkout/github-script majors #1700/#1701/#1964).
    groups:
      github-actions-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "ci"
      - "meh-330"
    commit-message:
      prefix: "chore(ci-deps)"
