name: Staging smoke

# MEH-671 — post-deploy producer-signup smoke (V1).
#
# WHAT: drives the real producer-signup pipeline against the staging backend
#   and fails loud if any integration is broken — the bug class that
#   transport-mocked unit tests cannot see (template-signature mismatch,
#   missing background task, broken Meta/Anthropic call). Would have caught
#   all four bugs found manually during the MEH-509 rollout.
#
# HOW: .github/scripts/staging_smoke.py runs 5 fail-fast steps —
#   1) POST /auth/register/producer (anonymous, unique smoke+{run_id}@…)  -> 200
#   2) poll GET /admin/producers for the new row (<=30s)
#   3) Railway log signal: "[WHATSAPP] Producer welcome template sent" (<=30s)
#   4) Railway log signal: "[RISK] scored producer="                    (<=60s)
#   5) GET /admin/producers -> risk_score is int 0-100 (the admin badge)
#   Cleanup ALWAYS runs (success or fail) and is FK-safe (see below).
#
# V1 SCOPE (intentional, see MEH-671 thread):
#   - TRIGGER: workflow_dispatch only. Auto-trigger on push:staging is V2,
#     after 5 clean manual runs.
#   - ALERTING: GitHub Actions failure email only (no WhatsApp send in V1).
#   - SIGNALS: WhatsApp + Anthropic verified via `railway logs` (Meta exposes
#     delivery status by webhook only, not a query endpoint).
#
# MAINTENANCE NOTES:
#   - Templates tested: producer welcome (sent by the signup background task;
#     log line backend/app/services/auth_notifications.py:86).
#   - Risk score: backend/app/services/producer_risk.py:289 success log;
#     requires staging ANTHROPIC_API_KEY (else risk_score stays NULL and step
#     5 correctly fails).
#   - Cleanup SQL: users.producer_id -> producers.id is the only non-CASCADE
#     FK (models.py:226), so we delete smoke USERS first (CTE), RETURNING their
#     producer_id, then delete those producers — CASCADE removes
#     producer_categories / delivery_areas. producers has no `email` column;
#     the smoke row is reached via the user. Idempotent: 0 rows -> no-op.
#   - Rate limit: register is 3/hour per IP — keep manual runs under that.

# NOTE: the trigger key MUST be quoted ("on"). Bare unquoted `on:` is coerced
# to the boolean True by YAML 1.1 parsers, dropping the trigger entirely, so
# GitHub reports "No event triggers defined in `on`" (MEH-671 first-paste bug).
"on":
  workflow_dispatch:
    inputs:
      pre_wait_seconds:
        description: "Seconds to wait before smoke (use 90 right after a deploy; 0 if already live)"
        required: false
        default: "0"

permissions:
  contents: read

concurrency:
  group: staging-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Post-deploy staging smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install httpx + Railway CLI
        run: |
          pip install "httpx==0.27.2"
          npm install -g @railway/cli
          railway --version

      - name: Optional pre-wait for redeploy
        run: sleep "${{ github.event.inputs.pre_wait_seconds || '0' }}"

      - name: Run smoke
        env:
          STAGING_URL: https://foodmamkor-staging.up.railway.app
          SMOKE_ADMIN_EMAIL: ${{ secrets.SMOKE_ADMIN_EMAIL }}
          SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN }}
          RAILWAY_ENVIRONMENT: staging
          RAILWAY_SERVICE_NAME: ${{ vars.RAILWAY_SERVICE_NAME || 'FoodMamkor' }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python .github/scripts/staging_smoke.py

      - name: Cleanup smoke rows (always)
        if: always()
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN }}
          RAILWAY_ENVIRONMENT: staging
        run: |
          set -e
          cat > /tmp/smoke_cleanup.sql <<'SQL'
          WITH deleted_users AS (
            DELETE FROM users
            WHERE email LIKE 'smoke+%@mehamakor.online'
            RETURNING producer_id
          )
          DELETE FROM producers
          WHERE id IN (SELECT producer_id FROM deleted_users WHERE producer_id IS NOT NULL);
          SQL
          railway run --service Postgres -- bash -c 'psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f /tmp/smoke_cleanup.sql'
