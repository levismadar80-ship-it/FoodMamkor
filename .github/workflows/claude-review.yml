name: Claude PR Review

# MEH-487 — adversarial PR review via the official Anthropic GitHub Action.
# Calibration mode: continue-on-error: true for the first ~5 PRs so findings
# are informational. After tally (HANDOFF.md "Claude Review calibration"
# subsection), a follow-up ticket flips to blocking, tunes the prompt, or
# reverts. Full prompt + calibration plan: docs/CLAUDE-REVIEW.md.
#
# Permissions: pull-requests:write + issues:write are required by
# anthropics/claude-code-action@v1 to post the review comment. No other
# write scopes — the action does not push code in this configuration.
#
# Concurrency: canonical MEH-485 key (workflow + head_ref || ref) so
# force-pushes to the same PR cancel the in-flight review.

on:
  pull_request:
    # MEH-925: `ready_for_review` is required so a PR opened as a draft still
    # gets reviewed the moment it flips to ready — without it the draft→ready
    # transition emits no event the `draft == false` job guard would let run.
    types: [opened, synchronize, ready_for_review]
    # F3 cost sweep (May 2026): skip Claude review on docs-only PRs. File
    # classes mirror e2e.yml:56-59 (MEH-424/499); native paths-ignore syntax
    # (no '!' prefix — that's a dorny-filter operator, not valid here). Safe
    # as a trigger filter because this job is NOT a required check
    # (continue-on-error calibration) — no skipped-required-check gap.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.changeset/**'
      - 'CHANGELOG.md'

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write    # MEH-487: required by claude-code-action@v1 for OIDC

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Adversarial review (calibration)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # MEH-925: never run on a draft PR — only on ready-for-review. Every push
    # to an open draft otherwise re-runs the Anthropic action (~11% of monthly
    # Actions minutes + API$). Safe because `review` is NOT a required check
    # (continue-on-error below) → skipping it on drafts can't block a merge.
    if: github.event.pull_request.draft == false
    # Calibration: never blocks merge while we measure signal:noise.
    # Flip to false via a follow-up PR after the calibration tally
    # crosses the >70% useful threshold (see docs/CLAUDE-REVIEW.md).
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the action can diff against the base branch.
          fetch-depth: 0

      # MEH-1844: pinned to a full commit SHA. The floating @v1 tag let an
      # upstream change land unannounced and un-reviewed in the one job whose
      # purpose IS review — the leading hypothesis for why this job has been
      # exiting at num_turns:1 repo-wide. Re-pin deliberately, never silently.
      - uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10 # v1.0.210
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # MEH-1844: `show_full_output: true` lived here as a temporary
          # diagnostic. REMOVED 2026-08-05 — it did its job, and leaving it on
          # past that point is a live exposure on a public repo.
          #
          # WHAT IT BOUGHT. The reviewer had been exiting at num_turns:1,
          # total_cost_usd:0, is_error:true with no readable reason, and GitHub
          # masks an unset secret and an expired one identically. Two candidate
          # causes were on record and neither was confirmable. With the flag on,
          # the real one printed in full — job 92308149134, 2026-08-05:
          #
          #     "error": "rate_limit", "api_error_status": 429,
          #     "result": "You've hit your org's monthly spend limit"
          #
          # A THIRD cause, invisible for as long as the output was suppressed,
          # and one that no amount of config archaeology would have found.
          #
          # WHY IT COMES OFF *BEFORE* THE FIX, NOT AFTER. Its own note said
          # "turn it back off once the reviewer is proven running". That
          # ordering is backwards here. While the 429 holds, the reviewer never
          # reaches a tool call, so nothing is printed — the outage is the only
          # thing currently containing the exposure. The instant the spend limit
          # is raised, the reviewer resumes AND begins writing tool results into
          # world-readable Actions logs, in the same moment. There is no window
          # in which "proven running" can be observed safely. So: off first,
          # raise the limit second.
          #
          # Upstream's own description of the flag: "outputs ALL Claude messages
          # including tool execution results which may contain secrets, API
          # keys, or other sensitive information. These logs are publicly
          # visible." This repo is public — verified from the API, not assumed:
          # GET /repos/... returns "visibility": "public", "private": false.
          #
          # IF A FUTURE OUTAGE NEEDS IT AGAIN: turn it on, capture the one run,
          # turn it off in the same session. Never leave it on across a fix.
          # MEH-2277 — two changes, both about the reviewer being ABLE to do
          # the job this file already asks of it. The model pin is deliberately
          # NOT touched here; see the note at the end.
          #
          # Read/Glob/Grep: the prompt below orders the reviewer to read
          # CLAUDE.md and docs/CLAUDE-REVIEW.md, and it had no tool permitted to
          # open either. It was reviewing against a contract it could not read.
          # Glob and Grep come too: without them it can only open a path it
          # already knows, not locate the files a diff touched.
          #
          # allowed_bots: without it the action REFUSES TO START on any run
          # whose actor is a bot, and posts nothing at all. Measured 06/09 on
          # PR #3469:
          #
          #     Workflow initiated by non-human actor: claude (type: Bot).
          #     Add bot to allowed_bots list or use '*' to allow all bots.
          #
          # The discriminator is the WORKFLOW RUN'S ACTOR, not the PR's author.
          # Every PR here renders as authored by claude[bot], so that is not it.
          # Over the last 25 runs of this workflow: 24 with actor
          # levismadar80-ship-it (User), all success; 1 with actor claude[bot],
          # the only failure. That one is the first PR opened by calling the
          # REST API with GH_WORKFLOW_TOKEN — the app's identity — rather than
          # through the GitHub MCP under the user's.
          #
          # Why "claude" and not "claude[bot]": both work, and neither is a
          # guess. src/github/validation/actor.ts:11-28, read at the pinned SHA
          # above (a874e9ec, v1.0.210) and byte-identical at HEAD, lowercases
          # and strips a trailing [bot] from BOTH the list entries and the
          # actor before comparing. So claude[bot] normalises to claude.
          #
          # This matters more now than it did in August: CC merges its own
          # green PRs with that token, so without this line the PRs least
          # supervised by a human are exactly the ones landing with no review
          # on the open event — and workflow rule 5a becomes unsatisfiable by
          # construction on precisely those.
          #
          # NOT CHANGED HERE: the model pin. PR #2607 bundled a bump to
          # claude-sonnet-5 with these two fixes, arguing there was "no clean
          # baseline to protect" because the reviewer was broken anyway. That
          # argument has expired — the reviewer works and is finding real
          # defects — so the model is a separate cost/quality call for Sapir,
          # not a rider on a fix for a different problem.
          claude_args: "--model claude-sonnet-4-6 --allowed-tools Read,Glob,Grep,mcp__github__add_issue_comment"
          allowed_bots: "claude"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing this pull request for the mehamakor.online repo.

            Read these files from the checked-out repo before commenting:
            - CLAUDE.md (project standards, locked decisions, RTL rules)
            - docs/CLAUDE-REVIEW.md (the full review prompt + output contract)

            Follow docs/CLAUDE-REVIEW.md exactly: focus areas, output format,
            and the "always post a comment" rule (post even when every
            section is empty — empty sections must read "None.").

            To post your review, you MUST call:
              mcp__github__add_issue_comment(
                owner=<owner from REPO above>,
                repo=<repo from REPO above>,
                issue_number=<PR NUMBER above>,
                body=<your review in the format from docs/CLAUDE-REVIEW.md>
              )
            This is the only mechanism that makes the review appear on the
            PR. Skipping the tool call = silent no-op (MEH-506 root cause).
