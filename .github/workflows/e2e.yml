name: E2E Tests

# Trigger: fires when Vercel signals a preview deployment succeeded.
# The preview URL arrives in github.event.deployment_status.target_url
# — zero polling, zero comment-regex parsing.
#
# Why deployment_status (not pull_request):
#   The previous pull_request trigger polled for the Vercel bot PR comment
#   and extracted the URL with a regex (\[Preview\]\(https://...\)). The
#   regex never matched the actual Vercel comment format, so all 20 poll
#   attempts (5 min) exhausted silently and every job exited 1 — regardless
#   of PR content. Switching to deployment_status means the job only starts
#   AFTER Vercel signals readiness; the URL is a first-class event field.
#   Confirmed failure pattern on PRs #234 and #236 (MEH-212).
#
# Fallback path: if Vercel stops firing deployment_status events for
#   staging-targeting PRs, switch to repository_dispatch with
#   event_type: vercel.deployment.success (see docs/DEPLOYMENT.md → "E2E CI").
#
# Required secrets: none beyond the auto-provided GITHUB_TOKEN.

on:
  deployment_status:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: e2e-${{ github.event.deployment.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E (Vercel preview)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Only run on successful Vercel Preview deployments.
    # Vercel sets environment to "Preview" (or "Preview – <slug>") for branch
    # previews, and "Production" for main. Skip Production and non-success states.
    if: >-
      github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment_status.environment, 'Preview')

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright (Chromium only)
        run: npx playwright install --with-deps chromium
        working-directory: frontend
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Run E2E tests
        run: npx playwright test
        working-directory: frontend
        env:
          TEST_URL: ${{ github.event.deployment_status.target_url }}
          CI: "true"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
