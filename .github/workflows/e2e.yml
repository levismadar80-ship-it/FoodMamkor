name: E2E Tests

# Trigger: fires when Vercel signals a preview deployment succeeded.
# The preview URL arrives in github.event.deployment_status.target_url
# — zero polling, zero comment-regex parsing.
#
# Why deployment_status (not pull_request):
#   The previous pull_request trigger polled for the Vercel bot PR comment
#   and extracted the URL with a regex (\[Preview\]\(https://...\)). The
#   regex never matched the actual Vercel comment format, so all 20 poll
#   attempts (5 min) exhausted silently and every job exited 1 — regardless
#   of PR content. Switching to deployment_status means the job only starts
#   AFTER Vercel signals readiness; the URL is a first-class event field.
#   Confirmed failure pattern on PRs #234 and #236 (MEH-212).
#
# Fallback path: if Vercel stops firing deployment_status events for
#   staging-targeting PRs, switch to repository_dispatch with
#   event_type: vercel.deployment.success (see docs/DEPLOYMENT.md → "E2E CI").
#
# Required secrets: none beyond the auto-provided GITHUB_TOKEN.

on:
  deployment_status:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: e2e-${{ github.event.deployment.ref }}
  cancel-in-progress: true

jobs:
  filter:
    name: Paths filter
    runs-on: ubuntu-latest
    if: github.event.deployment_status.state == 'success'
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'public/**'
              - 'package.json'
              - 'package-lock.json'
              # MEH-499: skip Playwright on docs-only diffs. Negation
              # patterns mirror the docs-only file classes used in the
              # PR-Checks workflow.
              - '!**/*.md'
              - '!docs/**'
              - '!.changeset/**'
              - '!CHANGELOG.md'

  e2e:
    name: Playwright E2E (Vercel preview)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: filter

    # Only run on successful deployments (preview or production).
    # The environment filter `startsWith(environment, 'Preview')` was removed
    # because Vercel's environment naming is inconsistent across SDK versions
    # and caused the condition to evaluate false → 2-second failure on every run.
    # Tests are read-only so running against production is safe; the concurrency
    # group (e2e-${{ deployment.ref }}) ensures no two runs race on the same ref.
    # paths-filter (MEH-424): skip when no frontend files changed.
    # Cost sweep (May 2026): skip Dependabot PRs. deployment.ref carries the
    # head branch (dependabot/*, all ecosystems); ~285 min/month saved (19
    # runs × ~15 min). creator.login is unusable here — it's vercel[bot].
    if: |
      github.event.deployment_status.state == 'success' &&
      needs.filter.outputs.frontend == 'true' &&
      !startsWith(github.event.deployment.ref, 'dependabot/')

    steps:
      - uses: actions/checkout@v6
        with:
          # deployment.sha is the commit Vercel deployed. Fall back to
          # github.sha (same value for deployment_status events) in case
          # Vercel omits it on fast deploys — avoids an instant failure
          # from checkout receiving an empty ref string.
          ref: ${{ github.event.deployment.sha || github.sha }}

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright (Chromium only)
        run: npx playwright install --with-deps chromium
        working-directory: frontend
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Run E2E tests
        # MEH-484 — --fail-on-flaky-tests turns "passed on retry" into a hard
        # failure so flake stops hiding behind the retry. retries: 1 in CI is
        # preserved (config); the flag detects flake without disabling retries.
        run: npx playwright test --fail-on-flaky-tests
        working-directory: frontend
        env:
          TEST_URL: ${{ github.event.deployment_status.target_url }}
          CI: "true"
          # MEH-264 — Vercel Deployment Protection bypass. Without this
          # secret, every Vercel preview URL returns 403 "host_not_allowed"
          # and the whole E2E suite fails instantly. Consumed by
          # frontend/playwright.config.ts via extraHTTPHeaders.
          VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          # MEH-484 — also capture per-test trace.zip files so the trace viewer
          # (playwright.dev/docs/trace-viewer) can replay flake-on-retry runs
          # without re-running locally.
          path: |
            frontend/playwright-report/
            frontend/test-results/**/trace.zip
          retention-days: 7
