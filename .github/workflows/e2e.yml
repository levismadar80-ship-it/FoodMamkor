name: E2E Tests

# MEH-1044 — E2E now runs against a LOCAL `next start` server inside the CI
# runner instead of the live Vercel preview URL. Rationale: every preview-URL
# run re-downloaded all _next/static chunks per test (fresh browser context =
# zero cache, ~50+ requests/page × ~80 test executions) and burned the Vercel
# Hobby Edge Requests quota (319% overage, team paused 2026-07-07). Local
# target = zero Vercel edge requests; same specs, same flake gate.
#
# Trigger history: deployment_status (MEH-212) replaced pull_request comment-
# polling because the Vercel-bot comment regex never matched — the job needed
# the preview URL. Now that the suite no longer targets the preview, the
# trigger returns to pull_request (+ push to staging for post-merge coverage);
# the original reason for deployment_status is gone with it.
#
# Backend strategy unchanged (MEH-1044 constraint): tests exercise the same
# Railway staging backend the Vercel previews proxied to, via next.config.js
# rewrites (/api/* → NEXT_PUBLIC_API_URL; inlined at build, read again at
# server boot).
#
# Preserved cost/flake fixes: paths-filter skip (MEH-424/499/675), dependabot
# skip (May 2026 cost sweep — was ref-based on deployment.ref, now actor-based
# since the event changed), Playwright browser cache, chromium-only install,
# 15-min timeout, concurrency cancel, --fail-on-flaky-tests (MEH-484), report
# + trace upload. MEH-728's preview warm-up is replaced by a localhost
# readiness poll (same purpose: cold start must not trip the flake gate).
#
# Required secrets: DEMO_OWNER_PASSWORD / DEMO_CONSUMER_PASSWORD /
# DEMO_ADMIN_PASSWORD — MEH-999, they unlock the authenticated specs; without
# them global-setup skips provisioning and those specs skip with a reason.
# VERCEL_AUTOMATION_BYPASS_SECRET is still unused —
# playwright.config.ts still sends the (empty) bypass header, which localhost
# ignores; TEST_URL manual runs against previews keep working with the secret
# exported locally.

on:
  pull_request:
    branches: [staging]
    # MEH-2779: `labeled` is load-bearing — adding the `run-e2e` label is what
    # starts the suite on a PR (see the e2e job's `if:`). The other three are
    # the GitHub defaults, listed because naming `types` replaces them.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [staging]
  # MEH-1712 — manual run, for the MEH-1712 diagnostics artifact (the step
  # added in PR #2376). It changes nothing automatic: no PR and no push
  # triggers it, so it gates nothing and costs nothing until someone clicks
  # Run workflow. The problem it solves is that a workflow-file-only diff is
  # invisible to the paths filter below, so merging a capture step to staging
  # produced no run that would execute it — the data waited on an unrelated
  # future `frontend/**` push.
  workflow_dispatch:
  # MEH-2972 — one full run every night on staging, whatever was merged. A
  # staging push runs the suite only when frontend/** changed, so a backend-only
  # or docs-only day left "is staging green?" unanswered (rule 41, 11/11: five
  # hours of unknown). 01:30 UTC = 03:30/04:30 Israel, outside working hours.
  # Like workflow_dispatch it bypasses the paths filter (see the e2e job's if:).
  schedule:
    - cron: "30 1 * * *"

permissions:
  contents: read
  # MEH-1074 (W0.1): write is needed to upsert the pass/fail QA report
  # comment on the PR. Scope is comment-only — contents stays read.
  pull-requests: write

# MEH-2779: three buckets.
#   PR code push / reopen / `run-e2e` label → e2e-<branch>-code, cancels the
#     same PR's older run (as before).
#   any OTHER label on a PR → e2e-<branch>-other-label: its run only does the
#     paths filter (the e2e jobs skip on it), and it must never cancel a real
#     run — same reasoning as pr-checks.yml's MEH-1523 buckets.
#   push to staging → e2e-staging-push, NOT cancel-in-progress: GitHub keeps
#     one running + one pending per group and a newer pending replaces the
#     older, so a burst of merges collapses to "test the latest staging",
#     instead of every merge queueing 30 min behind the last one.
concurrency:
  group: e2e-${{ github.head_ref && format('{0}-{1}', github.head_ref, (github.event.action == 'labeled' && github.event.label.name != 'run-e2e') && 'other-label' || 'code') || (github.event_name == 'push' && 'staging-push') || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  filter:
      name: Paths filter
      runs-on: ubuntu-latest
      outputs:
        frontend: ${{ steps.filter.outputs.frontend }}
        backend: ${{ steps.filter.outputs.backend }}
      steps:
        - uses: actions/checkout@v7
          with:
            fetch-depth: 0  # MEH-675: paths-filter needs full history to diff against parent
        - uses: dorny/paths-filter@v3
          id: filter
          with:
            filters: |
              frontend:
                - 'frontend/**'
                - 'public/**'
                - 'package.json'
                - 'package-lock.json'
              # MEH-2973: a PR run now tests its OWN backend (below), so a
              # backend change is something the suite can catch. Push runs
              # still test Railway staging and ignore this output.
              backend:
                - 'backend/app/**'
                - 'backend/alembic/**'
                - 'backend/scripts/seed_*.py'
                - 'backend/seed_data.py'
                - 'backend/uv.lock'
                - 'scripts/e2e/**'

  e2e:
    # NOTE (MEH-1044): job name kept verbatim although the target is now
    # localhost — required-check identities match on the name: field. Rename
    # only in a follow-up that updates branch protection in the same change.
    #
    # MEH-2895 — two shards in parallel. The single job hit its 30-minute cap
    # on staging (~1,419 of ~1,668 tests ran). Each shard runs half the suite
    # with `--shard=N/2` and keeps every per-job check (coverage floor, report
    # upload, diagnostics). The PR comment moves to `e2e-report`, which merges
    # the two blob reports into ONE verdict. `e2e-gate` still reads
    # `needs.e2e.result`, which GitHub aggregates over the matrix: any red
    # shard is red.
    name: Playwright E2E (Vercel preview) ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: filter
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # MEH-2895: one queue PER SHARD, so the two halves of one run go in
    # parallel. The shared-backend protection stays: at most one run's shard N
    # at a time, so at most two suites hit Railway staging together.
    # MEH-2973: a PR run brings its own backend + database (steps below), so
    # it shares nothing and needs no queue — its group is unique per run. Only
    # push / schedule / dispatch runs still hit Railway staging and keep the
    # one-at-a-time queue per shard.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('e2e-pr-{0}-{1}', github.run_id, matrix.shard) || format('e2e-staging-backend-{0}', matrix.shard) }}
      cancel-in-progress: false
      queue: max

    # paths-filter (MEH-424): skip when no frontend files changed.
    # Cost sweep (May 2026): skip Dependabot PRs — they get lint/build only.
    # (Was `!startsWith(deployment.ref, 'dependabot/')`; with pull_request
    # events the actor is dependabot[bot] directly.)
    #
    # MEH-1712 — the workflow_dispatch escape is REQUIRED, not decorative. This
    # condition is evaluated for every event, so a manual run would otherwise be
    # decided by dorny/paths-filter's fallback for non-PR/push events (it diffs
    # against the default branch, which IS `staging` here) — i.e. a dispatch on
    # staging would inherit whatever the last commit happened to touch and skip
    # on a docs push. A manual run is an explicit request; honour it verbatim.
    # This does NOT widen the filter: no PR and no push reaches this branch of
    # the OR, so which automatic runs execute E2E is byte-for-byte unchanged.
    #
    # MEH-2779 — on a PR the suite runs only once the PR carries the `run-e2e`
    # label. It used to run on every push of every PR, and the job-level
    # `e2e-staging-backend` queue below lets one run at a time repo-wide
    # (the shared Railway staging backend), so runs waited up to 14 h
    # (measured 4–6/11/2026) and were mostly cancelled unseen. A labeled
    # event for any other label does not start it. Push to staging and
    # workflow_dispatch are unchanged.
    if: |
      (needs.filter.outputs.frontend == 'true' ||
       (github.event_name == 'pull_request' && needs.filter.outputs.backend == 'true') ||
       github.event_name == 'workflow_dispatch' ||
       github.event_name == 'schedule') &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       (contains(github.event.pull_request.labels.*.name, 'run-e2e') &&
        (github.event.action != 'labeled' || github.event.label.name == 'run-e2e')))

    # MEH-2973: PR runs test against a throwaway backend on localhost:8080,
    # seeded from the same scripts as staging; every other event keeps Railway
    # staging. One expression, used by every step that names the backend.
    env:
      E2E_API_URL: ${{ github.event_name == 'pull_request' && 'http://localhost:8080' || 'https://foodmamkor-staging.up.railway.app' }}

    # Started on every event (a few seconds), used only by PR runs.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mehamakor_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv (PR runs — local backend)
        if: github.event_name == 'pull_request'
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install backend dependencies (PR runs)
        if: github.event_name == 'pull_request'
        run: uv sync --frozen
        working-directory: backend

      # Runs in the BACKGROUND, in parallel with npm ci + the Next build
      # (~2–3 min); migrate + seed take ~40 s, so the backend is normally
      # ready before the build is. "Wait for local backend" below joins it.
      - name: Start local backend (PR runs, background)
        if: github.event_name == 'pull_request'
        run: nohup scripts/e2e/start-local-backend.sh > /tmp/backend-setup.log 2>&1 &
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mehamakor_e2e
          BACKEND_LOG: /tmp/backend.log
          DEMO_OWNER_PASSWORD: ${{ secrets.DEMO_OWNER_PASSWORD }}
          DEMO_CONSUMER_PASSWORD: ${{ secrets.DEMO_CONSUMER_PASSWORD }}
          DEMO_ADMIN_PASSWORD: ${{ secrets.DEMO_ADMIN_PASSWORD }}

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright (Chromium only)
        run: npx playwright install --with-deps chromium
        working-directory: frontend
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          # Silence telemetry noise in CI logs (mirrors PR-Checks).
          NEXT_TELEMETRY_DISABLED: "1"
          # Same backend the Vercel previews proxied to (Railway staging,
          # docs/DEPLOYMENT.md → env table). NEXT_PUBLIC_* is inlined at
          # build time; rewrites() reads it again at server boot.
          NEXT_PUBLIC_API_URL: ${{ env.E2E_API_URL }}
          # MEH-1778: without this the GSI script is never appended
          # (use-google-sign-in.js:26 returns early on an absent client id), so
          # every "no GSI console warning" assertion in
          # e2e/flows/09-login-console-clean.spec.ts passed on an empty universe
          # — green because nothing ran, not because the code was correct.
          # NOT a secret: an OAuth client id is public by design (it ships in
          # the browser bundle) and this exact value is already committed at
          # docs/DEPLOYMENT.md:1350. Plain env, deliberately not `secrets.*`.
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: 591935721343-jjrco2vpmok72to1fm8rq1ss0i2s0cj7.apps.googleusercontent.com

      # MEH-1044 — replaces MEH-728's "Warm up Vercel preview". Same purpose
      # (a cold server must not trip --fail-on-flaky-tests), local target:
      # start `next start` in the background, then poll until it serves 200,
      # capped at ~90s. Unlike the preview warm-up this gate is HARD — a dead
      # local server means the runner is broken, not "residual latency".
      - name: Start Next.js server (background)
        run: |
          nohup npm run start > /tmp/next-start.log 2>&1 &
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ env.E2E_API_URL }}

      - name: Wait for localhost readiness
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ || echo 000)
            echo "attempt $i → HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Server ready after ${i} attempt(s)."
              exit 0
            fi
            sleep 3
          done
          echo "::error::next start did not serve 200 within ~90s."
          tail -50 /tmp/next-start.log
          exit 1

      - name: Wait for local backend (PR runs)
        if: github.event_name == 'pull_request'
        run: |
          for i in $(seq 1 120); do
            if curl -sf -o /dev/null http://127.0.0.1:8080/health; then
              echo "local backend ready (waited ${i}s after the build)"
              cat /tmp/backend-setup.log | tail -5
              exit 0
            fi
            sleep 1
          done
          echo "::error::local backend not ready — setup log:"
          cat /tmp/backend-setup.log
          tail -50 /tmp/backend.log || true
          exit 1

      # MEH-1712 — CAPTURE ONLY. Dials Railway FROM THE RUNNER, which is the one
      # path nobody has measured: the CC sandbox is blocked from *.up.railway.app
      # (MEH-360), and staging.mehamakor.online reaches the same backend only via
      # the Vercel edge, so neither reproduces the runner's own client/DNS/TLS.
      #
      # Two probes, not one, because the open question is an ASYMMETRY: the
      # browser's /api/* rewrite returns 200 in the same run where the SSR
      # by-slug fetch ends in notFound(). Probing only the failing call would
      # show a number with nothing to compare it against.
      #
      # Reading it: a non-200 on by-slug names the bug outright. So does a
      # time_total > 8s — that is serverFetch's DEFAULT_TIMEOUT_MS
      # (frontend/lib/server-fetch.js:26), and an fetch that exceeds it throws,
      # lands in the catch at app/[locale]/[slug]/page.js:20, and returns null →
      # notFound(). Both probes 200 and fast ⇒ the backend is exonerated and the
      # cause is inside the Next server process.
      #
      # `continue-on-error` + `if: always()` are deliberate: this step diagnoses,
      # it must never become a new gate or change the suite's verdict.
      - name: Backend reachability probe (capture-only, MEH-1712)
        if: always()
        continue-on-error: true
        env:
          NEXT_PUBLIC_API_URL: ${{ env.E2E_API_URL }}
        run: |
          probe() {
            printf '%-12s ' "$1"
            curl -sS -o /dev/null -m 30 -w 'HTTP %{http_code}  total=%{time_total}s  connect=%{time_connect}s\n' "$2" \
              || echo "REQUEST FAILED (curl exit $?)"
          }
          {
            echo "target: $NEXT_PUBLIC_API_URL"
            probe "by-slug" "$NEXT_PUBLIC_API_URL/producers/by-slug/ruach-hasadeh"
            probe "collection" "$NEXT_PUBLIC_API_URL/producers?limit=1"
          } 2>&1 | tee /tmp/backend-probe.log

      - name: Run E2E tests
        id: e2e-run
        # MEH-484 — --fail-on-flaky-tests turns "passed on retry" into a hard
        # failure so flake stops hiding behind the retry. retries: 1 in CI is
        # preserved (config); the flag detects flake without disabling retries.
        # MEH-2895: `--shard` splits the suite and, by itself, switches on the
        # blob reporter (playwright.config.ts) so e2e-report can merge both halves.
        #
        # MEH-2972 (Sapir 12/11, decision card «שלב 1 + 2»): the strict flag
        # stays on PULL REQUESTS only. On a staging push or the nightly run a
        # test that passed on retry is reported, not blocking: e2e-report
        # prints a ::warning:: naming the count, and testing.md makes a card
        # for it the same day. Measured 10–12/11: every staging run whose
        # Playwright jobs executed was red (5/5), each on 1–2 of ~1,550 tests,
        # and rule 41 then froze every PR. A test that FAILS both attempts is
        # still red everywhere.
        run: npx playwright test ${{ github.event_name == 'pull_request' && '--fail-on-flaky-tests' || '' }} --shard=${{ matrix.shard }}/2
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          CI: "true"
          # MEH-999: unlock the authenticated specs. global-setup.ts provisions
          # e2e/.auth/{producer,consumer,admin}.json by logging in through the
          # /api proxy to the Railway staging backend, where these accounts are
          # seeded (backend/scripts/seed_demo_business.py). Without them the
          # authed specs skip — see docs/ci/e2e-auth-fixtures.patch.md.
          DEMO_OWNER_PASSWORD: ${{ secrets.DEMO_OWNER_PASSWORD }}
          DEMO_CONSUMER_PASSWORD: ${{ secrets.DEMO_CONSUMER_PASSWORD }}
          DEMO_ADMIN_PASSWORD: ${{ secrets.DEMO_ADMIN_PASSWORD }}

      # MEH-1604: the invariant is "how many tests RAN", not the exit code.
      # A failing global-setup kills the whole run before a single spec loads,
      # and that reports as an ordinary failure — indistinguishable from "one
      # test failed". Zero coverage is the worst outcome and must make the
      # loudest noise, not the same red.
      # if: always() — precisely when the previous step failed we need to know
      # whether anything ran. cancelled is excluded: a superseded run (rule 21)
      # is not a real coverage gap.
      - name: E2E coverage floor
        if: >-
          always() && steps.e2e-run.outcome != 'cancelled' &&
          steps.e2e-run.outcome != 'skipped'
        working-directory: frontend
        run: |
          REPORT=playwright-report/results.json
          if [ ! -f "$REPORT" ]; then
            echo "::error::ZERO COVERAGE — no JSON report at $REPORT. The json reporter is missing from playwright.config.ts (MEH-1604 step 0), or the run died before writing it."
            exit 1
          fi
          EXPECTED=$(jq '[.suites[]?.specs[]?, (.suites[]?.suites[]?.specs[]?)] | length' "$REPORT")
          STATS_EXPECTED=$(jq '.stats.expected // 0' "$REPORT")
          STATS_UNEXPECTED=$(jq '.stats.unexpected // 0' "$REPORT")
          STATS_FLAKY=$(jq '.stats.flaky // 0' "$REPORT")
          STATS_SKIPPED=$(jq '.stats.skipped // 0' "$REPORT")
          EXECUTED=$((STATS_EXPECTED + STATS_UNEXPECTED + STATS_FLAKY))
          echo "executed=$EXECUTED (expected=$STATS_EXPECTED unexpected=$STATS_UNEXPECTED flaky=$STATS_FLAKY skipped=$STATS_SKIPPED specs=$EXPECTED)"
          echo "executed=$EXECUTED" >> "$GITHUB_OUTPUT"
          echo "skipped=$STATS_SKIPPED" >> "$GITHUB_OUTPUT"
          # MEH-2196: the reporter decides from the COUNTS, not the exit code,
          # so it needs the failing ones too. Already computed four lines up.
          echo "unexpected=$STATS_UNEXPECTED" >> "$GITHUB_OUTPUT"
          echo "flaky=$STATS_FLAKY" >> "$GITHUB_OUTPUT"
          if [ "$EXECUTED" -eq 0 ]; then
            echo "::error::ZERO COVERAGE — global-setup aborted, 0 tests executed"
            echo "The suite reported no executed tests. This is NOT 'some tests failed' —"
            echo "nothing ran. Check global-setup.ts (auth fixture provisioning) first."
            exit 1
          fi
        id: coverage-floor

      # MEH-2895: the QA report comment moved to the e2e-report job below — two
      # shards posting into one upserted comment would overwrite each other.
      - name: Upload blob report (for e2e-report)
        uses: actions/upload-artifact@v7
        if: >-
          always() && steps.e2e-run.outcome != 'cancelled' &&
          steps.e2e-run.outcome != 'skipped'
        with:
          name: blob-report-${{ matrix.shard }}
          path: frontend/blob-report/
          retention-days: 1
          if-no-files-found: warn
          # A "re-run failed jobs" attempt uploads the same name again.
          overwrite: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          # MEH-484 — also capture per-test trace.zip files so the trace viewer
          # (playwright.dev/docs/trace-viewer) can replay flake-on-retry runs
          # without re-running locally.
          path: |
            frontend/playwright-report/
            frontend/test-results/**/trace.zip
          retention-days: 7

      # MEH-1712 — the same content, in the one place a CC session can actually
      # read it. An artifact download redirects to Azure blob storage
      # (productionresultssa18.blob.core.windows.net); the GitHub API hands back
      # a valid pre-signed URL and the fetch then dies with
      # `curl: (56) CONNECT tunnel failed, response 403` because that host is
      # outside the sandbox egress allowlist. No GitHub App permission changes
      # that — it is the same class as the *.up.railway.app block, and it is
      # permanent. The probe numbers were diagnosable today for exactly one
      # reason: they went to the job log, not only to an artifact.
      #
      # So this is not a duplicate of the upload below. The upload keeps the
      # whole file for a human; this step is what removes the human from the
      # loop. Rule: a diagnostic value that exists only inside an artifact is,
      # from a CC session, a value that does not exist.
      #
      # The empty case prints an explicit line rather than nothing. "No output"
      # is indistinguishable from "step didn't run" — reporting absence as
      # silence is the precise failure this ticket spent a day on.
      - name: Print next-start log (capture-only, MEH-1712)
        if: always()
        continue-on-error: true
        run: |
          echo "=== /tmp/next-start.log — last 200 lines ==="
          if [ -s /tmp/next-start.log ]; then
            tail -200 /tmp/next-start.log
          else
            echo "(EMPTY OR MISSING) $(ls -l /tmp/next-start.log 2>&1)"
          fi
          echo "=== end /tmp/next-start.log ==="

      # MEH-1712 — the server's own stdout. `next start` has written to
      # /tmp/next-start.log since MEH-1044 (step "Start Next.js server"), but
      # nothing ever uploaded it, so every serverFetch failure it recorded was
      # discarded at job teardown. That is why a half-day of triage could refute
      # three hypotheses without once seeing the actual error: the file existed
      # the whole time and was never kept.
      #
      # `if: always()` (not `failure()`, unlike the report above) — a PASSING run
      # is the control. Without it there is nothing to diff a failing log against.
      # `if-no-files-found: warn` so an empty capture is visible rather than a
      # silent success, which is the failure mode this whole ticket is about.
      - name: Upload E2E diagnostics (MEH-1712)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-diagnostics-${{ matrix.shard }}
          path: |
            /tmp/next-start.log
            /tmp/backend-probe.log
          retention-days: 7
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────────
  # MEH-2895 — E2E REPORT: one verdict for the two shards.
  # Merges the shards' blob reports, re-derives the counts the old single job
  # computed (executed / unexpected / flaky / skipped), fails if either shard
  # left no report, and posts the QA comment once. Not in e2e-gate's needs:
  # each shard already enforces its own coverage floor, and this job only
  # reports.
  # ─────────────────────────────────────────────────────────────────
  e2e-report:
    name: E2E report (merged shards)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: e2e
    if: >-
      always() && needs.e2e.result != 'skipped' &&
      needs.e2e.result != 'cancelled'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # One directory per shard (no merge-multiple), so a missing shard can be
      # named rather than merely counted.
      - name: Download blob reports
        uses: actions/download-artifact@v8
        with:
          pattern: blob-report-*
          path: frontend/all-blob-reports

      # Per-shard counts first, then the merged totals. A shard whose
      # global-setup aborted still writes a blob (Playwright's blob reporter
      # runs onEnd) with 0 executed, and the merged totals of the other shard
      # would then read as PASS over half the suite. So each shard must have
      # its own blob AND executed > 0, otherwise `partial` names it and the
      # comment says INCOMPLETE — never PASS, never "wait for a newer run".
      - name: Merge reports and count
        id: coverage-floor
        working-directory: frontend
        run: |
          mkdir -p playwright-report merged-blobs
          PARTIAL=""
          for N in 1 2; do
            DIR="all-blob-reports/blob-report-$N"
            ZIPS=$(find "$DIR" -name '*.zip' 2>/dev/null | wc -l)
            if [ "$ZIPS" -eq 0 ]; then
              echo "::error::Shard $N/2 left no blob report — it timed out, was cancelled, or died before its report step."
              PARTIAL="$PARTIAL shard $N/2: no report;"
              continue
            fi
            PLAYWRIGHT_JSON_OUTPUT_FILE="playwright-report/shard-$N.json" \
              npx playwright merge-reports --reporter json "$DIR"
            E=$(jq '(.stats.expected // 0) + (.stats.unexpected // 0) + (.stats.flaky // 0)' "playwright-report/shard-$N.json")
            echo "shard $N/2: executed=$E"
            if [ "$E" -eq 0 ]; then
              echo "::error::Shard $N/2 executed 0 tests — its global-setup aborted (see that shard's log)."
              PARTIAL="$PARTIAL shard $N/2: 0 executed;"
            fi
            cp "$DIR"/*.zip merged-blobs/
          done
          if [ -n "$(ls -A merged-blobs)" ]; then
            PLAYWRIGHT_JSON_OUTPUT_FILE=playwright-report/results.json \
              npx playwright merge-reports --reporter json merged-blobs
            REPORT=playwright-report/results.json
            STATS_EXPECTED=$(jq '.stats.expected // 0' "$REPORT")
            STATS_UNEXPECTED=$(jq '.stats.unexpected // 0' "$REPORT")
            STATS_FLAKY=$(jq '.stats.flaky // 0' "$REPORT")
            STATS_SKIPPED=$(jq '.stats.skipped // 0' "$REPORT")
          else
            STATS_EXPECTED=0; STATS_UNEXPECTED=0; STATS_FLAKY=0; STATS_SKIPPED=0
          fi
          EXECUTED=$((STATS_EXPECTED + STATS_UNEXPECTED + STATS_FLAKY))
          echo "merged: executed=$EXECUTED (expected=$STATS_EXPECTED unexpected=$STATS_UNEXPECTED flaky=$STATS_FLAKY skipped=$STATS_SKIPPED)"
          {
            echo "executed=$EXECUTED"
            echo "skipped=$STATS_SKIPPED"
            echo "unexpected=$STATS_UNEXPECTED"
            echo "flaky=$STATS_FLAKY"
            echo "partial=$PARTIAL"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$PARTIAL" ]; then
            echo "::error::Incomplete run:$PARTIAL"
            exit 1
          fi
          # MEH-2972: off pull requests a retry-pass no longer reds the run
          # (see the e2e job's run step), so say it out loud instead.
          if [ "$STATS_FLAKY" -gt 0 ]; then
            echo "::warning::$STATS_FLAKY flaky test(s) passed only on retry — each needs a Linear card today (testing.md, MEH-2972). Names: the 'N flaky' block in each shard's log."
          fi

      # MEH-1074 (W0.1) — QA report as a PR comment: one upserted comment per
      # PR (marker-matched, edited in place — no comment spam on re-push).
      # Runs on pass AND fail (if: always()); skipped on push-to-staging runs
      # where there is no PR to comment on, and on CANCELLED runs — a rapid
      # second push concurrency-cancels the in-flight run, and reporting its
      # outcome would post "FAIL" for a superseded run (the workflow-rule-21
      # false-failure class, observed live on PR #1568 within an hour of the
      # step landing). The fresh run upserts the real verdict.
      - name: Post QA report comment
        uses: actions/github-script@v9
        # !cancelled(): when npm ci / checkout / download fail, the counts are
        # empty and the verdict module says DID NOT RUN — better than leaving the
        # previous head's comment up, looking current.
        if: >-
          !cancelled() && github.event_name == 'pull_request'
        with:
          script: |
            const marker = "<!-- e2e-qa-report -->";
            // MEH-2196: PASS / FAIL / DID-NOT-RUN, decided from the counts.
            // The logic and its self-test live in the repo so they can be run
            // and proven without applying a workflow edit:
            //   node scripts/ci/qa-report-verdict.cjs --self-test
            const raw = {
              outcome:    "${{ needs.e2e.result }}",
              executed:   "${{ steps.coverage-floor.outputs.executed }}",
              unexpected: "${{ steps.coverage-floor.outputs.unexpected }}",
              flaky:      "${{ steps.coverage-floor.outputs.flaky }}",
              skipped:    "${{ steps.coverage-floor.outputs.skipped }}",
            };
            let report;
            try {
              report = require("./scripts/ci/qa-report-verdict.cjs").verdict(raw);
            } catch (err) {
              // The module is unreachable only when `actions/checkout` did not
              // complete — which IS the did-not-run condition, so fall back to
              // it rather than to an accusation. This step runs under
              // `always()`, so it fires on a job cancelled mid-checkout: the
              // exact 26/08 case. Never let a missing file become "a spec
              // failed".
              report = {
                headline: "Playwright QA — DID NOT RUN",
                outcome: raw.outcome || "unknown",
                // executed/skipped are read below for the MEH-1904 drop
                // comparison and stored in the data marker. Spelled as null,
                // not left undefined: JSON.stringify omits undefined keys, so
                // the marker would lose them entirely and stop matching the
                // module's documented `number | null` shape.
                counts: { text: "executed=unknown · unexpected=unknown · flaky=unknown · skipped=unknown", executed: null, skipped: null },
                detail: `**Nothing ran, and the reporter itself could not load** (\`${err.message}\`) — the checkout did not complete. **This is NOT a spec failure.**`,
              };
            }
            // MEH-2895: a shard missing or with 0 executed is never PASS, and
            // never "wait for a newer run" — name the shard instead.
            const partial = `${{ steps.coverage-floor.outputs.partial }}`.trim();
            if (partial) {
              report.headline = "Playwright QA — INCOMPLETE";
              report.detail =
                `**Not every shard ran:** ${partial} The counts above cover only what did run, ` +
                "so they are not a verdict on the PR. Open that shard's log. **This is not a pass.**\n\n" +
                report.detail;
            }
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              `## ${report.headline}`,
              "",
              `${report.counts.text} · step outcome \`${report.outcome}\` · ([run](${runUrl})), commit ${context.payload.pull_request.head.sha.slice(0, 7)}.`,
              "",
              report.detail,
            ].join("\n");
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.startsWith(marker));

            // MEH-1904 §5.2 — the previous REPORTED run on this PR. A cancelled
            // run never posts, so the standing comment is the right comparand.
            // Absent or malformed reads as "no previous numbers"; it must never
            // read as zero, which would claim a drop on every first run.
            let prev = null;
            if (existing && existing.body) {
              const m = existing.body.match(/<!-- e2e-qa-data (\{.*?\}) -->/);
              if (m) { try { prev = JSON.parse(m[1]); } catch (_) { prev = null; } }
            }

            // Reconciled against qa-report-verdict.cjs: `report.counts.executed`
            // and `.skipped` are `number | null` (toCount). The require-failure
            // fallback above carries both keys, but as null rather than a
            // number, so the two `typeof` guards are what keep a run that
            // measured nothing from claiming a drop ("null < 194" is true in
            // JS).
            const executed = report.counts.executed;
            const skipped = report.counts.skipped;
            const lines = [body];

            // A verdict that improved while coverage shrank is not an
            // improvement (MEH-1904 §1 case 3: 194 → 191 executed, verdict
            // improved, the comment said nothing).
            if (
              prev &&
              typeof prev.executed === "number" &&
              typeof executed === "number" &&
              executed < prev.executed
            ) {
              const fewer = prev.executed - executed;
              lines.push(
                "",
                `🔻 **${executed} executed (was ${prev.executed}) — ${fewer} spec${fewer === 1 ? "" : "s"} fewer ran.** ` +
                  `Skipped went ${prev.skipped ?? "?"} → ${skipped ?? "?"}. ` +
                  "Find out what stopped running before reading this comment as progress.",
              );
            }

            // The data line goes LAST; `existing` is found by startsWith(marker),
            // so the marker must stay the first line.
            lines.push(
              "",
              `<!-- e2e-qa-data ${JSON.stringify({
                executed, skipped,
                sha: context.payload.pull_request.head.sha.slice(0, 7),
                runId: String(context.runId),
              })} -->`,
            );
            const finalBody = lines.join("\n");
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body: finalBody,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body: finalBody,
              });
            }

  # ─────────────────────────────────────────────────────────────────
  # E2E GATE (MEH-1201) — required-check aggregator for the E2E suite.
  # Mirrors ci-gate (pr-checks.yml) / deploy-gate (deploy.yml):
  # `if: always()` + `needs`, so the gate reports its own status regardless of
  # whether the E2E job ran, skipped, or failed. On a docs-only PR the `e2e`
  # job skips via paths-filter (needs.filter.outputs.frontend == 'false') and a
  # skipped need evaluates as pass here — so docs-only merges clean.
  #
  # MEH-892: a *skipped* job listed DIRECTLY in the protect-staging ruleset
  # reads as "Expected" and BLOCKS merge (real 405 on a docs-only PR). That is
  # why the E2E job must NOT be added to the ruleset — THIS aggregator is the
  # required context instead.
  # ─────────────────────────────────────────────────────────────────
  # ─────────────────────────────────────────────────────────────────────────
  # MEH-1788 step B — real Safari engine coverage, SHADOW MODE.
  #
  # Step A (merged) added the webkit projects to playwright.config.ts behind
  # PW_WEBKIT=1. Without the flag the project list is byte-identical to before,
  # so nothing here can change what the Chromium `e2e` job runs.
  #
  # Three properties make this non-blocking BY CONSTRUCTION, not by convention:
  #   1. `continue-on-error: true` — a webkit failure never reds the run.
  #   2. It is NOT in `e2e-gate`'s `needs:`. The required check literally
  #      cannot see this job, so it cannot block a merge even if it fails.
  #   3. A separate cache key. Sharing `playwright-${{ runner.os }}-chromium-*`
  #      would let a webkit install poison the Chromium job's cache and vice
  #      versa — the two jobs install different browsers into the same path.
  #
  # ONE profile on purpose: webkit-iphone13 is the device class the Israeli
  # mobile-first audience actually carries. webkit-pixel5-viewport exists in the
  # config as a controlled local comparison (same viewport, different engine);
  # running both here would double the minutes to characterise the same engine.
  #
  # Promotion to blocking is a SEPARATE decision after a burn-in: once the
  # failure list is stable and understood, drop continue-on-error and add this
  # job to e2e-gate's needs. Do not promote on a single green run — a new engine
  # surfacing zero failures on its first outing means the specs did not exercise
  # anything engine-specific, not that Safari is fine.
  # ─────────────────────────────────────────────────────────────────────────
  e2e-webkit:
    name: Playwright E2E (WebKit — shadow, non-blocking)
    runs-on: ubuntu-latest
    # MEH-2972: was 20 and every run 10–12/11 hit it and was cancelled with no
    # report — 20 runner-minutes for zero information each time. The full
    # suite on one runner needs ~30 (the Chromium suite needed two shards to
    # fit in 30, MEH-2895), so it now runs nightly only, with room to finish.
    timeout-minutes: 60
    needs: filter
    concurrency:
      group: e2e-staging-backend-webkit
      cancel-in-progress: false
      queue: max
    # Never fails the workflow. See property 1 above.
    continue-on-error: true

    # MEH-2972: nightly + manual only (no PR, no push), so the paths filter and
    # the `run-e2e` clauses below never decide anything — left in place so the
    # condition can be widened again without re-deriving it.
    #
    # MEH-2779 — on a PR the suite runs only once the PR carries the `run-e2e`
    # label. It used to run on every push of every PR, and the job-level
    # `e2e-staging-backend` queue below lets one run at a time repo-wide
    # (the shared Railway staging backend), so runs waited up to 14 h
    # (measured 4–6/11/2026) and were mostly cancelled unseen. A labeled
    # event for any other label does not start it. Push to staging and
    # workflow_dispatch are unchanged.
    if: |
      (github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch') &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       (contains(github.event.pull_request.labels.*.name, 'run-e2e') &&
        (github.event.action != 'labeled' || github.event.label.name == 'run-e2e')))

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # Separate key from the Chromium job. See property 3 above.
      - name: Cache Playwright browsers (webkit)
        id: playwright-cache-webkit
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-webkit-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright (WebKit only)
        run: npx playwright install --with-deps webkit
        working-directory: frontend
        if: steps.playwright-cache-webkit.outputs.cache-hit != 'true'

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_API_URL: https://foodmamkor-staging.up.railway.app
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: 591935721343-jjrco2vpmok72to1fm8rq1ss0i2s0cj7.apps.googleusercontent.com

      - name: Start Next.js server (background)
        run: |
          nohup npm run start > /tmp/next-start-webkit.log 2>&1 &
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://foodmamkor-staging.up.railway.app

      - name: Wait for localhost readiness
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ || echo 000)
            echo "attempt $i → HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Server ready after ${i} attempt(s)."
              exit 0
            fi
            sleep 3
          done
          echo "::error::next start did not serve 200 within ~90s."
          tail -50 /tmp/next-start-webkit.log
          exit 1

      # No --fail-on-flaky-tests here, deliberately: this run characterises a
      # new engine, and treating first-outing flake as a hard failure would bury
      # the real engine differences under retry noise. The Chromium job keeps
      # the strict flag (MEH-484) — that is the one that gates.
      - name: Run E2E tests (WebKit iPhone 13)
        id: e2e-webkit-run
        run: npx playwright test --project=webkit-iphone13
        working-directory: frontend
        env:
          PW_WEBKIT: "1"
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          CI: "true"
          DEMO_OWNER_PASSWORD: ${{ secrets.DEMO_OWNER_PASSWORD }}
          DEMO_CONSUMER_PASSWORD: ${{ secrets.DEMO_CONSUMER_PASSWORD }}
          DEMO_ADMIN_PASSWORD: ${{ secrets.DEMO_ADMIN_PASSWORD }}

      # MEH-1604's lesson, applied to the shadow run: "0 executed" and "all
      # passed" are indistinguishable from a green tick. During burn-in the
      # executed count is the only number that proves the engine ran at all.
      - name: Report WebKit executed count
        if: always() && steps.e2e-webkit-run.outcome != 'cancelled'
        working-directory: frontend
        run: |
          REPORT=playwright-report/results.json
          if [ ! -f "$REPORT" ]; then
            echo "::warning::No JSON report at $REPORT — the WebKit run produced no results."
            exit 0
          fi
          EXPECTED=$(jq '.stats.expected // 0' "$REPORT")
          UNEXPECTED=$(jq '.stats.unexpected // 0' "$REPORT")
          FLAKY=$(jq '.stats.flaky // 0' "$REPORT")
          SKIPPED=$(jq '.stats.skipped // 0' "$REPORT")
          EXECUTED=$((EXPECTED + UNEXPECTED + FLAKY))
          echo "WebKit iPhone 13 — executed=$EXECUTED (passed=$EXPECTED failed=$UNEXPECTED flaky=$FLAKY skipped=$SKIPPED)"
          {
            echo "### WebKit (iPhone 13) — shadow run"
            echo ""
            echo "| executed | passed | failed | flaky | skipped |"
            echo "| -- | -- | -- | -- | -- |"
            echo "| $EXECUTED | $EXPECTED | $UNEXPECTED | $FLAKY | $SKIPPED |"
            echo ""
            echo "Non-blocking. Not a leg of \`E2E gate\`."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$EXECUTED" -eq 0 ]; then
            echo "::warning::WebKit run executed 0 tests — the shadow job proved nothing this run."
          fi

      # Distinct artifact name: two jobs uploading `playwright-report` in the
      # same run collide.
      - name: Upload Playwright report (webkit)
        uses: actions/upload-artifact@v7
        if: always() && steps.e2e-webkit-run.outcome == 'failure'
        with:
          name: playwright-report-webkit
          path: |
            frontend/playwright-report/
            frontend/test-results/**/trace.zip
          retention-days: 7

  e2e-gate:
    name: E2E gate 
    if: always()
    needs: [filter, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Aggregate E2E required-check result
        env:
          R_FILTER: ${{ needs.filter.result }}
          R_E2E: ${{ needs.e2e.result }}
        run: |
          set -euo pipefail
          fail=0
          ok() { case "$1" in success|skipped) return 0 ;; *) return 1 ;; esac; }
          check() { if ok "$2"; then echo "  OK  $1: $2"; else echo "  FAIL $1: $2"; fail=1; fi; }

          # Guard the paths-filter result first — mirrors ci-gate's R_CHANGES
          # guard. If the filter itself broke we can't trust the e2e skip
          # decision, so block.
          if ! ok "$R_FILTER"; then
            echo "::error::Paths-filter job did not succeed (result=$R_FILTER) — cannot determine E2E scope."
            exit 1
          fi

          # success = mobile Pixel 5 + VRT specs green.
          # skipped  = docs-only PR (paths-filter) or dependabot — pass.
          # failure/cancelled = block.
          check "Playwright E2E (Vercel preview)" "$R_E2E"

          if [ "$fail" -ne 0 ]; then
            echo "::error::E2E gate failed — Playwright E2E (mobile Pixel 5 + VRT) did not pass."
            exit 1
          fi
          echo "E2E gate passed."
