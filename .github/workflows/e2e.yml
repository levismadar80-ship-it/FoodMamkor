name: E2E Tests

# Runs Playwright against the Vercel preview URL for every PR targeting
# staging or main. Tests hit the PR's own deployed preview — not the
# shared staging environment — so a broken PR shows red, not green.
#
# Flow:
#   1. Poll GitHub Deployments API until Vercel preview is "success" (up to 5 min)
#   2. Extract environment_url from the deployment status
#   3. Run Playwright with TEST_URL pointing at that URL
#   4. Upload HTML report as artifact on failure
#
# Required secrets: none beyond the auto-provided GITHUB_TOKEN.
# Vercel connects via its GitHub integration; deployments appear in
# GET /repos/{owner}/{repo}/deployments for the PR head SHA.

on:
  pull_request:
    branches: [staging, main]

# deployments: read — needed to poll GitHub Deployments API for Vercel preview URL
permissions:
  contents: read
  deployments: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E (Vercel preview)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright (Chromium only)
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Wait for Vercel preview deployment
        id: preview
        # shell: bash {0} — removes the default -eo pipefail flags so a jq
        # empty-result (exit 5) or a transient gh api error doesn't abort the
        # whole script; we handle errors manually with || fallbacks.
        shell: bash {0}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          echo "Polling GitHub Deployments API for Vercel preview…"
          echo "repo=$REPO  sha=$HEAD_SHA"

          for attempt in $(seq 1 20); do
            echo "--- attempt $attempt/20 ---"

            # Fetch recent deployments; fall back to empty array on error
            DEPLOYS=$(gh api "repos/$REPO/deployments?per_page=50" 2>/dev/null) || DEPLOYS="[]"

            # Locate the deployment whose SHA matches this commit
            STATUSES_URL=$(echo "$DEPLOYS" | \
              jq -r --arg sha "$HEAD_SHA" \
              '[.[] | select(.sha == $sha)] | first | .statuses_url // ""' 2>/dev/null) || STATUSES_URL=""

            echo "  statuses_url=$STATUSES_URL"

            if [ -n "$STATUSES_URL" ] && [ "$STATUSES_URL" != "null" ]; then
              STATUSES=$(gh api "$STATUSES_URL" 2>/dev/null) || STATUSES="[]"
              STATE=$(echo "$STATUSES" | jq -r '.[0].state // "pending"' 2>/dev/null) || STATE="pending"
              ENV_URL=$(echo "$STATUSES" | jq -r '.[0].environment_url // ""' 2>/dev/null) || ENV_URL=""
              echo "  state=$STATE  environment_url=$ENV_URL"

              if [ "$STATE" = "success" ] && [ -n "$ENV_URL" ] && [ "$ENV_URL" != "null" ]; then
                echo "url=$ENV_URL" >> "$GITHUB_OUTPUT"
                echo "Preview URL: $ENV_URL"
                exit 0
              fi
            else
              echo "  No deployment found for SHA $HEAD_SHA yet"
            fi

            [ "$attempt" -lt 20 ] && sleep 15
          done

          echo "Timed out — no successful Vercel deployment found after 5 minutes"
          exit 1

      - name: Run E2E tests
        run: npx playwright test
        working-directory: frontend
        env:
          TEST_URL: ${{ steps.preview.outputs.url }}
          CI: "true"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
