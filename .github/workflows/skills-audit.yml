name: Skills Supply Chain Audit

# MEH-397 — supply-chain gate for the 83 skills under .agents/skills/ and
# .claude/skills/. Two-stage gate:
#   1. self-test — ensures audit-skills.sh exits 1 on the bad-skill fixture
#   2. real audit — ensures audit-skills.sh exits 0 on the live tree
#       (no critical findings + every skill present in skills-allowlist.json
#       with a non-blocked verdict).
#
# Triggers on changes to: skill content, lock, allowlist, audit script, the
# script's own test fixtures, or the workflow file itself.

on:
  pull_request:
    branches: [staging, main]
    paths:
      - '.agents/skills/**'
      - '.claude/skills/**'
      - '.claude/skills-allowlist.json'
      - '.claude/scripts/audit-skills.sh'
      - '.claude/scripts/test/**'
      - 'skills-lock.json'
      - '.github/workflows/skills-audit.yml'
  workflow_dispatch:

concurrency:
  group: skills-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Skills supply chain audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Verify jq is available
        run: jq --version

      - name: Validate JSON files parse cleanly
        run: |
          jq empty .claude/skills-allowlist.json
          jq empty skills-lock.json
          jq empty .claude/settings.json

      - name: Verify allowlist count matches expectations
        run: |
          count=$(jq '.skills | length' .claude/skills-allowlist.json)
          echo "Allowlist entries: $count"
          if [ "$count" -lt 75 ]; then
            echo "::error::skills-allowlist.json has fewer than 75 entries — drift detected"
            exit 1
          fi

      - name: Self-test — fixture must exit 1
        run: |
          if bash .claude/scripts/audit-skills.sh --self-test; then
            echo "::error::Self-test passed when it should have failed (bad-skill fixture should trigger CRITICAL)."
            exit 1
          else
            rc=$?
            if [ "$rc" -ne 1 ]; then
              echo "::error::Self-test exited with $rc — expected 1."
              exit 1
            fi
            echo "Self-test correctly exited with 1 on bad-skill fixture."
          fi

      - name: Real audit — live tree must exit 0
        run: bash .claude/scripts/audit-skills.sh
