name: Skills Supply Chain Audit

# MEH-397 + MEH-420 — supply-chain gate for the 83 skills under
# .agents/skills/ and .claude/skills/. Three-stage gate:
#   1. self-test — ensures audit-skills.sh exits 1 on the bad-skill fixture
#   2. real audit — ensures audit-skills.sh exits 0 on the live tree
#       (no critical findings + every skill present in skills-allowlist.json
#       with a non-blocked verdict + every locked skill matches its
#       computedHash via Pass 4)
#   3. lock-drift verify — backfill --dry-run must exit 0 (catches PRs
#       that change skill content without rerunning backfill)
#
# Triggers on changes to: skill content, lock, allowlist, audit/hash/backfill
# scripts, audit fixtures, or the workflow file itself.

on:
  pull_request:
    branches: [staging, main]
    paths:
      - '.agents/skills/**'
      - '.claude/skills/**'
      - '.claude/skills-allowlist.json'
      - '.claude/scripts/audit-skills.sh'
      - '.claude/scripts/compute-skill-hash.sh'
      - '.claude/scripts/backfill-skill-hashes.sh'
      - '.claude/scripts/test/**'
      - 'skills-lock.json'
      - '.github/workflows/skills-audit.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Skills supply chain audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Verify jq is available
        run: jq --version

      - name: Validate JSON files parse cleanly
        run: |
          jq empty .claude/skills-allowlist.json
          jq empty skills-lock.json
          jq empty .claude/settings.json

      - name: Verify allowlist count matches expectations
        run: |
          count=$(jq '.skills | length' .claude/skills-allowlist.json)
          echo "Allowlist entries: $count"
          if [ "$count" -lt 71 ]; then
            echo "::error::skills-allowlist.json has fewer than 71 entries — drift detected"
            exit 1
          fi

      - name: Self-test — fixture must exit 1
        run: |
          if bash .claude/scripts/audit-skills.sh --self-test; then
            echo "::error::Self-test passed when it should have failed (bad-skill fixture should trigger CRITICAL)."
            exit 1
          else
            rc=$?
            if [ "$rc" -ne 1 ]; then
              echo "::error::Self-test exited with $rc — expected 1."
              exit 1
            fi
            echo "Self-test correctly exited with 1 on bad-skill fixture."
          fi

      - name: Real audit — live tree must exit 0
        run: bash .claude/scripts/audit-skills.sh

      - name: Lock-drift verify — backfill --dry-run must exit 0
        run: |
          if ! bash .claude/scripts/backfill-skill-hashes.sh --dry-run; then
            echo "::error::skills-lock.json drifted from skill content. Run 'bash .claude/scripts/backfill-skill-hashes.sh' locally and commit the updated lock."
            exit 1
          fi
