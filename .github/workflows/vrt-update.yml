name: VRT baseline update

# MEH-991 Chunk 3 — regenerates the e2e/visual screenshot baselines ON THE
# RUNNER and commits them back to the invoking branch. Baselines must come
# from the same environment that verifies them (ubuntu runner + Playwright
# chromium): dev machines (Windows) and the CC sandbox render different font
# stacks, so locally-generated baselines would red-line every CI comparison.
#
# Trigger: manual only (workflow_dispatch on a feature branch). Run it after
# any intentional visual change, review the committed baseline diff in the
# PR, merge. It never runs on a schedule and never pushes to staging/main —
# the branch it commits to is whatever ref it was dispatched on, and both
# protected branches reject direct pushes at the ruleset level anyway.
#
# Build/start steps mirror e2e.yml (MEH-1044 localhost target) — keep the
# two in sync when the server strategy changes.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vrt-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-baselines:
    name: Regenerate VRT baselines
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright (Chromium only)
        run: npx playwright install --with-deps chromium
        working-directory: frontend
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_API_URL: https://foodmamkor-staging.up.railway.app

      - name: Start Next.js server (background)
        run: |
          nohup npm run start > /tmp/next-start.log 2>&1 &
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://foodmamkor-staging.up.railway.app

      - name: Wait for localhost readiness
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ || echo 000)
            echo "attempt $i → HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Server ready after ${i} attempt(s)."
              exit 0
            fi
            sleep 3
          done
          echo "::error::next start did not serve 200 within ~90s."
          tail -50 /tmp/next-start.log
          exit 1

      - name: Regenerate baselines
        run: npx playwright test e2e/visual --update-snapshots
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          CI: "true"

      - name: Commit updated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/e2e/visual/*-snapshots
          if git diff --cached --quiet; then
            echo "Baselines unchanged — nothing to commit."
            exit 0
          fi
          git commit -m "test(vrt): regenerate visual parity baselines (MEH-991)"
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload report on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: vrt-update-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
