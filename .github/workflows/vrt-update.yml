name: VRT baseline update

# MEH-991 Chunk 3 — regenerates the e2e/visual screenshot baselines ON THE
# RUNNER and commits them back to the invoking branch. Baselines must come
# from the same environment that verifies them (ubuntu runner + Playwright
# chromium): dev machines (Windows) and the CC sandbox render different font
# stacks, so locally-generated baselines would red-line every CI comparison.
#
# Trigger: workflow_dispatch ONLY (manual). MEH-1496 removed the push
# auto-fire (on.push on e2e/visual/** or this file): it regenerated EVERY
# route's baseline and committed each changed one, so a targeted regen of a
# single route (e.g. /map) also rewrote the deliberately-frozen home baseline
# (MEH-1450 Phase 0; PR #2102 hit exactly this and merged the frozen home
# baseline to staging). The optional `route` dispatch input (--grep) scopes a
# run to one baseline; empty input keeps the full regen. Dispatch needs a token
# with actions:write (the GitHub MCP integration in CC sessions does not have
# it — run it from the Actions tab / gh CLI on a feature branch).
# It never runs on a schedule and never pushes to staging/main — it commits to
# the ref it ran on, and both protected branches reject direct pushes at the
# ruleset level anyway.
#
# MEH-1705: DISPATCH THIS AGAINST THE FEATURE BRANCH, NEVER staging/main. The
# sentence above describes the design; it did not stop four dispatches against
# staging that regenerated every baseline and then died at the commit step with
# nothing saved. The first job step now rejects a protected ref up front with
# the correct usage, so the failure names itself instead of looking transient.
#
# Build/start steps mirror e2e.yml (MEH-1044 localhost target) — keep the
# two in sync when the server strategy changes.

on:
  # MEH-1496: manual dispatch ONLY. `route` scopes the regen to a single
  # baseline via Playwright --grep (empty = every route, the prior behavior).
  workflow_dispatch:
    inputs:
      route:
        description: 'Playwright --grep pattern (ריק = כל ה-routes)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: vrt-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-baselines:
    name: Regenerate VRT baselines
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Self-loop guard: the baseline commit this job pushes must not re-run it.
    if: github.actor != 'github-actions[bot]'

    steps:
      # MEH-1705: fail FAST on a protected ref. This job regenerates baselines
      # and then commits them back to the ref it ran on — but `protect-staging`
      # (and the main ruleset) reject direct pushes, so a dispatch against
      # staging/main regenerates the images and then throws them away at the
      # commit step. That failure lands ~90s in, at the LAST step, and reads
      # like a transient CI fault rather than a usage error; it produced four
      # wasted dispatches (30301613939, 30212779646, 30212224342, 30211514753)
      # against staging while every feature-branch dispatch succeeded. The
      # header above already said "never pushes to staging/main" — prose alone
      # did not stop it, so this is the mechanism (MEH-271: mechanism > memory).
      - name: Reject dispatch against a protected branch
        if: github.ref_name == 'staging' || github.ref_name == 'main'
        run: |
          echo "::error title=Dispatch this against the feature branch, not ${{ github.ref_name }}::VRT baselines are committed back to the ref the run was launched from, and '${{ github.ref_name }}' rejects direct pushes at the ruleset level. This run would regenerate every baseline and then fail at 'Commit updated baselines' with nothing saved."
          echo ""
          echo "  Correct usage:  Actions -> VRT baseline update -> Run workflow"
          echo "                  Branch: the FEATURE branch whose PR is red"
          echo "                  route:  the single baseline to regen (e.g. home)"
          echo ""
          echo "  The baselines land as a commit on that branch. Because the bot"
          echo "  pushes with GITHUB_TOKEN, no workflow re-runs on it — push a"
          echo "  follow-up commit as yourself to re-trigger the gates"
          echo "  (MEH-1112/1113)."
          exit 1

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright (Chromium only)
        run: npx playwright install --with-deps chromium
        working-directory: frontend
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_API_URL: https://foodmamkor-staging.up.railway.app
          # MEH-1778 follow-up: e2e.yml gained this var so the GSI script
          # actually loads in CI; this file did not, and the header above
          # ("Build/start steps mirror e2e.yml — keep the two in sync") is
          # exactly the contract that was broken. The cost was a silent no-op:
          # without the client id, LoginClient.jsx:111-113 and
          # RegisterClient.jsx:195 render no OAuth section, so a regen produced
          # baselines byte-identical to the stale ones and the commit step
          # reported "Baselines unchanged — nothing to commit" with a GREEN run.
          # A regen that cannot regenerate is the MEH-1778 defect in a new file.
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: 591935721343-jjrco2vpmok72to1fm8rq1ss0i2s0cj7.apps.googleusercontent.com

      - name: Start Next.js server (background)
        run: |
          nohup npm run start > /tmp/next-start.log 2>&1 &
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://foodmamkor-staging.up.railway.app

      - name: Wait for localhost readiness
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ || echo 000)
            echo "attempt $i → HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Server ready after ${i} attempt(s)."
              exit 0
            fi
            sleep 3
          done
          echo "::error::next start did not serve 200 within ~90s."
          tail -50 /tmp/next-start.log
          exit 1

      - name: Regenerate baselines
        # MEH-1496: scope to one route when `route` is set (e.g. "map" or
        # "producer detail"); empty input regenerates every baseline. PR #2102
        # added the input but left this step unscoped — the input was dead.
        run: |
          if [ -n "${{ inputs.route }}" ]; then
            npx playwright test e2e/visual --update-snapshots --grep "${{ inputs.route }}"
          else
            npx playwright test e2e/visual --update-snapshots
          fi
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          CI: "true"

      - name: Commit updated baselines
        # MEH-1295: run even if the Regenerate step "failed" on an unrelated,
        # non-target spec (e.g. the /producer/[id] nav flake). --update-snapshots
        # still writes every baseline that DID render, so a single failing spec
        # must not block committing the regenerated ones. `git add` only stages
        # the snapshot dir + the diff-quiet guard no-ops when nothing changed.
        # success() || failure() (not always()) so a concurrency-CANCELLED run
        # — cancel-in-progress is true — can't commit a partially-rendered
        # snapshot set mid-`--update-snapshots`. (PR #1891 review.)
        if: ${{ success() || failure() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/e2e/visual/*-snapshots
          if git diff --cached --quiet; then
            echo "Baselines unchanged — nothing to commit."
            exit 0
          fi
          git commit -m "test(vrt): regenerate visual parity baselines (MEH-991)"
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload report on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: vrt-update-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
