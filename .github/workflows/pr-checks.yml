name: PR Checks

# Runs on every PR targeting staging or main.
# Four jobs: build, pytest (with coverage gate at 70%, MEH-489),
# lint-backend (required, MEH-488/MEH-505), env-drift (MEH-491).
# build + pytest + lint-backend + env-drift are required status checks
# (configure in branch protection).
# Adversarial review now lives in .github/workflows/claude-review.yml
# (MEH-487 — anthropics/claude-code-action@v1, calibration mode).

# Draft-skip (MEH-926): required checks skip on draft PRs to save CI. The
# `ready_for_review` trigger type below is load-bearing — on draft→ready it
# fires a real run so the (now non-draft) jobs execute and go green. Without
# it the required checks would never run after the draft phase and would stay
# pending = merge BLOCKED. This does NOT rely on "a skipped check satisfies
# the requirement": under Rulesets a skipped required check reports as
# "Expected" and BLOCKS merge — but a draft PR isn't mergeable anyway, so the
# gate only matters once the PR is marked ready for review.
on:
  # MEH-1490 follow-up: allow a manual re-run of the required gates from the
  # Actions tab (or `gh workflow run`). Useful when a push's webhook is dropped
  # and the gates never registered against the current head. NOTE: only works
  # once this workflow lives on the DEFAULT branch — a workflow_dispatch cannot
  # target a run on a branch where the trigger isn't yet present.
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [staging, main]

# MEH-485: dorny/paths-filter@v3 needs pull-requests:read on pull_request
# triggers (calls the PR Files API). Same shape as e2e.yml.
permissions:
  contents: read
  pull-requests: read

concurrency:
  # MEH-1653: ready_for_review מקבל group נפרד כדי שלא יבטל ריצת synchronize
  # שבאוויר. ריצה מבוטלת מדווחת cancelled, וה-aggregator ממפה cancelled ל-FAIL —
  # אודם שקרי. GitHub Support על אותה מחלקה: community discussion #77942.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}-${{ github.event.action == 'ready_for_review' }}
  cancel-in-progress: true

jobs:
  branch-name-gate:
    name: Branch name gate
    runs-on: ubuntu-latest
    # Skip for staging → main release PRs (MEH-1105): the head branch is always
    # `staging`, which cannot match the feature/meh-* convention by design.
    # Feature-branch enforcement (the grep below) is untouched.
    if: ${{ github.head_ref && !(github.base_ref == 'main' && github.head_ref == 'staging') }}
    steps:
      - name: Assert branch name matches the locked convention (MEH-1141)
        run: |
          BRANCH="${{ github.head_ref }}"
          if ! printf '%s' "$BRANCH" | grep -Eq '^(feature|levismadar80)/meh-[0-9]+(-[a-z0-9]+)*$|^dependabot/.*'; then
            echo "::error::Branch '$BRANCH' violates the locked naming convention (workflow rule 3, MEH-1141)."
            echo "Allowed: feature/meh-{N}-{slug} | levismadar80/meh-{N}-{slug} | dependabot/*"
            exit 1
          fi
          echo "Branch '$BRANCH' OK."

  do-not-merge-gate:
    name: DO-NOT-MERGE marker gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail if the PR carries a DO-NOT-MERGE marker (MEH-1155, ADR-016 amendment)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          if printf '%s\n%s' "$PR_TITLE" "$PR_BODY" | grep -Eiq '(^|[^A-Za-z0-9_-])do[ _-]?not[ _-]?merge([^A-Za-z0-9_-]|$)|DNM-LOCK'; then
            echo "::error::This PR carries a DO-NOT-MERGE marker. Per ADR-016 (amendment, MEH-1155) auto-merge authority is VOID regardless of risk tier. Only Sapir may remove the marker."
            exit 1
          fi
          echo "No DO-NOT-MERGE marker. OK."

  repo-guards:
    name: Repo guards
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - name: Run every guard in scripts/checks/ (MEH-999)
        run: bash scripts/checks/run-all.sh

  qa-artifacts-size:
    name: qa-artifacts size cap
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Cap qa-artifacts growth (MEH-1156)
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MAX_BYTES: "2097152"
        run: |
          set -euo pipefail
          # Release-PR exemption (MEH-1105): a staging → main release PR is a
          # rollup of hundreds of already-merged per-PR diffs, so the 2 MB
          # *per-PR* cap (MEH-1156) does not apply to it. Exempt exactly that
          # one base/head combination; every other PR is enforced unchanged.
          if [ "$BASE_REF" = "main" ] && [ "$HEAD_REF" = "staging" ]; then
            echo "::notice::Release PR (staging → main) — the per-PR 2 MB qa-artifacts cap does not apply to a release rollup; skipping the cap. (MEH-1105)"
            echo "qa-artifacts size cap OK (release-PR exemption)."
            exit 0
          fi
          total=0
          while read -r f; do
            [ -n "$f" ] || continue
            sz=$(git cat-file -s "$HEAD_SHA:$f" 2>/dev/null || echo 0)
            total=$((total + sz))
          done < <(git diff --name-only --diff-filter=AM "$BASE_SHA" "$HEAD_SHA" -- qa-artifacts/)
          mb=$(awk -v t="$total" 'BEGIN{printf "%.2f", t/1048576}')
          echo "qa-artifacts added/modified in this PR: ${total} bytes (${mb} MB)"
          if [ "$total" -gt "$MAX_BYTES" ]; then
            echo "::error::qa-artifacts grew by ${mb} MB (cap: 2.00 MB). Compress the screenshots (pngquant / WebP / JPEG q80) before committing. See MEH-1156."
            exit 1
          fi
          echo "qa-artifacts size cap OK."

  # ─────────────────────────────────────────────
  # JOB 0: paths-filter (MEH-485)
  # Gates downstream jobs so frontend-only PRs skip
  # backend pytest and vice versa. Pattern mirrored
  # from e2e.yml (MEH-424). Skipped jobs report
  # conclusion=success → branch-protection required
  # checks remain satisfied without manual override.
  # ─────────────────────────────────────────────
  changes:
    name: Paths filter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'package.json'
              - 'package-lock.json'
            backend:
              - 'backend/**'
              - 'tests/**'
            workflows:
              - '.github/workflows/**'

  # ─────────────────────────────────────────────
  # JOB 1: npm run build
  # ─────────────────────────────────────────────
  build:
    name: Frontend build (Next.js)
    needs: changes
    if: ${{ (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflows == 'true') && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Silence telemetry noise in CI logs.
          NEXT_TELEMETRY_DISABLED: "1"

      # MEH-686 Step 18 — design-token drift gate (Flag B). Re-exports tokens
      # from docs/DESIGN.md and fails if the committed tailwind.tokens.json
      # drifts. Closes the two-owners gap (MEH-271) between DESIGN.md and the
      # generated artifact that tailwind.config.js consumes via require().
      - name: Verify tailwind.tokens.json sync with DESIGN.md
        working-directory: frontend
        run: |
          npm run design:export
          git diff --exit-code tailwind.tokens.json || {
            echo "::error::tailwind.tokens.json is out of sync with docs/DESIGN.md."
            echo "::error::Run 'cd frontend && npm run design:export' locally and commit the result."
            exit 1
          }

  # ─────────────────────────────────────────────
  # JOB 1b: ai-artifact-scan (MEH-449 Layer 2)
  # ─────────────────────────────────────────────
  # Fails the PR if any AI development artifact (by filename) or any
  # sensitive internal literal reaches the frontend build output. Runs its
  # own build: GitHub jobs don't share workspaces and the build job doesn't
  # upload .next; a self-contained rebuild keeps the two jobs independent.
  # Canonical pattern list: .claude/hooks/check-artifact-location.sh.
  ai-artifact-scan:
    name: AI artifact scan (build output)
    needs: [changes, build]
    if: ${{ (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflows == 'true') && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (scan target)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: "Scan 2a — forbidden AI-artifact filenames in deployable output"
        run: |
          set -euo pipefail
          # public/ is scanned alongside .next: next build does NOT copy
          # public/ into .next (no standalone output), and on Vercel
          # public/ IS the served static root — a CLAUDE.md planted there
          # ships without ever touching .next.
          hits=$(find .next public -type f \( \
            -iname "CLAUDE.md" -o -iname "CLAUDE.local.md" \
            -o -iname "HANDOFF.md" -o -iname "ROADMAP.md" \
            -o -iname "AGENTS.md" \) 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "::error::MEH-449 scan 2a — AI dev artifact file(s) found in deployable output:"
            echo "$hits"
            exit 1
          fi
          echo "Scan 2a clean — no forbidden filenames in .next or public/"

      - name: "Scan 2b — forbidden content literals in deployable output"
        run: |
          set -euo pipefail
          # Known-legitimate exception: the admin-help runbook i18n copy
          # contains the string "_migrate_columns" (messages/he.json +
          # en.json, admin.help.* namespace) and is bundled into the
          # messages_* chunks. Those chunks are excluded; the same literal
          # anywhere else still fails.
          for lit in "_migrate_columns" "MEH-265" "JWT_SECRET_KEY="; do
            hits=$(grep -rl --binary-files=text -- "$lit" .next public 2>/dev/null | grep -v "messages_.*json" || true)
            if [ -n "$hits" ]; then
              echo "::error::MEH-449 scan 2b — forbidden literal '$lit' found in deployable output:"
              echo "$hits"
              exit 1
            fi
          done
          echo "Scan 2b clean — no forbidden literals in .next or public/"

  # ─────────────────────────────────────────────
  # JOB 2: pytest
  # ─────────────────────────────────────────────
  pytest:
    name: Backend tests (pytest)
    needs: changes
    if: ${{ (needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true') && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mehamakor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen
        working-directory: backend
      - name: Lock consistency (uv.lock ↔ pyproject.toml)
        run: uv lock --check
        working-directory: backend

      - name: Show installed packages
        run: uv pip list
        working-directory: backend

      # ─────────────────────────────────────────────
      # Migration drift gate (MEH-267)
      # Runs alembic against the fresh Postgres service before pytest.
      # Catches migration bugs (broken revision file, bad SQL, wrong deps)
      # at PR time instead of on production boot.
      # ─────────────────────────────────────────────
      - name: Alembic upgrade head (migration drift gate)
        working-directory: backend
        run: .venv/bin/alembic upgrade head
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mehamakor_test
          SECRET_KEY: ci-test-secret-not-for-production

      - name: Verify alembic schema (36 tables)
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          # MEH-530: head chain 80bbf0a24874 (MEH-479) → d7e3c9a82f5b (MEH-587
          # drop recipes) → f4c8a91e2b07 (MEH-588 add producer_recipes +
          # producer_recipe_products; tables 32 → 34) → e8a3c4b5d791 (this PR,
          # add producer_license_number column to producers; no table count
          # change). Second conflict on this line (after the MEH-587 resolution)
          # — Rule 25 / MEH-585 staging-sync absorbed MEH-588 mid-PR.
          # MEH-509 PR2b: d4046deb0dc1 adds the inbound_messages table for
          # the after-hours watchdog (tables 34 → 35; populated by the future
          # PR2c webhook receiver).
          # MEH-509 PR3: a7f3e9c14d28 adds 2 nullable columns (risk_score,
          # risk_reasoning) to producers — additive, no table count change.
          # MEH-1338: alert_log (frequency-cap ledger for fire_alerts) — 36 -> 37.
          EXPECTED_TABLES=39

          TABLE_COUNT=$(psql -h localhost -U postgres -d mehamakor_test -tAc \
            "SELECT COUNT(*) FROM information_schema.tables
             WHERE table_schema='public'
               AND table_type='BASE TABLE'
               AND table_name <> 'alembic_version';")
          if [ "$TABLE_COUNT" -ne "$EXPECTED_TABLES" ]; then
            echo "::error::Table count=$TABLE_COUNT, expected $EXPECTED_TABLES"
            psql -h localhost -U postgres -d mehamakor_test -c "\dt"
            exit 1
          fi
          echo "Tables (excl. alembic_version) = $TABLE_COUNT ✓"

      # MEH-492 — Model-vs-migration drift gate.
      # Compares Base.metadata (target_metadata in alembic/env.py:36)
      # against the schema produced by `alembic upgrade head` above.
      # Catches the class of bug where a column is added to a model
      # without a paired revision: pytest passes (tests don't touch
      # the new column), upgrade head passes (chain is intact),
      # EXPECTED_TABLES still matches (count unchanged) — but
      # production boot fails when the model tries to read/write the
      # missing column. Requires Alembic ≥ 1.9 (pyproject pins 1.13.2).
      - name: Alembic drift check (models vs migrations)
        working-directory: backend
        run: .venv/bin/alembic check
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mehamakor_test
          SECRET_KEY: ci-test-secret-not-for-production

      # MEH-489 — coverage gate at 70%. Drops `-x` so the full suite runs
      # (partial runs make coverage meaningless); drops `-v` for log
      # signal-to-noise (the coverage summary is now the load-bearing
      # output). `--tb=long` retained for failure trace quality.
      # Baseline at merge: 77% (5,529 stmts, 1,281 missed). Threshold 70%
      # = baseline − 7pt buffer; lift via follow-up ticket as new tests land.
      - name: Run tests with coverage gate
        run: |
          backend/.venv/bin/python -m pytest tests/ \
            --cov=backend/app \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term \
            --cov-fail-under=70 \
            --tb=long --timeout=60
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mehamakor_test
          # Stub secrets so imports don't fail — tests never hit real services.
          SECRET_KEY: ci-test-secret-not-for-production
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mehamakor_test

      # MEH-489 — Smokeshow upload (Tiangolo pattern).
      # `continue-on-error: true` covers the calibration window before
      # SMOKESHOW_AUTH_KEY lands as a repo secret post-merge. Fork PR
      # guard skips the upload on forks (no secret access there).
      - name: Upload coverage to Smokeshow
        if: success() && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        run: |
          backend/.venv/bin/python -m pip install smokeshow
          backend/.venv/bin/smokeshow upload htmlcov
        env:
          SMOKESHOW_AUTH_KEY: ${{ secrets.SMOKESHOW_AUTH_KEY }}
          SMOKESHOW_GITHUB_STATUS_DESCRIPTION: "Coverage {coverage-percentage}"
          SMOKESHOW_GITHUB_CONTEXT: coverage
          SMOKESHOW_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMOKESHOW_GITHUB_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  # ─────────────────────────────────────────────
  # JOB 3: lint-backend (MEH-488 / MEH-505)
  # ruff check + ruff format --check against backend/.
  # `alembic/versions` excluded (auto-generated revisions don't follow
  # ruff's style). MEH-505 flipped this to blocking after MEH-448
  # cleaned the baseline (18 check errors + 56 format files → 0).
  # Add "Backend lint (ruff)" to the required-checks list in
  # `Settings → Branches → staging`/`main` after this PR's CI runs
  # once on the protected branch (GitHub auto-suggests the check name
  # only post-first-run on the target).
  # ─────────────────────────────────────────────
  lint-backend:
    name: Backend lint (ruff)
    needs: changes
    if: ${{ (needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true') && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies (ruff comes from dev group)
        run: uv sync --frozen
        working-directory: backend
      - name: Lock consistency (uv.lock ↔ pyproject.toml)
        run: uv lock --check
        working-directory: backend

      # `--extend-exclude alembic/versions` is set on the CLI rather than in
      # pyproject.toml because the lint-config protection hook
      # (MEH-442 / MEH-466) blocks edits to [tool.ruff*] sections.
      - name: ruff check
        run: uv run ruff check . --extend-exclude alembic/versions
        working-directory: backend

      # `ruff format` only supports `--exclude` (not `--extend-exclude` —
      # that's a `ruff check` only flag). Fixed in MEH-505 after the
      # MEH-448 CHANGELOG surfaced the bug; calibration `continue-on-error`
      # had been masking the unrecognized-flag failure as a format violation.
      - name: ruff format --check
        run: uv run ruff format --check . --exclude alembic/versions
        working-directory: backend

  # ─────────────────────────────────────────────
  # JOB 4: env-drift (MEH-491)
  # Detects env vars read by code but not documented in any .env.example.
  # NOT paths-filter gated — env reads can land in any file (frontend
  # config, backend router, observability setup), so the drift surface
  # is broader than backend/ or frontend/ alone.
  # Fast (<10s expected — pure grep + comm). Required.
  # ─────────────────────────────────────────────
  env-drift:
    name: Env drift (.env.example)
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v7

      - name: Run drift check
        run: bash scripts/check_env_drift.sh

  # ─────────────────────────────────────────────
  # JOB 5: backend-mypy (MEH-562 Layer 2)
  # Strict mypy on app/auth.py only — scoped from
  # auth.py + schemas/ due to STOP-condition (a):
  # combined count was 57 errors > 50 threshold.
  #
  # Two-layer warn-only:
  #   1. `|| true` on the mypy command → step exits 0 → check
  #      reports green even when mypy finds errors. Clean PR UX
  #      (the owner's call — see HANDOFF entry for MEH-562).
  #   2. `continue-on-error: true` at the job → defensive belt-
  #      and-braces: if `|| true` is ever stripped during a future
  #      edit, the workflow still doesn't fail.
  #
  # Errors stay visible in the workflow logs and in
  # docs/research/static-analysis-baseline.md. Regression
  # tracking lives in the git history of the baseline doc, not
  # in the check status. Hybrid annotation upgrade (post baseline-
  # vs-current as a PR comment) is a follow-up ticket post-launch.
  # ─────────────────────────────────────────────
  backend-mypy:
    name: Backend mypy (strict, warn-only)
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies (including mypy)
        run: uv sync --dev --frozen
        working-directory: backend

      - name: Run mypy strict on app/auth.py (warn-only — errors logged, check passes)
        run: uv run mypy app/auth.py --strict || true
        working-directory: backend

  # ─────────────────────────────────────────────
  # JOB 6: frontend-knip (MEH-562 Layer 2)
  # Dead-code + unused-deps detection.
  # Two-layer warn-only — see backend-mypy comment above.
  # ─────────────────────────────────────────────
  frontend-knip:
    name: Frontend Knip (dead code, warn-only)
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Knip (warn-only — findings logged, check passes)
        run: npm run knip || true

  # ─────────────────────────────────────────────
  # JOB 7: frontend-tsc-strict (MEH-562 Layer 2)
  # TypeScript strict on e2e/*.ts files via
  # tsconfig.e2e.json. Baseline: 24 errors in
  # e2e/rtl.spec.ts (JSDoc `left-*/right-*` comment
  # terminates block early — pre-existing, TS6 bug).
  # Two-layer warn-only — see backend-mypy comment above.
  # ─────────────────────────────────────────────
  frontend-tsc-strict:
    name: Frontend tsc strict (warn-only)
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tsc strict (e2e files, warn-only — errors logged, check passes)
        run: npx tsc --project tsconfig.e2e.json --noEmit || true

  frontend-vitest:
    name: Frontend unit tests (vitest)
    needs: changes
    if: ${{ (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflows == 'true') && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run vitest unit suite
        run: npx vitest run

  # ─────────────────────────────────────────────
  # JOB: linear-mentions — workflow.md rule 29 (Linear auto-reopen guard)
  # Warn-only ratchet (mirrors backend-mypy):
  #   1. `|| true` on the script → step exits 0 even on a finding
  #   2. `continue-on-error: true` at the job → belt-and-braces
  # Docs-only scope (rule 29 only bans mentions in docs/HANDOFF PRs):
  # runs when neither frontend nor backend nor workflows changed.
  # Findings surface as ::warning:: annotations. NOT added to the
  # required-checks ruleset at this stage.
  # ─────────────────────────────────────────────
  linear-mentions:
    name: Linear mention guard (rule 29, warn-only)
    needs: changes
    if: ${{ needs.changes.outputs.frontend != 'true' && needs.changes.outputs.backend != 'true' && needs.changes.outputs.workflows != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Write PR title and body to files
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_TITLE" > "$RUNNER_TEMP/pr_title.txt"
          printf '%s' "$PR_BODY"  > "$RUNNER_TEMP/pr_body.txt"
      - name: Check for bare Linear identifiers (warn-only)
        run: bash .claude/scripts/check-linear-mentions.sh "$RUNNER_TEMP/pr_title.txt" "$RUNNER_TEMP/pr_body.txt" || true

  ci-gate:
    name: CI gate (required)
    if: always()
    needs:
      - changes
      - do-not-merge-gate
      - qa-artifacts-size
      - repo-guards
      - build
      - ai-artifact-scan
      - pytest
      - lint-backend
      - env-drift
      - backend-mypy
      - frontend-knip
      - frontend-tsc-strict
      - frontend-vitest
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Aggregate required-check results
        env:
          FRONTEND_TOUCHED: ${{ needs.changes.outputs.frontend }}
          BACKEND_TOUCHED: ${{ needs.changes.outputs.backend }}
          R_CHANGES: ${{ needs.changes.result }}
          R_DNM: ${{ needs.do-not-merge-gate.result }}
          R_QA_SIZE: ${{ needs.qa-artifacts-size.result }}
          R_REPO_GUARDS: ${{ needs.repo-guards.result }}
          R_BUILD: ${{ needs.build.result }}
          R_AI_SCAN: ${{ needs.ai-artifact-scan.result }}
          R_PYTEST: ${{ needs.pytest.result }}
          R_LINT_BACKEND: ${{ needs.lint-backend.result }}
          R_ENV_DRIFT: ${{ needs.env-drift.result }}
          R_BACKEND_MYPY: ${{ needs.backend-mypy.result }}
          R_FRONTEND_KNIP: ${{ needs.frontend-knip.result }}
          R_FRONTEND_TSC: ${{ needs.frontend-tsc-strict.result }}
          R_FRONTEND_VITEST: ${{ needs.frontend-vitest.result }}
        run: |
          set -euo pipefail
          fail=0

          ok() {
            case "$1" in
              success|skipped) return 0 ;;
              *) return 1 ;;
            esac
          }

          check() {
            if ok "$2"; then
              echo "  OK  $1: $2"
            else
              echo "  FAIL $1: $2"
              fail=1
            fi
          }

          # MEH-1582: a job that the gate is actively enforcing must have RUN.
          # `skipped` there means a draft suppressed it (or a future `if:` did) —
          # that is an absence of evidence, not a pass.
          strict_ok() {
            case "$1" in
              success) return 0 ;;
              *) return 1 ;;
            esac
          }

          check_ran() {
            if strict_ok "$2"; then
              echo "  OK  $1: $2"
            else
              echo "  FAIL $1: $2 (required job did not run — 'skipped' is not a pass)"
              fail=1
            fi
          }

          echo "Stack touched -> frontend=$FRONTEND_TOUCHED backend=$BACKEND_TOUCHED"

          if ! ok "$R_CHANGES"; then
            echo "::error::Paths-filter job did not succeed (result=$R_CHANGES) — cannot determine stack."
            exit 1
          fi

          echo "Always required (stack-independent):"
          check_ran "DO-NOT-MERGE marker gate" "$R_DNM"
          check_ran "qa-artifacts size cap" "$R_QA_SIZE"
          check_ran "Repo guards" "$R_REPO_GUARDS"
          check_ran "Env drift (.env.example)" "$R_ENV_DRIFT"

          if [ "$BACKEND_TOUCHED" = "true" ]; then
            echo "Backend stack touched — enforcing backend checks:"
            check_ran "Backend tests (pytest)" "$R_PYTEST"
            check_ran "Backend lint (ruff)" "$R_LINT_BACKEND"
            check "Backend mypy (strict, warn-only)" "$R_BACKEND_MYPY"
          else
            echo "Backend stack not touched — backend checks not enforced."
          fi

          if [ "$FRONTEND_TOUCHED" = "true" ]; then
            echo "Frontend stack touched — enforcing frontend checks:"
            check_ran "Frontend build (Next.js)" "$R_BUILD"
            check_ran "AI artifact scan (MEH-449)" "$R_AI_SCAN"
            check "Frontend Knip (warn-only)" "$R_FRONTEND_KNIP"
            check "Frontend tsc strict (warn-only)" "$R_FRONTEND_TSC"
            check_ran "Frontend unit tests (vitest)" "$R_FRONTEND_VITEST"
          else
            echo "Frontend stack not touched — frontend checks not enforced."
          fi

          if [ "$BACKEND_TOUCHED" != "true" ] && [ "$FRONTEND_TOUCHED" != "true" ]; then
            echo "Neither stack touched (workflows-only / docs-only) — only env-drift enforced."
          fi

          if [ "$fail" -ne 0 ]; then
            echo "::error::CI gate failed — one or more required checks for a touched stack did not pass."
            exit 1
          fi

          echo "CI gate passed."
