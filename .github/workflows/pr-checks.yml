name: PR Checks

# Runs on every PR targeting staging or main.
# Three jobs: build, pytest, test-inventory (non-gating).
# build + pytest are required status checks (configure in branch protection).
# Adversarial review now lives in .github/workflows/claude-review.yml
# (MEH-487 — anthropics/claude-code-action@v1, calibration mode).

on:
  pull_request:
    branches: [staging, main]

# MEH-485: dorny/paths-filter@v3 needs pull-requests:read on pull_request
# triggers (calls the PR Files API). Same shape as e2e.yml.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # JOB 0: paths-filter (MEH-485)
  # Gates downstream jobs so frontend-only PRs skip
  # backend pytest and vice versa. Pattern mirrored
  # from e2e.yml (MEH-424). Skipped jobs report
  # conclusion=success → branch-protection required
  # checks remain satisfied without manual override.
  # ─────────────────────────────────────────────
  changes:
    name: Paths filter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'package.json'
              - 'package-lock.json'
            backend:
              - 'backend/**'
            workflows:
              - '.github/workflows/**'

  # ─────────────────────────────────────────────
  # JOB 1: npm run build
  # ─────────────────────────────────────────────
  build:
    name: Frontend build (Next.js)
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Silence telemetry noise in CI logs.
          NEXT_TELEMETRY_DISABLED: "1"

  # ─────────────────────────────────────────────
  # JOB 2: pytest
  # ─────────────────────────────────────────────
  pytest:
    name: Backend tests (pytest)
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mehamakor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen
        working-directory: backend

      - name: Show installed packages
        run: uv pip list
        working-directory: backend

      # ─────────────────────────────────────────────
      # Migration drift gate (MEH-267)
      # Runs alembic against the fresh Postgres service before pytest.
      # Catches migration bugs (broken revision file, bad SQL, wrong deps)
      # at PR time instead of on production boot.
      # ─────────────────────────────────────────────
      - name: Alembic upgrade head (migration drift gate)
        working-directory: backend
        run: .venv/bin/alembic upgrade head
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mehamakor_test
          SECRET_KEY: ci-test-secret-not-for-production

      - name: Verify alembic schema (34 tables + baseline revision)
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          EXPECTED_REV="80bbf0a24874"
          EXPECTED_TABLES=34

          ACTUAL_REV=$(psql -h localhost -U postgres -d mehamakor_test -tAc \
            "SELECT version_num FROM alembic_version;")
          if [ "$ACTUAL_REV" != "$EXPECTED_REV" ]; then
            echo "::error::alembic_version='$ACTUAL_REV', expected '$EXPECTED_REV'"
            exit 1
          fi
          echo "alembic_version = $ACTUAL_REV ✓"

          TABLE_COUNT=$(psql -h localhost -U postgres -d mehamakor_test -tAc \
            "SELECT COUNT(*) FROM information_schema.tables
             WHERE table_schema='public'
               AND table_type='BASE TABLE'
               AND table_name <> 'alembic_version';")
          if [ "$TABLE_COUNT" -ne "$EXPECTED_TABLES" ]; then
            echo "::error::Table count=$TABLE_COUNT, expected $EXPECTED_TABLES"
            psql -h localhost -U postgres -d mehamakor_test -c "\dt"
            exit 1
          fi
          echo "Tables (excl. alembic_version) = $TABLE_COUNT ✓"

      - name: Run tests
        run: backend/.venv/bin/python -m pytest tests/ -v --tb=long -x --timeout=60
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mehamakor_test
          # Stub secrets so imports don't fail — tests never hit real services.
          SECRET_KEY: ci-test-secret-not-for-production
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mehamakor_test

  # ─────────────────────────────────────────────
  # JOB 3: test-inventory (MEH-394 Phase A)
  # Non-gating full-suite run across all 17 test
  # files. Output uploaded as artifact so Phase A
  # inventory can be read without digging through
  # raw CI logs. continue-on-error: true — never
  # blocks merge regardless of failures.
  # ─────────────────────────────────────────────
  test-inventory:
    name: Test inventory (full suite, non-gating)
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mehamakor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen
        working-directory: backend

      - name: Alembic upgrade head
        working-directory: backend
        run: .venv/bin/alembic upgrade head
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mehamakor_test
          SECRET_KEY: ci-test-secret-not-for-production

      - name: Run full test inventory
        run: |
          backend/.venv/bin/python -m pytest tests/ -v --tb=short \
            --no-header -p no:cacheprovider --timeout=60 \
            --continue-on-collection-errors \
            2>&1 | tee pytest-inventory.txt
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mehamakor_test
          SECRET_KEY: ci-test-secret-not-for-production
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mehamakor_test

      - name: Upload test inventory
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pytest-inventory
          path: pytest-inventory.txt
          retention-days: 7
