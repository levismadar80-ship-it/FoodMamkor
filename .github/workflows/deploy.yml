name: Deploy

# Triggered automatically on every merge to main OR staging, plus a manual
# "Run workflow" button in the Actions tab as a safety net.
#
# What this does:
#   1. Vercel auto-deploys via its own GitHub integration — that
#      keeps working with no help from this workflow. Vercel handles
#      both production (main → mehamakor.online) and preview/staging
#      (staging → staging.mehamakor.online) on its own.
#   2. Railway needs a kick because its own watch-paths config can
#      legitimately skip deploys (e.g. doc-only PRs that don't touch
#      backend/) and previously left main and Railway out of sync.
#      This workflow calls Railway's Deploy Hook URL on every merge
#      to main or staging so the matching Railway environment is
#      always running the latest commit on its tracked branch.
#
# Two jobs, gated by branch:
#   - production: runs only when ref is refs/heads/main, calls
#     RAILWAY_PRODUCTION_DEPLOY_HOOK
#   - staging:    runs only when ref is refs/heads/staging, calls
#     RAILWAY_STAGING_DEPLOY_HOOK
#
# Setup is documented in docs/DEPLOYMENT.md → "GitHub Actions auto-deploy".

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

# Cancel any in-flight run if a new push lands while we're still calling
# the webhook. Concurrency groups are per-environment so a main push and
# a staging push don't cancel each other — only back-to-back pushes to
# the *same* branch dedupe.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────
  # PRODUCTION — runs on push to main
  # ──────────────────────────────────────────────────────────────────
  production:
    name: Trigger Railway production redeploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Call Railway production deploy hook
        env:
          DEPLOY_HOOK: ${{ secrets.RAILWAY_PRODUCTION_DEPLOY_HOOK }}
          ENV_NAME: production
        run: |
          set -u

          # Fail-soft: if the secret hasn't been added yet, just warn
          # and exit 0 so the merge isn't blocked. The first deploy
          # after this workflow lands may have to be triggered manually
          # in the Railway UI; subsequent deploys will be automatic
          # once the secret is set.
          if [ -z "${DEPLOY_HOOK:-}" ]; then
            echo "::warning title=Missing secret::RAILWAY_PRODUCTION_DEPLOY_HOOK is not set."
            echo "::warning::Add it via: Settings → Secrets and variables → Actions → New repository secret."
            echo "::warning::See docs/DEPLOYMENT.md → 'GitHub Actions auto-deploy' for the full setup."
            exit 0
          fi

          # Call the webhook. Railway deploy hooks accept POST with no
          # body; the URL itself is the secret. Capture body + status
          # code separately so we can decide what to print.
          http_code=$(curl --silent --show-error \
            --max-time 30 \
            --output /tmp/railway-response.txt \
            --write-out "%{http_code}" \
            --request POST \
            "$DEPLOY_HOOK" || echo "curl_error")

          echo "Railway HTTP status ($ENV_NAME): $http_code"
          if [ -s /tmp/railway-response.txt ]; then
            echo "::group::Railway response body"
            cat /tmp/railway-response.txt
            echo
            echo "::endgroup::"
          fi

          short_sha="${GITHUB_SHA:0:7}"

          case "$http_code" in
            200|201|202|204)
              echo "::notice title=Railway $ENV_NAME redeploy::✅ Triggered for commit $short_sha"
              ;;
            curl_error)
              echo "::error title=Railway webhook unreachable::curl could not reach the $ENV_NAME deploy-hook URL — check Railway service status."
              exit 1
              ;;
            *)
              echo "::error title=Railway webhook failed::HTTP $http_code from $ENV_NAME deploy hook. Check the URL secret is still valid (Railway rotates these on service deletion)."
              exit 1
              ;;
          esac

  # ──────────────────────────────────────────────────────────────────
  # STAGING — runs on push to staging
  # ──────────────────────────────────────────────────────────────────
  #
  # NOTE: until the Railway staging environment exists (see
  # docs/DEPLOYMENT.md §B "Railway — add a staging environment alongside
  # production"), the RAILWAY_STAGING_DEPLOY_HOOK secret will be empty
  # and this job will fail-soft with a warning instead of failing the
  # build. That is intentional: it keeps the workflow safe to land
  # before the platform-side setup is finished.
  staging:
    name: Trigger Railway staging redeploy
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Call Railway staging deploy hook
        env:
          DEPLOY_HOOK: ${{ secrets.RAILWAY_STAGING_DEPLOY_HOOK }}
          ENV_NAME: staging
        run: |
          set -u

          if [ -z "${DEPLOY_HOOK:-}" ]; then
            echo "::warning title=Missing secret::RAILWAY_STAGING_DEPLOY_HOOK is not set."
            echo "::warning::This is expected if the Railway staging environment doesn't exist yet."
            echo "::warning::See docs/DEPLOYMENT.md → 'Branching Strategy — One-Time Platform Setup' → §A, then add the secret via Settings → Secrets and variables → Actions."
            exit 0
          fi

          http_code=$(curl --silent --show-error \
            --max-time 30 \
            --output /tmp/railway-response.txt \
            --write-out "%{http_code}" \
            --request POST \
            "$DEPLOY_HOOK" || echo "curl_error")

          echo "Railway HTTP status ($ENV_NAME): $http_code"
          if [ -s /tmp/railway-response.txt ]; then
            echo "::group::Railway response body"
            cat /tmp/railway-response.txt
            echo
            echo "::endgroup::"
          fi

          short_sha="${GITHUB_SHA:0:7}"

          case "$http_code" in
            200|201|202|204)
              echo "::notice title=Railway $ENV_NAME redeploy::✅ Triggered for commit $short_sha"
              ;;
            curl_error)
              echo "::error title=Railway webhook unreachable::curl could not reach the $ENV_NAME deploy-hook URL — check Railway service status."
              exit 1
              ;;
            *)
              echo "::error title=Railway webhook failed::HTTP $http_code from $ENV_NAME deploy hook. Check the URL secret is still valid (Railway rotates these on service deletion)."
              exit 1
              ;;
          esac
