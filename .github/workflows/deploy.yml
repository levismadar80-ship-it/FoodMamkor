name: Deploy

# Triggered automatically on every merge to main, plus a manual
# "Run workflow" button in the Actions tab as a safety net.
#
# What this does:
#   1. Vercel auto-deploys via its own GitHub integration — that
#      keeps working with no help from this workflow.
#   2. Railway needs a kick because its own watch-paths config can
#      legitimately skip deploys (e.g. doc-only PRs that don't touch
#      backend/) and previously left main and Railway out of sync.
#      This workflow calls Railway's Deploy Hook URL on every merge
#      to main so Railway is always running the latest commit.
#
# Setup is documented in docs/DEPLOYMENT.md → "GitHub Actions auto-deploy".

on:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel any in-flight run if a new push lands while we're still calling
# the webhook. Prevents two webhooks firing back-to-back when several
# PRs land in quick succession (Railway would queue them anyway, but
# this is cheaper).
concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  railway:
    name: Trigger Railway redeploy
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Call Railway deploy hook
        env:
          DEPLOY_HOOK: ${{ secrets.RAILWAY_DEPLOY_HOOK_URL }}
        run: |
          set -u

          # Fail-soft: if the secret hasn't been added yet, just warn
          # and exit 0 so the merge isn't blocked. The first deploy
          # after this workflow lands may have to be triggered manually
          # in the Railway UI; subsequent deploys will be automatic
          # once the secret is set.
          if [ -z "${DEPLOY_HOOK:-}" ]; then
            echo "::warning title=Missing secret::RAILWAY_DEPLOY_HOOK_URL is not set."
            echo "::warning::Add it via: Settings → Secrets and variables → Actions → New repository secret."
            echo "::warning::See docs/DEPLOYMENT.md → 'GitHub Actions auto-deploy' for the full setup."
            exit 0
          fi

          # Call the webhook. Railway deploy hooks accept POST with no
          # body; the URL itself is the secret. Capture body + status
          # code separately so we can decide what to print.
          http_code=$(curl --silent --show-error \
            --max-time 30 \
            --output /tmp/railway-response.txt \
            --write-out "%{http_code}" \
            --request POST \
            "$DEPLOY_HOOK" || echo "curl_error")

          echo "Railway HTTP status: $http_code"
          if [ -s /tmp/railway-response.txt ]; then
            echo "::group::Railway response body"
            cat /tmp/railway-response.txt
            echo
            echo "::endgroup::"
          fi

          short_sha="${GITHUB_SHA:0:7}"

          case "$http_code" in
            200|201|202|204)
              echo "::notice title=Railway redeploy::✅ Triggered for commit $short_sha"
              ;;
            curl_error)
              echo "::error title=Railway webhook unreachable::curl could not reach the deploy-hook URL — check Railway service status."
              exit 1
              ;;
            *)
              echo "::error title=Railway webhook failed::HTTP $http_code from deploy hook. Check the URL secret is still valid (Railway rotates these on service deletion)."
              exit 1
              ;;
          esac
