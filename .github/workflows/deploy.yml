name: Deploy

# Triggered automatically on every merge to main OR staging, plus a manual
# "Run workflow" button in the Actions tab as a safety net.
#
# What this does:
#   1. Vercel auto-deploys via its own GitHub integration — that
#      keeps working with no help from this workflow. Vercel handles
#      both production (main → mehamakor.online) and preview/staging
#      (staging → staging.mehamakor.online) on its own.
#   2. Railway needs a kick because its own watch-paths config can
#      legitimately skip deploys (e.g. doc-only PRs that don't touch
#      backend/) and previously left main and Railway out of sync.
#      This workflow installs the Railway CLI and runs
#      `railway redeploy` against the matching environment so the
#      backend can't lag behind regardless of which paths a merge
#      touches.
#
# Why CLI instead of deploy hooks?
#   Deploy hooks aren't available on our Railway plan. The CLI works
#   on every plan, just needs a Railway token with redeploy permissions.
#
# Two jobs, gated by branch, each with its own secret:
#   - production: runs only when ref is refs/heads/main, sets
#     RAILWAY_ENVIRONMENT=production + RAILWAY_TOKEN from
#     RAILWAY_PRODUCTION_TOKEN, then calls `railway redeploy --service`
#   - staging:    runs only when ref is refs/heads/staging, sets
#     RAILWAY_ENVIRONMENT=staging + RAILWAY_TOKEN from
#     RAILWAY_STAGING_TOKEN, then calls `railway redeploy --service`
#
# The current Railway CLI does NOT accept --environment as a `redeploy`
# flag — it errors with "unexpected argument '--environment' found".
# Instead, the CLI auto-reads the RAILWAY_ENVIRONMENT env var, which
# we set on each job. Same end result, just plumbed via env instead
# of flag.
#
# Why two secrets? Railway project tokens on our plan are scoped to a
# single environment within the project — one token can hit production
# OR staging, never both. So we need two secrets, one per environment.
# Both come from the same Railway project (believable-tenderness),
# generated from the matching environment view.
#
# Service name is sourced from the GitHub *variable* (not secret)
# `RAILWAY_SERVICE_NAME` — set it via Settings → Secrets and variables
# → Actions → Variables tab. If unset, defaults to `FoodMamkor`.
#
# Setup is documented in docs/DEPLOYMENT.md → "GitHub Actions auto-deploy".

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

# Cancel any in-flight run if a new push lands while we're still calling
# the CLI. Concurrency groups are per-branch (deploy-main vs deploy-staging)
# so a main push and a staging push don't cancel each other — only
# back-to-back pushes to the *same* branch dedupe.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────
  # LINT — runs on every PR and every push to main/staging.
  # Uses "warn" severity so pre-existing RTL violations don't block
  # CI while PR #137 (rtl-logical-properties) is being merged in.
  # Upgrade to "error" after #137 lands and all warnings are resolved.
  # ──────────────────────────────────────────────────────────────────
  lint:
    name: Frontend lint (RTL + Next.js rules)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ──────────────────────────────────────────────────────────────────
  # API CONTRACT (STATIC) — runs on every PR and push to main/staging.
  # MEH-245 — diffs frontend API calls against backend FastAPI routes,
  # flags orphan calls + method mismatches without hitting the network.
  # MEH-244 confirmed 0 drift (2026-04-25) — hard failure enabled.
  # ──────────────────────────────────────────────────────────────────
  api-contract-static:
    name: API contract audit (static)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: false
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run static contract check
        run: python scripts/check_api_contract.py

  # ──────────────────────────────────────────────────────────────────
  # PRODUCTION — runs on push to main
  # ──────────────────────────────────────────────────────────────────
  production:
    name: Trigger Railway production redeploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Sourced from RAILWAY_PRODUCTION_TOKEN — a Railway project-scoped
      # token restricted to the production environment. The CLI auto-reads
      # whatever is in the RAILWAY_TOKEN env var, so we name it that
      # locally even though the secret name differs.
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_PRODUCTION_TOKEN }}
      # The current Railway CLI does NOT accept --environment as a
      # `redeploy` flag (errors with "unexpected argument '--environment'
      # found"). Instead, the CLI auto-reads RAILWAY_ENVIRONMENT from
      # the env. Setting it here scopes every CLI call in this job to
      # the production environment without polluting the command line.
      RAILWAY_ENVIRONMENT: production
      # Service name lives in a *variable* (not a secret) so it can be
      # overridden without code changes. Defaults to FoodMamkor.
      SERVICE_NAME: ${{ vars.RAILWAY_SERVICE_NAME || 'FoodMamkor' }}

    steps:
      - name: Fail-soft if RAILWAY_PRODUCTION_TOKEN missing
        if: env.RAILWAY_TOKEN == ''
        run: |
          echo "::warning title=Missing secret::RAILWAY_PRODUCTION_TOKEN is not set."
          echo "::warning::Add it via: Settings → Secrets and variables → Actions → New repository secret."
          echo "::warning::Generate the token at: Railway → believable-tenderness project → Settings → Tokens → New Token (production environment)."
          echo "::warning::See docs/DEPLOYMENT.md → 'GitHub Actions auto-deploy' for the full setup."
          exit 0

      - name: Install Railway CLI
        if: env.RAILWAY_TOKEN != ''
        run: |
          npm install -g @railway/cli
          railway --version

      - name: Redeploy production service
        if: env.RAILWAY_TOKEN != ''
        run: |
          set -e
          short_sha="${GITHUB_SHA:0:7}"
          echo "Triggering Railway redeploy for service '$SERVICE_NAME' in environment '$RAILWAY_ENVIRONMENT' (commit $short_sha)..."

          # Environment is selected via the RAILWAY_ENVIRONMENT env var
          # set on the job (the CLI auto-reads it). --yes skips the
          # interactive confirmation prompt that `railway redeploy`
          # would otherwise wait on forever in CI.
          railway redeploy \
            --service "$SERVICE_NAME" \
            --yes

          echo "::notice title=Railway production redeploy::✅ Triggered for commit $short_sha (service: $SERVICE_NAME, env: $RAILWAY_ENVIRONMENT)"

  # ──────────────────────────────────────────────────────────────────
  # STAGING — runs on push to staging
  # ──────────────────────────────────────────────────────────────────
  staging:
    name: Trigger Railway staging redeploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Sourced from RAILWAY_STAGING_TOKEN — a Railway project-scoped
      # token restricted to the staging environment. Same CLI behavior
      # as the production job, just a different secret.
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN }}
      # Selects the staging Railway environment via env var (the CLI
      # auto-reads it; --environment is not a valid `redeploy` flag).
      RAILWAY_ENVIRONMENT: staging
      SERVICE_NAME: ${{ vars.RAILWAY_SERVICE_NAME || 'FoodMamkor' }}

    steps:
      - name: Fail-soft if RAILWAY_STAGING_TOKEN missing
        if: env.RAILWAY_TOKEN == ''
        run: |
          echo "::warning title=Missing secret::RAILWAY_STAGING_TOKEN is not set."
          echo "::warning::Add it via: Settings → Secrets and variables → Actions → New repository secret."
          echo "::warning::Generate the token at: Railway → believable-tenderness project → Settings → Tokens → New Token (staging environment)."
          echo "::warning::See docs/DEPLOYMENT.md → 'GitHub Actions auto-deploy' for the full setup."
          exit 0

      - name: Install Railway CLI
        if: env.RAILWAY_TOKEN != ''
        run: |
          npm install -g @railway/cli
          railway --version

      - name: Redeploy staging service
        if: env.RAILWAY_TOKEN != ''
        run: |
          set -e
          short_sha="${GITHUB_SHA:0:7}"
          echo "Triggering Railway redeploy for service '$SERVICE_NAME' in environment '$RAILWAY_ENVIRONMENT' (commit $short_sha)..."

          railway redeploy \
            --service "$SERVICE_NAME" \
            --yes

          echo "::notice title=Railway staging redeploy::✅ Triggered for commit $short_sha (service: $SERVICE_NAME, env: $RAILWAY_ENVIRONMENT)"

  # ──────────────────────────────────────────────────────────────────
  # API CONTRACT (PROBE) — runs after the staging redeploy finishes.
  # MEH-245 — hits every unique frontend path against the staging domain
  # and flags any 404. Catches deploy drift the static check cannot see
  # (a route missing from the running container even though the code
  # has it). MEH-244 confirmed 0 drift (2026-04-25) — hard failure enabled.
  # ──────────────────────────────────────────────────────────────────
  api-contract-probe-staging:
    name: API contract probe (staging)
    needs: staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: false
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install "requests==2.33.1"

      - name: Wait for container boot
        run: sleep 90

      - name: Probe staging
        run: python scripts/check_api_contract.py --probe https://staging.mehamakor.online
