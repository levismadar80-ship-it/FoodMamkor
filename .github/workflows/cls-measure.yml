name: CLS measurement (manual)

# workflow_dispatch בלבד — זו מדידה, לא שער. אסור שיהפוך ל-required:
# הוא פוגע ביעד חיצוני חי, ולכן אדום שלו יכול להיות «ה-staging היה איטי»
# באותה מידה כמו «הקוד נסוג» — ושער שאדום משתי סיבות אינו שער.
on:
  workflow_dispatch:
    inputs:
      path:
        description: "Path to measure (e.g. /producer/<id>)"
        required: true
        type: string
      url:
        description: "Base URL"
        required: false
        default: "https://staging.mehamakor.co.il"
        type: string
      runs:
        description: "Loads per viewport"
        required: false
        default: "3"
        type: string

jobs:
  measure:
    name: CLS measurement
    runs-on: ${{ (vars.CI_MODE == 'private' || github.event.repository.private) && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Measure CLS (control first, then 3 loads x 2 viewports)
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          node e2e/qa-meh1853-cls.mjs \
            --url "${{ inputs.url }}" \
            --path "${{ inputs.path }}" \
            --runs "${{ inputs.runs }}" \
            --out cls-results.json

      - name: Upload numbers
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cls-results
          path: frontend/cls-results.json
          if-no-files-found: error
          retention-days: 30
