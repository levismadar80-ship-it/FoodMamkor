name: Uptime probe

# MEH-2202: external, Sentry-independent liveness + readiness probe. Runs on a
# GitHub-hosted runner every 30 minutes and turns two consecutive failures into
# a GitHub issue (label `uptime`), closed again on recovery. No account, no
# money, no repo secret. Manual dispatch kept for a smoke run after applying.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime-probe
  cancel-in-progress: false

jobs:
  probe:
    name: Probe /, /api/health/readiness, Google Places, the OSM map tiles and the user journey
    runs-on: ${{ (vars.CI_MODE == 'private' || github.event.repository.private) && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 12
    env:
      HOME_URL: https://mehamakor.co.il/
      READY_URL: https://mehamakor.co.il/api/health/readiness
      # MEH-3356: one OSM tile, sent the way a visitor's browser sends it
      # (Referer = our origin). OSM can answer a block with 200 + `x-blocked`,
      # so the header is checked, not just the status code.
      TILE_URL: https://tile.openstreetmap.org/8/153/104.png
      TILE_REFERER: https://mehamakor.co.il/
      # MEH-2482: the server's Google Places key, probed with a real call on
      # every tick (one billable request each, 48 a day). Not hourly: the
      # outage issue needs two consecutive failing ticks, so a URL probed on
      # every other tick could never open one.
      PLACES_URL: https://mehamakor.co.il/api/health/places
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # MEH-3555: the journey check below runs a script from the repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/checks
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Probe the site, readiness, Places and the map tiles
        id: probe
        shell: bash
        run: |
          set -uo pipefail
          fail=0
          for url in "$HOME_URL" "$READY_URL"; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 --retry 2 --retry-delay 5 "$url" || echo 000)
            echo "$url -> HTTP $code"
            if [ "$code" != "200" ]; then fail=1; fi
          done
          # 200 alone is not enough: {"status":"disabled"} is also a 200 and
          # means the key is missing on the server.
          pbody=$(curl -sS --max-time 20 --retry 2 --retry-delay 5 -w '\n%{http_code}' "$PLACES_URL" || printf '\n000')
          pcode=$(printf '%s\n' "$pbody" | tail -n 1)
          echo "$PLACES_URL -> HTTP $pcode"
          if [ "$pcode" != "200" ] || ! printf '%s\n' "$pbody" | grep -q '"status":"ok"'; then
            echo "::warning::Google Places check not ok: $(printf '%s\n' "$pbody" | head -n 1 | cut -c1-200)"
            fail=1
          fi
          hdr=$(curl -sS -o /dev/null -D - --max-time 20 --retry 2 --retry-delay 5 \
                  -e "$TILE_REFERER" -A "mehamakor-uptime-probe/1.0 (+https://mehamakor.co.il)" \
                  "$TILE_URL" 2>/dev/null | tr -d '\r' || true)
          tcode=$(printf '%s\n' "$hdr" | awk 'toupper($1) ~ /^HTTP\// {c=$2} END {print c+0}')
          echo "$TILE_URL -> HTTP $tcode"
          if [ "$tcode" != "200" ] || printf '%s\n' "$hdr" | grep -qi '^x-blocked:'; then
            printf '%s\n' "$hdr" | grep -i '^x-blocked:' || true
            echo "::warning::OSM tile blocked or unreachable — map tiles on the site may show «Access blocked»"
            fail=1
          fi
          # MEH-3555: the user journey — catalog, home / producers / map, one
          # real business page, a Cloudinary image, the WhatsApp preview. Not
          # only "the site answers". GET only; ~15 requests to Vercel a tick.
          # Its failure feeds the same fail=1, so two failing ticks in a row
          # open the same uptime issue as everything else here.
          # Bounded well under timeout-minutes: a job killed by its timeout
          # never writes fail=, and the next step would read that as recovery.
          if ! timeout 240 python scripts/checks/smoke_production.py --quick; then
            echo "::warning::production journey check failed (smoke_production.py --quick) — see the lines above"
            fail=1
          fi
          echo "fail=$fail" >> "$GITHUB_OUTPUT"

      # One issue carries the outage state. Title is fixed so `gh issue list`
      # finds it; the body's first line records whether the previous tick
      # already failed (the "×2 consecutive" memory).
      - name: Update the outage issue
        if: always()
        shell: bash
        env:
          FAIL: ${{ steps.probe.outputs.fail }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Label bootstrap: create once, no-op afterwards (issues: write covers labels).
          gh label create uptime --color d73a4a --description "MEH-2202 uptime probe" 2>/dev/null || true
          title="uptime: mehamakor.co.il probe failing"
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # The title is quoted INSIDE the search string: unquoted, `uptime:`
          # reads as a search qualifier to GitHub's parser, not as literal text.
          #
          # Neither lookup below carries a blanket `|| true`. The empty-result
          # case is handled inside jq (`// empty` / `select(. != null)`), which
          # exits 0 on an empty list, so the only remaining non-zero exit is a
          # real API error — and that aborts the tick instead of arriving here
          # as an empty string that reads as "no issue exists" and opens a
          # duplicate on top of a live outage.
          if ! open=$(gh issue list --state open --label uptime \
                        --search "\"$title\" in:title" \
                        --json number --jq '.[0].number // empty'); then
            echo "::error::gh issue list (open) failed — issue state left untouched this tick."
            exit 1
          fi
          if ! closed=$(gh issue list --state closed --label uptime \
                          --search "\"$title\" in:title" --limit 1 \
                          --json number,body \
                          --jq '.[0] | select(. != null) | "\(.number)\t\((.body // "") | split("\n")[0])"'); then
            echo "::error::gh issue list (closed) failed — issue state left untouched this tick."
            exit 1
          fi

          if [ "$FAIL" = "1" ]; then
            if [ -n "$open" ]; then
              gh issue comment "$open" --body "still failing at $now — $RUN_URL"
            elif [ -n "$closed" ] && [ "${closed#*$'\t'}" = "first-failure-pending" ]; then
              # second consecutive failure → reopen with the real body
              n="${closed%%$'\t'*}"
              gh issue edit "$n" --body "OUTAGE OPENED $now (two consecutive probe failures) — $RUN_URL"
              gh issue reopen "$n"
            else
              # first failure: create closed, marked pending; the next tick decides
              n=$(gh issue create --title "$title" --label uptime --body "first-failure-pending" | grep -oE '[0-9]+$')
              gh issue close "$n" --comment "first failure at $now — waiting for the next tick before alerting ($RUN_URL)"
            fi 
          else
            if [ -n "$open" ]; then
              gh issue close "$open" --comment "recovered at $now — $RUN_URL"
            elif [ -n "$closed" ] && [ "${closed#*$'\t'}" = "first-failure-pending" ]; then
              n="${closed%%$'\t'*}"
              gh issue edit "$n" --body "single failure, recovered by the next tick at $now"
            fi
          fi
