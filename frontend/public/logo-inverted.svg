  <title>מהמקור — Mehamakor · inverted for dark surfaces</title>
  <desc>Inverted variant for brand-green backgrounds (#2E6853, #1F4A3A) and warm-dark surfaces. Green petal swapped to cream so it remains visible against brand-green grounds; warm petals desaturated for harmony. All five seeds individually legible.</desc>

