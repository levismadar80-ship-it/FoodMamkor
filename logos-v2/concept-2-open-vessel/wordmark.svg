<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 140" role="img" aria-label="Mehamakor wordmark">
  <title>Mehamakor wordmark</title>
  <style>
    :root { --fg: #2E6853; --bg: #F5F0E8; }
    @media (prefers-color-scheme: dark) { :root { --fg: #F5F0E8; --bg: #1A1A1A; } }
    .bg { fill: var(--bg); } .fg { fill: var(--fg); }
    .wm { font-family: 'Cormorant Garamond', 'EB Garamond', Georgia, serif; font-weight: 500; letter-spacing: 0.025em; }
    .he { font-family: 'Frank Ruhl Libre', 'Noto Serif Hebrew', serif; font-weight: 500; }
    .tag { font-family: 'DM Sans', system-ui, sans-serif; font-weight: 500; letter-spacing: 0.22em; }
  </style>
  <rect class="bg" width="600" height="140"/>
  <text class="wm fg" x="300" y="68" font-size="62" text-anchor="middle">Mehamakor</text>
  <text class="tag fg" x="300" y="94" font-size="10" text-anchor="middle" opacity="0.62">LOCAL FOOD · REAL PRODUCERS · ISRAEL</text>
  <text class="he fg" x="300" y="122" font-size="20" text-anchor="middle" opacity="0.55">מהמקור</text>
</svg>
