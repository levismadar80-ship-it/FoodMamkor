<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" role="img" aria-label="Mehamakor — open vessel monochrome">
  <title>Mehamakor — Open Vessel (single-color)</title>
  <style>
    :root { --fg: #2E6853; --bg: #F5F0E8; }
    @media (prefers-color-scheme: dark) { :root { --fg: #F5F0E8; --bg: #1A1A1A; } }
    .bg { fill: var(--bg); } .fg { fill: var(--fg); }
    .wm { font-family: 'Cormorant Garamond', 'EB Garamond', Georgia, serif; font-weight: 500; letter-spacing: 0.025em; }
    .tag { font-family: 'DM Sans', system-ui, sans-serif; font-weight: 500; letter-spacing: 0.22em; }
  </style>
  <rect class="bg" width="800" height="240"/>
  <path d="M 100 130 A 60 60 0 0 0 220 130" stroke="var(--fg)" stroke-width="11" stroke-linecap="round" fill="none"/>
  <line x1="100" y1="130" x2="220" y2="130" stroke="var(--fg)" stroke-width="3" stroke-linecap="round"/>
  <circle class="fg" cx="160" cy="80" r="9"/>
  <text class="wm fg" x="280" y="132" font-size="68">Mehamakor</text>
  <text class="tag fg" x="280" y="162" font-size="11" opacity="0.7">LOCAL FOOD · REAL PRODUCERS · ISRAEL</text>
</svg>
