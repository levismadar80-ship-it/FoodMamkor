<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 140" role="img" aria-label="Mehamakor wordmark with custom dot">
  <title>Mehamakor wordmark with signature accent dot</title>
  <style>
    :root { --fg: #2E6853; --bg: #F5F0E8; --accent: #C8632E; }
    @media (prefers-color-scheme: dark) { :root { --fg: #F5F0E8; --bg: #1A1A1A; --accent: #C99846; } }
    .bg { fill: var(--bg); } .fg { fill: var(--fg); } .accent { fill: var(--accent); }
    .wm { font-family: 'Cormorant Garamond', 'EB Garamond', Georgia, serif; font-weight: 500; letter-spacing: 0.025em; }
    .he { font-family: 'Frank Ruhl Libre', 'Noto Serif Hebrew', serif; font-weight: 500; }
    .tag { font-family: 'DM Sans', system-ui, sans-serif; font-weight: 500; letter-spacing: 0.22em; }
  </style>
  <rect class="bg" width="600" height="140"/>
  <g id="wordmark">
    <text class="wm fg" x="120" y="70" font-size="62">Mehamak</text>
    <circle class="accent" cx="408" cy="55" r="16"/>
    <text class="wm fg" x="428" y="70" font-size="62">r</text>
  </g>
  <text class="tag fg" x="300" y="98" font-size="10" text-anchor="middle" opacity="0.62">LOCAL FOOD · REAL PRODUCERS · ISRAEL</text>
  <text class="he fg" x="300" y="124" font-size="20" text-anchor="middle" opacity="0.55">מהמקור</text>
</svg>
