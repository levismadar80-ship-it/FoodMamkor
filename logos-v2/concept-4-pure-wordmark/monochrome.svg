<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" role="img" aria-label="Mehamakor — pure wordmark monochrome">
  <title>Mehamakor — Pure Wordmark with Custom Detail (single-color)</title>
  <desc>Monochrome variant: the signature dot replacing the second "o" stays, but in foreground color rather than accent. The custom letterform detail still reads at small sizes.</desc>
  <style>
    :root { --fg: #2E6853; --bg: #F5F0E8; }
    @media (prefers-color-scheme: dark) { :root { --fg: #F5F0E8; --bg: #1A1A1A; } }
    .bg { fill: var(--bg); } .fg { fill: var(--fg); }
    .wm { font-family: 'Cormorant Garamond', 'EB Garamond', Georgia, serif; font-weight: 500; letter-spacing: 0.025em; }
    .tag { font-family: 'DM Sans', system-ui, sans-serif; font-weight: 500; letter-spacing: 0.22em; }
  </style>
  <rect class="bg" width="800" height="240"/>
  <text class="wm fg" x="148" y="135" font-size="84">Mehamak</text>
  <circle class="fg" cx="540" cy="116" r="22"/>
  <text class="wm fg" x="568" y="135" font-size="84">r</text>
  <text class="tag fg" x="148" y="170" font-size="11" opacity="0.7">LOCAL FOOD · REAL PRODUCERS · ISRAEL</text>
</svg>
