<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" role="img" aria-label="Mehamakor wordmark with three-dot system">
  <title>Mehamakor wordmark with three-dot system</title>
  <style>
    :root { --fg: #2E6853; --bg: #F5F0E8; --orange: #C8632E; --gold: #C99846; --green: #2E6853; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #F5F0E8; --bg: #1A1A1A; --green: #6FB89A; }
    }
    .bg { fill: var(--bg); } .fg { fill: var(--fg); }
    .d-orange { fill: var(--orange); } .d-gold { fill: var(--gold); } .d-green { fill: var(--green); }
    .wm { font-family: 'Cormorant Garamond', 'EB Garamond', Georgia, serif; font-weight: 500; letter-spacing: 0.025em; }
    .he { font-family: 'Frank Ruhl Libre', 'Noto Serif Hebrew', serif; font-weight: 500; }
    .tag { font-family: 'DM Sans', system-ui, sans-serif; font-weight: 500; letter-spacing: 0.22em; }
  </style>
  <rect class="bg" width="600" height="160"/>
  <circle class="d-orange" cx="276" cy="34" r="8"/>
  <circle class="d-gold" cx="300" cy="34" r="8"/>
  <circle class="d-green" cx="324" cy="34" r="8"/>
  <text class="wm fg" x="300" y="92" font-size="62" text-anchor="middle">Mehamakor</text>
  <text class="tag fg" x="300" y="118" font-size="10" text-anchor="middle" opacity="0.62">LOCAL FOOD · REAL PRODUCERS · ISRAEL</text>
  <text class="he fg" x="300" y="144" font-size="20" text-anchor="middle" opacity="0.55">מהמקור</text>
</svg>
